<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>模块 B 练习 · 函数与复合函数</title><style>
:root{--bg:#F4F6FB;--surface:#fff;--ink:#1B1B2A;--muted:#6A6A82;--line:#E3E6F0;--indigo:#4A43C4;--indigo-deep:#2E2A6B;--indigo-soft:#EEF0FC;--amber:#C77A15;--amber-soft:#FCF2DF;--green:#1F8A5B;--green-soft:#E6F5EE;--rose:#C0453B;--rose-soft:#FBEDEC;--shadow:0 1px 2px rgba(30,30,60,.05),0 8px 24px rgba(30,30,60,.06);--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7;font-size:16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 20px}
.top-row{display:flex;align-items:center;gap:14px;max-width:820px;margin:0 auto;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--indigo);font-weight:700;text-transform:uppercase}
h1.title{margin:2px 0 0;font-size:18px;font-weight:800;color:var(--indigo-deep)}
.timer{margin-left:auto;display:flex;align-items:center;gap:8px}
.timer .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;color:var(--indigo-deep);min-width:74px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.timer button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--indigo-deep)}
.wrap{max-width:820px;margin:24px auto;padding:0 20px}
.intro{background:var(--indigo-soft);border:1px solid #D9DCF6;border-radius:14px;padding:16px 18px;margin-bottom:20px}.intro b{color:var(--indigo-deep)}
.part{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:22px}
.part-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.part-num{font-size:14px;font-weight:800;color:#fff;background:var(--indigo);border-radius:8px;padding:2px 11px}
.part-head h2{margin:0;font-size:19px;font-weight:800;color:var(--indigo-deep)}
.diff{font-size:12px;font-weight:800;border-radius:99px;padding:3px 11px;margin-left:auto}
.diff.adv{background:var(--indigo-soft);color:var(--indigo)}.diff.core{background:var(--indigo-soft);color:var(--indigo)}.diff.gk{background:var(--amber-soft);color:var(--amber)}.diff.hard{background:var(--rose-soft);color:var(--rose)}
.part-note{color:var(--muted);font-size:13.5px;margin:6px 0 12px}
ol.q{margin:6px 0;padding-left:6px;list-style:none;counter-reset:qq}
ol.q li{counter-increment:qq;position:relative;padding:11px 0 11px 44px;border-bottom:1px dashed #EDEFF7;font-size:16.5px}
ol.q li:last-child{border-bottom:none}
ol.q li::before{content:counter(qq);position:absolute;left:0;top:10px;width:30px;height:26px;background:var(--indigo-soft);color:var(--indigo);border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:800}
.reveal{margin-top:14px;background:var(--indigo);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.reveal:hover{background:#3a34a8}
.answer{max-height:0;overflow:hidden;transition:max-height .4s ease}.answer.open{max-height:2600px;margin-top:14px}
.answer-inner{background:var(--green-soft);border:1px solid #CFEBDD;border-radius:12px;padding:14px 18px}
.answer-inner h4{margin:0 0 8px;color:#14653f;font-size:14px}.answer-inner ol{margin:0;padding-left:22px}.answer-inner li{margin:5px 0;font-size:14.5px}.answer-inner b{color:#14653f}
.foot{background:var(--amber-soft);border-radius:14px;padding:16px 18px;color:#7a5210;font-size:14.5px}.foot b{color:#7a5210}
@media print{header.top{position:static}.timer,.reveal{display:none}.answer{max-height:none!important}.part{box-shadow:none;break-inside:avoid}}
:focus-visible{outline:3px solid #A9A4F0;outline-offset:2px;border-radius:6px}
</style></head><body><header class="top"><div class="top-row"><div><div class="eyebrow">讲义 03 · 模块 B 练习</div><h1 class="title">函数与复合函数</h1></div><div class="timer"><span class="clock" id="clock">00:00</span><button id="swBtn" onclick="swToggle()">开始</button><button onclick="swReset()">清零</button></div></div></header><div class="wrap"><div class="intro"><p><b>34 题，覆盖模块 B 全部考点</b>：函数记号 → 复合 → 反函数 → 图象变换 → 三类难题(fg=gf / 旋转 / 函数方程)。前四部分是地基，第 E 部分是光剑难度。做完一整部分再对答案。</p></div><div id="list"></div><div class="foot"><p><b>批改重点：</b>① 复合函数看清"先做哪个"(fg 是先 g)；② 反函数别把 f⁻¹ 当倒数；③ 图象变换 x 的平移方向相反、a&lt;0 时最值对调；④ 难题三套路各记一句(fg=gf 用 Δ=0；旋转 x、y 都变号；函数方程反推该代哪个 x)。做完把错题号发我。</p></div></div><script>const PARTS=[{"num": "A", "title": "函数记号与求值", "dcls": "adv", "diff": "进阶", "note": "把 x 整个换掉即可；f(x) 不是 f 乘 x。", "q": ["f(x) = 2x − 5，求 f(3)", "f(x) = x² − 2x，求 f(−3)", "f(x) = 3 − 4x，求 f(1/2)", "f(x) = 2x + 1，求 f(a − 1)", "f(x) = x²，求 f(x + 1) − f(x)", "g(x) = x² + 3，已知 g(a) = 12，求 a", "f(x) = (x + 1)/(x − 1)，求 f(3)", "f: x ↦ 5 − 2x，已知 f(a) = 1，求 a"], "a": ["1", "(−3)²−2(−3) = 9+6 = **15**", "3 − 4·½ = **1**", "2(a−1)+1 = **2a − 1**", "(x+1)²−x² = **2x + 1**", "a²+3=12 → a² = 9 → **a = ±3**", "4/2 = **2**", "5−2a=1 → **a = 2**"]}, {"num": "B", "title": "复合函数", "dcls": "core", "diff": "核心", "note": "fg(x)=f(g(x))，从右往左；fg 一般 ≠ gf。", "q": ["f(x) = x + 3，g(x) = 2x，求 fg(x)", "（承上）求 gf(x)", "f(x) = 2x − 1，求 ff(x)", "f(x) = x²，g(x) = x − 2，求 fg(x)", "（承上）求 gf(x)", "f(x) = 2x − 1，解 fff(x) = 57", "f(x) = x + 2，g(x) = 3x − 1，求 fg(2)", "f(x) = x²，g(x) = x + 1，求 gf(x) − fg(x)"], "a": ["f(2x) = **2x + 3**", "g(x+3) = **2x + 6**", "2(2x−1)−1 = **4x − 3**", "**(x − 2)²**（= x²−4x+4）", "**x² − 2**", "fff(x) = 8x − 7 = 57 → **x = 8**", "fg(2)=f(5)= **7**", "(x²+1) − (x+1)² = **−2x**"]}, {"num": "C", "title": "反函数", "dcls": "adv", "diff": "进阶", "note": "三步法：y=f(x) → 解出 x → 换回 x。求某点值可直接反解。", "q": ["f(x) = x − 7，求 f⁻¹(x)", "f(x) = 5x，求 f⁻¹(x)", "f(x) = 2x + 3，求 f⁻¹(x)", "f(x) = (x − 4)/3，求 f⁻¹(x)", "f(x) = 3x − 2，求 f⁻¹(7)", "f(x) = 2x + 1，求 f⁻¹(f⁻¹(5))"], "a": ["**x + 7**", "**x/5**", "**(x − 3)/2**", "**3x + 4**", "3x−2=7 → **x = 3**", "f⁻¹(x)=(x−1)/2；f⁻¹(5)=2，f⁻¹(2)= **1/2**"]}, {"num": "D", "title": "图象变换", "dcls": "gk", "diff": "光剑常考", "note": "+k 上移；f(x+k) 左移；−f 上下翻；a·f 纵向伸缩(a<0 最值对调)。", "q": ["y=f(x) 过 (3, 4)，求 y = f(x) + 2 上对应点", "y=f(x) 过 (3, 4)，求 y = f(x + 1) 上对应点", "y=f(x) 最大点 (2, 5)，求 y = −f(x) 的对应点及最值", "y=f(x) 最大点 (1, 3)，求 y = 2f(x) + 1 的最大点", "（挑战）y=f(x) 最大点 (2, 6)、最小点 (−1, −4)，求 y = −f(x − 3) 的最大、最小点", "（挑战）y=f(x) 最小点 (0, −2)，求 y = −3f(x + 1) 的最大点"], "a": ["**(3, 6)**", "x+1=3 → x=2 → **(2, 4)**", "**(2, −5)**，变成最小值点", "**(1, 2·3+1) = (1, 7)**", "x−3=2→x=5：−6(最小)；x−3=−1→x=2：+4(最大) → **最大 (2, 4)，最小 (5, −6)**", "x+1=0→x=−1：−3·(−2)=6 → **最大点 (−1, 6)**"]}, {"num": "E", "title": "难题：fg=gf · 旋转 · 函数方程", "dcls": "hard", "diff": "光剑难度", "note": "算两边→令相等；旋转 x、y 都变号；函数方程反推该代哪个 x。", "q": ["f(x) = 2x − a（a ≠ 0），g(x) = x² − 6x。若 fg(x) = gf(x) 只有一个实数解，求 a", "f(x) = x + a，g(x) = 3x。若 fg(x) = gf(x) 对所有 x 成立，求 a", "曲线 y = x² − 4x 绕原点旋转 180° 后的方程", "曲线 y = −(x − p)(x − 3 − q) + p 绕原点旋转 180° 后得到 y = (x − 3)² + 4，求 p + q", "f(x) + 2f(1 − x) = x 对所有 x 成立，求 f(3)", "2ˣ + x·f(2⁻ˣ) = x² + x³ 对所有 x 成立，求 f(8)"], "a": ["fg=2x²−12x−a，gf=4x²−4ax+a²−12x+6a；令相等 → 2x²−4ax+(a²+7a)=0；Δ=0 → 8a(a−7)=0；a≠0 → **a = 7**", "fg=3x+a，gf=3x+3a；对所有 x 相等 → a=3a → **a = 0**", "(x,y)→原(−x,−y)：−y=(−x)²−4(−x)=x²+4x → **y = −x² − 4x**", "旋转后 y=(x+p)(x+3+q)−p，一次项 p+q+3=−6 → **p + q = −9**", "代 x=3、x=−2 联立：f(3)+2f(−2)=3、2f(3)+f(−2)=−2 → **f(3) = −7/3**", "要 2⁻ˣ=8 → x=−3；1/8 − 3f(8) = 9−27 = −18 → **f(8) = 145/24**"]}];
const list=document.getElementById('list');
PARTS.forEach(P=>{const c=document.createElement('div');c.className='part';
 const qs=P.q.map(t=>`<li>${t}</li>`).join('');const as=P.a.map(t=>`<li>${t}</li>`).join('');
 c.innerHTML=`<div class="part-head"><span class="part-num">${P.num}</span><h2>${P.title}</h2><span class="diff ${P.dcls}">${P.diff}</span></div><p class="part-note">${P.note}</p><ol class="q">${qs}</ol><button class="reveal" onclick="ans(this)">显示 ${P.num} 部分答案</button><div class="answer"><div class="answer-inner"><h4>${P.num} 部分答案</h4><ol>${as}</ol></div></div>`;
 list.appendChild(c);});
function ans(b){const x=b.nextElementSibling;const o=x.classList.toggle('open');b.textContent=o?b.textContent.replace('显示','隐藏'):b.textContent.replace('隐藏','显示');}
let sw={t:0,run:false,id:null};function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function swToggle(){const b=document.getElementById('swBtn');if(sw.run){clearInterval(sw.id);sw.run=false;b.textContent='继续';}else{sw.run=true;b.textContent='暂停';sw.id=setInterval(()=>{sw.t++;document.getElementById('clock').textContent=fmt(sw.t);},1000);}}
function swReset(){clearInterval(sw.id);sw={t:0,run:false,id:null};document.getElementById('clock').textContent='00:00';document.getElementById('swBtn').textContent='开始';}
</script></body></html>
