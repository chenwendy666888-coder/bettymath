<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光剑数学讲义 03 · 函数与复合函数</title>
<style>
  :root{
    --bg:#F4F6FB;--surface:#FFFFFF;--ink:#1B1B2A;--muted:#6A6A82;--line:#E3E6F0;
    --indigo:#4A43C4;--indigo-deep:#2E2A6B;--indigo-soft:#EEF0FC;
    --amber:#C77A15;--amber-soft:#FCF2DF;--green:#1F8A5B;--green-soft:#E6F5EE;

    --shadow:0 1px 2px rgba(30,30,60,.05), 0 8px 24px rgba(30,30,60,.06);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;}
  header.top{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;}
  .top-row{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto;}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--indigo);font-weight:700;text-transform:uppercase;}
  .brand h1{margin:0;font-size:17px;font-weight:800;color:var(--indigo-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prog-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:180px;}
  .prog-label{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .prog-track{flex:1;height:8px;background:#DDE1EE;border-radius:99px;overflow:hidden;min-width:90px;}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--indigo),#7A73E6);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer;color:var(--indigo-deep);}
  .layout{display:grid;grid-template-columns:262px 1fr;gap:30px;max-width:1180px;margin:26px auto;padding:0 22px;align-items:start;}
  nav.toc{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);}
  .toc h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 8px 10px;font-weight:700;}
  .toc a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14.5px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;}
  .toc a:hover{background:var(--indigo-soft);}
  .toc a.active{background:var(--indigo-soft);border-color:#D5D8F5;font-weight:700;color:var(--indigo-deep);}
  .toc .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--indigo);font-size:13px;width:22px;flex:none;}
  .toc a.active .n{color:var(--indigo-deep);}
  .toc .lbl{flex:1;min-width:0;}
  .toc .tick{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid #CBD0E4;display:grid;place-items:center;font-size:10px;color:#fff;}
  .toc a.done .tick{background:var(--green);border-color:var(--green);}
  .toc a.done .tick::after{content:"✓";}
  main{min-width:0;}
  section.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 34px 30px;animation:rise .4s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px;}
  .sec-num{font-size:34px;font-weight:800;color:var(--indigo);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:none;padding-top:2px;}
  .sec-titles{flex:1;min-width:0;}
  .sec-titles h2{margin:0;font-size:23px;font-weight:800;color:var(--indigo-deep);letter-spacing:-.01em;}
  .badge{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;}
  .badge.gk{background:var(--amber-soft);color:var(--amber);}
  .badge.core{background:var(--indigo-soft);color:var(--indigo);}
  .badge.warn,.badge.hard{background:var(--rose-soft);color:var(--rose);}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  h3.blk{font-size:15px;font-weight:800;color:var(--indigo);margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  h3.blk::before{content:"";width:5px;height:16px;border-radius:3px;background:var(--indigo);display:inline-block;}
  p{margin:10px 0;}
  .content b{color:var(--indigo-deep);}
  .content ul,.content ol{margin:10px 0;padding-left:22px;}
  .content li{margin:6px 0;}
  .kbd-formula{display:block;background:var(--indigo-soft);border:1px solid #D9DCF6;border-radius:10px;padding:14px 18px;margin:14px 0;font-size:18px;text-align:center;color:var(--indigo-deep);font-weight:700;letter-spacing:.01em;}
  .example{background:#FBFBFE;border:1px solid var(--line);border-left:4px solid var(--indigo);border-radius:12px;padding:16px 18px;margin:16px 0;}
  .ex-title{font-weight:800;color:var(--indigo-deep);font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ex-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#EDEEF6;color:var(--muted);}
  .ex-tag.gk{background:var(--amber-soft);color:var(--amber);}
  .steps{margin:8px 0;}
  .step{position:relative;padding:5px 0 5px 20px;}
  .step::before{content:"";position:absolute;left:5px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--indigo);}
  .ex-ans{margin-top:10px;background:var(--green-soft);border-radius:8px;padding:8px 12px;font-weight:800;color:var(--green);}
  .note{background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14.5px;color:#7a5210;}
  .note.warn{background:var(--rose-soft);color:#8c2f28;}
  .note strong{color:inherit;}
  .practice{background:#FFFFFF;border:1.5px dashed #C9CEE6;border-radius:12px;padding:16px 18px;margin:18px 0;}
  .practice-head{font-weight:800;color:var(--indigo-deep);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .practice-head::before{content:"✎";color:var(--indigo);}
  .reveal{margin-top:10px;background:var(--indigo);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s;}
  .reveal:hover{background:#3a34a8;}
  .reveal:active{transform:translateY(1px);}
  .answer{max-height:0;overflow:hidden;transition:max-height .35s ease;margin-top:0;}
  .answer.open{max-height:1600px;margin-top:12px;}
  .answer-inner{background:var(--green-soft);border-radius:10px;padding:12px 16px;font-size:14.5px;}
  .answer-inner b{color:var(--green);}
  .machine{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0;font-size:15px;}
  .machine .box{background:var(--indigo);color:#fff;font-weight:800;border-radius:12px;padding:12px 18px;box-shadow:var(--shadow);}
  .machine .io{background:var(--indigo-soft);color:var(--indigo-deep);font-weight:700;border-radius:9px;padding:8px 14px;}
  .machine .arr{color:var(--indigo);font-weight:800;font-size:20px;}
  .check-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;}
  .check-item:last-child{border-bottom:none;}
  .check-box{width:20px;height:20px;border:2px solid #C4C9E0;border-radius:6px;flex:none;margin-top:3px;display:grid;place-items:center;color:#fff;font-size:13px;transition:background .15s,border-color .15s;}
  .check-item.on .check-box{background:var(--green);border-color:var(--green);}
  .check-item.on .check-box::after{content:"✓";}
  .check-item.on .check-txt{color:var(--muted);text-decoration:line-through;}
  .parent{background:var(--indigo-soft);border-radius:12px;padding:16px 18px;margin-top:22px;}
  .parent h4{margin:0 0 6px;color:var(--indigo-deep);}
  .pager{display:flex;align-items:center;gap:12px;margin-top:26px;}
  .pager button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--indigo-deep);transition:background .15s,border-color .15s,transform .1s;}
  .pager button:hover:not(:disabled){background:var(--indigo-soft);border-color:#CFD3F0;}
  .pager button:active:not(:disabled){transform:translateY(1px);}
  .pager button:disabled{opacity:.4;cursor:not-allowed;}
  .pager .done-btn{flex:1.3;background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .pager .done-btn:hover{background:#3a34a8;}
  .pager .done-btn.is-done{background:var(--green);border-color:var(--green);}
  .pager .done-btn.is-done:hover{background:#1a7550;}
  .scrim{display:none;}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;padding:0 16px;margin-top:16px;}
    .menu-btn{display:block;}
    nav.toc{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:50;border-radius:0 16px 16px 0;transform:translateX(-102%);transition:transform .28s ease;overflow-y:auto;padding-top:18px;}
    nav.toc.open{transform:none;}
    .scrim.show{display:block;position:fixed;inset:0;background:rgba(20,20,40,.4);z-index:40;}
    .prog-wrap{min-width:120px;}
    .brand h1{font-size:15px;white-space:normal;}
    section.card{padding:24px 20px;}
    .sec-num{font-size:28px;}
    .sec-titles h2{font-size:20px;}
    .pager{flex-wrap:wrap;}
    .pager .done-btn{order:-1;flex-basis:100%;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
  :focus-visible{outline:3px solid #A9A4F0;outline-offset:2px;border-radius:6px;}

.dltools{position:fixed;top:12px;right:14px;z-index:70;display:flex;gap:8px}
.dltools button{border:none;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;box-shadow:0 4px 12px rgba(30,30,60,.18)}
.dltools .b-md{background:#1F8A5B}.dltools .b-pdf{background:#4A43C4}
@media(max-width:860px){.dltools{top:auto;bottom:14px;right:12px}}
@media print{.top,nav.toc,.pager,.scrim,.dltools,.menu-btn,.prog-wrap,.hero,.sumbar,.back,.reset{display:none!important}
 .layout{display:block!important;margin:0!important;padding:0!important;grid-template-columns:1fr!important}
 main,.wrap{max-width:100%!important;margin:0!important}
 section.card{box-shadow:none!important;border:none!important;padding:0!important;animation:none!important}
 .answer{max-height:none!important;overflow:visible!important}
 .psec{page-break-after:always}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <button class="menu-btn" id="menuBtn" aria-label="打开目录">☰ 目录</button>
    <div class="brand">
      <span class="eyebrow">光剑数学 · 讲义 03</span>

<script>
const S = [
  {
    key:"intro", nav:"导读", num:"", track:false,
    title:"导读：这一份是全新的东西",
    body:`
      <p>模块 B 讲<b>函数</b>。这块国内初中基本不教这套写法（f(x)、复合函数 fg(x)、反函数 f⁻¹），所以对你是<b>全新</b>的——但它不难，只是"记号"陌生。把记号看懂，后面就顺了。</p>
      <h3 class="blk">前置</h3>
      <p>需要讲义 01（代数变形）和讲义 02（解方程、判别式）的底子。这一份会用到解一元二次方程、判别式 Δ。</p>
      <h3 class="blk">这一份怎么排</h3>
      <p>前四节（函数记号 → 复合 → 反函数 → 图象变换）是<b>地基</b>，一定要弄懂。后三节标了 <span class="badge hard">★ 光剑难度</span>，是光剑真题里最爱考的三种难题（fg=gf、曲线旋转、函数方程）——第一次看会觉得跳，把例题每步抄下来就好。</p>
      <div class="note">学法照旧：讲解 → 例题（抄一遍）→ 练习（先自己做，再点开答案）。每节点"学完了 ✓"进度条会涨。</div>
    `
  },
  {
    key:"s1", nav:"函数记号 f(x)", num:"01", track:true,
    title:"函数与函数记号 f(x)",
    body:`
      <h3 class="blk">讲解</h3>
      <p><b>函数</b>就是一台"输入 → 输出"的机器：给它一个数，它按规则吐出一个数。</p>
      <div class="machine"><span class="io">输入 x</span><span class="arr">→</span><span class="box">f</span><span class="arr">→</span><span class="io">输出 f(x)</span></div>
      <p><b>f(x)</b> 读作"f of x"，意思是"把 x 放进机器 f 得到的输出"。注意：<b>f(x) 不是 f 乘 x</b>，是"f 作用在 x 上"。</p>
      <p>比如 <b>f(x) = 2x − 3</b>，就是"输入乘 2 再减 3"这台机器：</p>
      <ul>
        <li>f(4) = 2·4 − 3 = 5　（把 x 换成 4）</li>
        <li>f(0) = 2·0 − 3 = −3</li>
        <li>f(−1) = 2·(−1) − 3 = −5</li>
      </ul>
<h3 class="blk">函数的"图象"长什么样</h3><p>把每个输入 x 和它的输出 f(x) 配成一个点 (x, f(x))，所有这些点连起来，就是这个函数的<b>图象</b>。比如 f(x)=2x−3 的图象是一条直线，f(0)=−3、f(2)=1 就是线上的两个点：</p><div style="display:flex;justify-content:center;margin:14px 0"><svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:250px;height:auto;background:#FBFBFE;border:1px solid #E3E6F0;border-radius:10px"><line x1="20.0" y1="15" x2="20.0" y2="165" stroke="#EEF0F6" stroke-width="1"/><line x1="40.0" y1="15" x2="40.0" y2="165" stroke="#EEF0F6" stroke-width="1"/><line x1="60.0" y1="15" x2="60.0" y2="165" stroke="#EEF0F6" stroke-width="1"/><line x1="80.0" y1="15" x2="80.0" y2="165" stroke="#EEF0F6" stroke-width="1"/><line x1="100.0" y1="15" x2="100.0" y2="165" stroke="#EEF0F6" stroke-width="1"/><line x1="120.0" y1="15" x2="120.0" y2="165" stroke="#EEF0F6" stroke-width="1"/><line x1="140.0" y1="15" x2="140.0" y2="165" stroke="#EEF0F6" stroke-width="1"/><line x1="160.0" y1="15" x2="160.0" y2="165" stroke="#EEF0F6" stroke-width="1"/><line x1="180.0" y1="15" x2="180.0" y2="165" stroke="#EEF0F6" stroke-width="1"/><line x1="200.0" y1="15" x2="200.0" y2="165" stroke="#EEF0F6" stroke-width="1"/><line x1="220.0" y1="15" x2="220.0" y2="165" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="165.0" x2="220" y2="165.0" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="150.0" x2="220" y2="150.0" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="135.0" x2="220" y2="135.0" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="120.0" x2="220" y2="120.0" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="105.0" x2="220" y2="105.0" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="90.0" x2="220" y2="90.0" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="75.0" x2="220" y2="75.0" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="60.0" x2="220" y2="60.0" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="45.0" x2="220" y2="45.0" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="30.0" x2="220" y2="30.0" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="15.0" x2="220" y2="15.0" stroke="#EEF0F6" stroke-width="1"/><line x1="20" y1="105.0" x2="222" y2="105.0" stroke="#9AA0B8" stroke-width="1.5"/><line x1="120.0" y1="13" x2="120.0" y2="165" stroke="#9AA0B8" stroke-width="1.5"/><text x="224" y="109.0" font-size="11" fill="#9AA0B8">x</text><text x="124.0" y="18" font-size="11" fill="#9AA0B8">y</text><polyline points="108.0,168.0 110.0,165.0 112.0,162.0 114.0,159.0 116.0,156.0 118.0,153.0 120.0,150.0 122.0,147.0 124.0,144.0 126.0,141.0 128.0,138.0 130.0,135.0 132.0,132.0 134.0,129.0 136.0,126.0 138.0,123.0 140.0,120.0 142.0,117.0 144.0,114.0 146.0,111.0 148.0,108.0 150.0,105.0 152.0,102.0 154.0,99.0 156.0,96.0 158.0,93.0 160.0,90.0 162.0,87.0 164.0,84.0 166.0,81.0 168.0,78.0 170.0,75.0 172.0,72.0 174.0,69.0 176.0,66.0 178.0,63.0 180.0,60.0 182.0,57.0 184.0,54.0 186.0,51.0 188.0,48.0 190.0,45.0 192.0,42.0 194.0,39.0 196.0,36.0 198.0,33.0 200.0,30.0 202.0,27.0 204.0,24.0 206.0,21.0 208.0,18.0 210.0,15.0" fill="none" stroke="#4A43C4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120.0" cy="150.0" r="3.5" fill="#C0453B"/><text x="126.0" y="144.0" font-size="11" font-weight="700" fill="#C0453B">(0,−3)</text><circle cx="160.0" cy="90.0" r="3.5" fill="#C0453B"/><text x="166.0" y="84.0" font-size="11" font-weight="700" fill="#C0453B">(2,1)</text><text x="120" y="178" font-size="11.5" font-weight="700" fill="#2E2A6B" text-anchor="middle">f(x)=2x−3 的图象</text></svg></div>
            <p><b>输入也可以是式子</b>：把 x 整个换掉就行。f(a+1) = 2(a+1) − 3 = 2a − 1。</p>
      <div class="note">光剑还常用箭头写法 <b>f: x ↦ 2x − 3</b>，意思和 f(x) = 2x − 3 完全一样。</div>
      <div class="example">
        <div class="ex-title">例 1</div>
        <p>f(x) = x² − 3x，求 f(2)、f(−1)、f(0)。</p>
        <div class="steps">
          <div class="step">f(2) = 2² − 3·2 = 4 − 6 = −2</div>
          <div class="step">f(−1) = (−1)² − 3·(−1) = 1 + 3 = 4</div>
          <div class="step">f(0) = 0 − 0 = 0</div>
        </div>
      </div>
      <div class="example">
        <div class="ex-title">例 2</div>
        <p>f(x) = 2x − 3，求 f(a)、f(x+1)、f(2x)。</p>
        <div class="steps">
          <div class="step">f(a) = 2a − 3（把 x 换成 a）</div>
          <div class="step">f(x+1) = 2(x+1) − 3 = 2x − 1</div>
          <div class="step">f(2x) = 2·(2x) − 3 = 4x − 3</div>
        </div>
      </div>
      <div class="example">
        <div class="ex-title">例 3</div>
        <p>g(x) = x² + 1，已知 g(a) = 10，求 a。</p>
        <div class="steps"><div class="step">a² + 1 = 10 → a² = 9 → a = ±3</div></div>
        <div class="ex-ans">a = 3 或 −3</div>
      </div>
      <div class="practice">
        <div class="practice-head">练习 1</div>
        <ol>

          <li>f: x ↦ 5 − 2x，求 f(3)</li>
          <li>f(x) = 2x + 1，求 f(x − 1)</li>
          <li>h(x) = x² − 4，已知 h(a) = 0，求 a</li>

        <button class="reveal" onclick="ans(this)">显示答案</button>
        <div class="answer"><div class="answer-inner">
          1. 17　2. 4+2 = 6　3. 5−6 = −1　4. 2(x−1)+1 = 2x−1　5. a²=4 → a = ±2

    key:"s2", nav:"复合函数", num:"02", track:true, badge:"core",
    title:"复合函数（两台机器接起来）",
    body:`
      <h3 class="blk">讲解</h3>
      <p>把两台机器接起来：先过一台，输出再进另一台。<b>fg(x) 的意思是 f(g(x))</b>——<b>先做 g，再把结果丢进 f</b>。</p>
      <div class="machine"><span class="io">x</span><span class="arr">→</span><span class="box">g</span><span class="arr">→</span><span class="io">g(x)</span><span class="arr">→</span><span class="box">f</span><span class="arr">→</span><span class="io">f(g(x))</span></div>
      <div class="note warn"><strong>看清顺序：</strong>fg 是"<b>从右往左</b>"读——先 g 后 f。而且一般 <b>fg ≠ gf</b>！</div>
      <p>ff(x) 就是 f(f(x))；fff(x) 就是 f(f(f(x)))，一层层往里代。</p>
      <div class="example">
        <div class="ex-title">例 1</div>
        <p>f(x) = x + 3，g(x) = 2x。求 fg(x)、gf(x)、fg(2)。</p>
        <div class="steps">
          <div class="step">fg(x) = f(g(x)) = f(2x) = 2x + 3</div>
          <div class="step">gf(x) = g(f(x)) = g(x+3) = 2(x+3) = 2x + 6　（和 fg 不一样！）</div>
          <div class="step">fg(2) = 2·2 + 3 = 7</div>
        </div>
      </div>
      <div class="example">
        <div class="ex-title">例 2 <span class="ex-tag gk">光剑真题型</span></div>
        <p>f(x) = 2x − 3，求 fff(x)，并解 fff(x) = 771。</p>
        <div class="steps">
          <div class="step">f(x) = 2x − 3</div>
          <div class="step">ff(x) = f(2x−3) = 2(2x−3) − 3 = 4x − 9</div>
          <div class="step">fff(x) = f(4x−9) = 2(4x−9) − 3 = 8x − 21</div>
          <div class="step">令 8x − 21 = 771 → 8x = 792 → x = 99</div>
        </div>
        <div class="ex-ans">x = 99</div>
      </div>
      <div class="example">
        <div class="ex-title">例 3</div>
        <p>f(x) = x + 2，g(x) = x²。求 fg(x) 和 gf(x)。</p>
        <div class="steps">
          <div class="step">fg(x) = f(x²) = x² + 2</div>
          <div class="step">gf(x) = g(x+2) = (x+2)² = x² + 4x + 4</div>
        </div>
      </div>
      <div class="practice">
        <div class="practice-head">练习 2</div>
        <ol>
          <li>f(x) = 3x，g(x) = x − 1，求 fg(x)</li>
          <li>同上，求 gf(x)</li>
          <li>f(x) = x + 4，求 ff(x)</li>
          <li>f(x) = 2x − 1，解 ff(x) = 13</li>
          <li>f(x) = x²，g(x) = x − 3，求 fg(x)</li>
        </ol>
        <button class="reveal" onclick="ans(this)">显示答案</button>
        <div class="answer"><div class="answer-inner">
          1. 3(x−1) = 3x − 3<br>
          2. 3x − 1<br>
          3. (x+4)+4 = x + 8<br>
          4. ff(x) = 2(2x−1)−1 = 4x−3 = 13 → x = 4<br>
          5. (x−3)²
        </div></div>
      </div>
    `
  },

    key:"s3", nav:"反函数", num:"03", track:true,
    title:"反函数 f⁻¹（机器倒着走）",
    body:`
      <h3 class="blk">讲解</h3>
      <p><b>反函数 f⁻¹</b> 把输出"还原"成输入——机器倒着走。若 f(a) = b，则 <b>f⁻¹(b) = a</b>。</p>
      <p><b>怎么求（三步）：</b></p>
      <ol>
        <li>写 y = f(x)；</li>
        <li>解出 x，用 y 表示；</li>
        <li>把 y 换成 x，就是 f⁻¹(x)。</li>
      </ol>
      <p>（注意：f⁻¹ 里的 "−1" 不是次方、不是倒数，是"反函数"的记号。）</p>
      <div class="example">
        <div class="ex-title">例 1</div>
        <p>f(x) = 3x + 1，求 f⁻¹(x)。</p>
        <div class="steps">
          <div class="step">y = 3x + 1</div>
          <div class="step">解 x：x = (y − 1) / 3</div>
          <div class="step">换回 x：f⁻¹(x) = (x − 1) / 3</div>
        </div>
        <div class="ex-ans">f⁻¹(x) = (x − 1) / 3</div>
      </div>
      <div class="example">
        <div class="ex-title">例 2</div>
        <p>f(x) = (x + 5) / 2，求 f⁻¹(x)。</p>
        <div class="steps">
          <div class="step">y = (x + 5)/2 → 2y = x + 5 → x = 2y − 5</div>
        </div>
        <div class="ex-ans">f⁻¹(x) = 2x − 5</div>
      </div>
      <div class="example">
        <div class="ex-title">例 3（更快的一招）</div>
        <p>f(x) = 2x − 3，求 f⁻¹(7)。</p>
        <div class="steps">
          <div class="step">f⁻¹(7) 就是"哪个 x 使 f(x) = 7"</div>
          <div class="step">2x − 3 = 7 → x = 5</div>
        </div>
        <div class="ex-ans">f⁻¹(7) = 5（求某一点的反函数值，不必先求整个 f⁻¹）</div>
      </div>
      <div class="practice">
        <div class="practice-head">练习 3</div>
        <ol>
          <li>f(x) = x + 6，求 f⁻¹(x)</li>
          <li>f(x) = 4x，求 f⁻¹(x)</li>
          <li>f(x) = 2x + 1，求 f⁻¹(x)</li>
          <li>f(x) = 3x − 5，求 f⁻¹(4)</li>
          <li>f(x) = (x − 1)/2，求 f⁻¹(x)</li>
        </ol>
        <button class="reveal" onclick="ans(this)">显示答案</button>
        <div class="answer"><div class="answer-inner">
          1. x − 6　2. x/4　3. (x−1)/2　4. 3x−5=4 → x = 3　5. 2x + 1
        </div></div>
      </div>
    `
  },

    body:`
      <h3 class="blk">讲解</h3>
      <p>对 f(x) 做一点改动，它的图象就会平移 / 翻折 / 伸缩。<b>规则表：</b></p>
      <ul>
        <li><b>f(x) + k</b>：整体上移 k（k 为负则下移）</li>
        <li><b>f(x + k)</b>：整体<b>左</b>移 k　<span style="color:#8c2f28">（方向相反！+k 往左）</span></li>
        <li><b>−f(x)</b>：关于 x 轴翻折（上下翻）</li>
        <li><b>f(−x)</b>：关于 y 轴翻折（左右翻）</li>

            <p><b>处理"最值点"的通法：</b>若 (p, q) 是 y = f(x) 的最值点，求 y = a·f(x + h) + k 上对应点——</p>
      <span class="kbd-formula">x 坐标：由 x + h = p 解出（内部变换，x 反着走）<br>y 坐标：q → a·q + k（a &lt; 0 时，最大 ↔ 最小 对调）</span>
      <div class="example">
        <div class="ex-title">例 1（先热身）</div>
        <p>y = f(x) 的最大值点是 (1, 2)。</p>
        <div class="steps">
          <div class="step">y = f(x) + 3 的最大点：(1, 2+3) = (1, 5)</div>
          <div class="step">y = f(x − 2) 的最大点：x−2=1 → x=3，得 (3, 2)</div>
          <div class="step">y = −f(x) 的情况：(1, −2)，且"最大"变"最小"</div>
        </div>
      </div>
      <div class="example">
        <div class="ex-title">例 2 <span class="ex-tag gk">光剑真题型</span></div>
        <p>y = f(x) 的最大值点是 (1, 2)、最小值点是 (5, −5)。求 y = −2f(3 − x) 的最大、最小值点。</p>
        <div class="steps">
          <div class="step">看内部 3 − x。令 3 − x = 1 → x = 2，此处 f = 2，×(−2) = −4</div>
          <div class="step">因为系数 −2 &lt; 0，最大 ↔ 最小对调 → 点 (2, −4) 是<b>最小</b>值点</div>
          <div class="step">令 3 − x = 5 → x = −2，此处 f = −5，×(−2) = 10 → 点 (−2, 10) 是<b>最大</b>值点</div>
        </div>
        <div class="ex-ans">最大值点 (−2, 10)，最小值点 (2, −4)</div>
      </div>
      <div class="practice">
        <div class="practice-head">练习 4</div>
        <ol>
          <li>y = f(x) 过点 (2, 3)，求 y = f(x) + 4 上对应点</li>
          <li>y = f(x) 过点 (2, 3)，求 y = f(x − 1) 上对应点</li>
          <li>y = f(x) 最大点 (0, 5)，求 y = −f(x) 的对应点及最大/最小</li>
          <li>（挑战）y = f(x) 最大点 (2, 4)，求 y = 3f(x) − 1 的最大点</li>
          <li>（挑战）y = f(x) 最小点 (1, −3)，求 y = −f(x + 2) 的最大点</li>
        </ol>
        <button class="reveal" onclick="ans(this)">显示答案</button>
        <div class="answer"><div class="answer-inner">
          1. (2, 7)<br>
          2. x−1=2 → x=3，(3, 3)<br>
          3. (0, −5)，变成最小值点<br>
          4. (2, 3·4−1) = (2, 11)<br>
          5. x+2=1 → x=−1，−(−3)=3 → (−1, 3)，是最大点
        </div></div>
      </div>

    title:"难题一：fg(x) = gf(x) 型",
    body:`
      <h3 class="blk">讲解</h3>
      <p><b>套路：</b>把 fg(x) 和 gf(x) 分别算出来，令它们相等，整理成一个方程。若题目要"<b>只有一个实数解</b>"，就让<b>判别式 Δ = 0</b>（这就用上讲义 02 的判别式了）。</p>
      <div class="example">
        <div class="ex-title">例 <span class="ex-tag gk">光剑真题</span></div>
        <p>f(x) = 2x − a（a ≠ 0），g(x) = x² − 6x。若 fg(x) = gf(x) 只有一个实数解，求 a。</p>
        <div class="steps">
          <div class="step"><b>算 fg：</b>fg(x) = f(g(x)) = 2(x²−6x) − a = 2x² − 12x − a</div>
          <div class="step"><b>算 gf：</b>gf(x) = g(2x−a) = (2x−a)² − 6(2x−a) = 4x² − 4ax + a² − 12x + 6a</div>
          <div class="step"><b>令相等、移项：</b>2x² − 12x − a = 4x² − 4ax + a² − 12x + 6a</div>
          <div class="step">→ 0 = 2x² − 4ax + a² + 7a，即 2x² − 4ax + (a² + 7a) = 0</div>
          <div class="step"><b>只有一个解 → Δ = 0：</b>(−4a)² − 4·2·(a²+7a) = 0 → 16a² − 8a² − 56a = 0 → 8a² − 56a = 0</div>
          <div class="step">8a(a − 7) = 0 → a = 0 或 7；因 a ≠ 0，取 a = 7</div>
        </div>
        <div class="ex-ans">a = 7</div>
      </div>
      <div class="note"><strong>三步记牢：</strong>算 fg、算 gf → 令相等整理成二次方程 → "一个解"就用 Δ = 0。</div>
      <div class="practice">
        <div class="practice-head">练习 5</div>
        <ol>
          <li>f(x) = x + 2，g(x) = 3x。求 fg(x) 和 gf(x)，它们相等吗？</li>
          <li>（挑战）f(x) = x + a，g(x) = 2x。若 fg(x) = gf(x) 对所有 x 成立，求 a</li>
          <li>（挑战·光剑型）f(x) = 2x − a，g(x) = x² − 4x。若 fg(x) = gf(x) 只有一个实数解，求 a</li>
        </ol>
        <button class="reveal" onclick="ans(this)">显示答案</button>
        <div class="answer"><div class="answer-inner">
          1. fg = 3x+2，gf = 3(x+2) = 3x+6，<b>不相等</b><br>
          2. fg = 2x+a，gf = 2(x+a) = 2x+2a，对所有 x 相等 → a = 2a → <b>a = 0</b><br>
          3. fg = 2x²−8x−a，gf = 4x²−4ax+a²−8x+4a；令相等 → 2x²−4ax+(a²+5a)=0；Δ=0 → 16a²−8(a²+5a)=0 → 8a²−40a=0 → <b>a = 0 或 5</b>
        </div></div>
      </div>
    `
  },

    key:"s6", nav:"曲线变换与旋转", num:"06", track:true, badge:"hard",
    title:"难题二：曲线的翻折与旋转",
    body:`
      <h3 class="blk">讲解</h3>
      <p>对<b>整条曲线</b> y = f(x) 做变换，用"<b>代换</b>"求新方程。核心：</p>
      <ul>
        <li>关于 <b>x 轴</b>翻折：y → −y（新方程把 y 换成 −y）</li>
        <li>关于 <b>y 轴</b>翻折：x → −x</li>
        <li>绕<b>原点旋转 180°</b>：(x, y) → (−x, −y)，即 x → −x 且 y → −y 一起做</li>
      </ul>
      <p><b>方法：</b>新曲线上的点 (x, y)，对应回原曲线的点是 (−x, −y)（旋转的情形），把它代进原方程即可。</p>
      <div class="example">
        <div class="ex-title">例 <span class="ex-tag gk">光剑真题</span></div>
        <p>曲线 y = −(x − p)(x − 3 − q) + p 绕原点旋转 180° 后得到 y = (x − 3)² + 4，求 p + q。</p>
        <div class="steps">
          <div class="step"><b>旋转 180°：</b>新曲线上的 (x, y) 对应原曲线的 (−x, −y)，代入原方程</div>
          <div class="step">−y = −(−x − p)(−x − 3 − q) + p</div>
          <div class="step">注意 (−x−p) = −(x+p)，(−x−3−q) = −(x+3+q)，两个负号相乘变正</div>
          <div class="step">−y = −(x+p)(x+3+q) + p → y = (x+p)(x+3+q) − p</div>
          <div class="step"><b>展开：</b>= x² + (p+q+3)x + (2p + pq)</div>
          <div class="step"><b>目标</b> (x−3)²+4 = x² − 6x + 13，比较<b>一次项</b>：p + q + 3 = −6</div>
        </div>
        <div class="ex-ans">p + q = −9</div>
      </div>
      <div class="note"><strong>要点：</strong>旋转 180° = 同时把 x 换成 −x、y 换成 −y；然后展开、对照系数。这里只问 p+q，看一次项系数就够了。</div>
      <div class="practice">
        <div class="practice-head">练习 6</div>
        <ol>
          <li>曲线 y = 2x + 1 关于 x 轴翻折后的方程</li>
          <li>曲线 y = x² − 3x 关于 y 轴翻折后的方程</li>
          <li>（挑战）点 (2, 5) 绕原点旋转 180° 后到哪里？</li>
          <li>（挑战）曲线 y = x² + 2x 绕原点旋转 180° 后的方程</li>
        </ol>
        <button class="reveal" onclick="ans(this)">显示答案</button>
        <div class="answer"><div class="answer-inner">
          1. −y = 2x+1 → y = −2x − 1<br>
          2. 把 x 换成 −x：y = (−x)² − 3(−x) = x² + 3x<br>
          3. (−2, −5)<br>
          4. 把 x→−x、y→−y：−y = (−x)²+2(−x) = x²−2x → y = −x² + 2x
        </div></div>
      </div>
    `

    title:"难题三：函数方程（求 f 在某点的值）",
    body:`
      <h3 class="blk">讲解</h3>
      <p>题目给一个<b>对所有 x 成立</b>的等式，里面藏着未知函数 f，让你求 f 在某个点的值。<b>两种利器：</b></p>
      <ol>
        <li><b>代特殊值</b>：想求 f(8)，就让 f 的括号里等于 8，反推该代入哪个 x。</li>
        <li><b>代换联立</b>：用 x → −x（或 x → 1−x 等）再得一个等式，两式联立解出要求的量。</li>
      </ol>
      <div class="example">
        <div class="ex-title">例 1（代换联立）</div>
        <p>f(x) + 2f(1 − x) = x 对所有 x 成立，求 f(3)。</p>
        <div class="steps">
          <div class="step">代 x = 3：f(3) + 2f(−2) = 3</div>
          <div class="step">代 x = −2：f(−2) + 2f(3) = −2</div>
          <div class="step">设 f(3) = A、f(−2) = B：A + 2B = 3，且 2A + B = −2</div>
          <div class="step">解得 A = −7/3</div>
        </div>
        <div class="ex-ans">f(3) = −7/3</div>
      </div>
      <div class="example">
        <div class="ex-title">例 2 <span class="ex-tag gk">光剑真题</span></div>
        <p>2ˣ + x·f(2⁻ˣ) = x² + x³ 对所有 x 成立，求 f(8)。</p>
        <div class="steps">
          <div class="step"><b>想让 f 的括号 = 8：</b>需 2⁻ˣ = 8 = 2³ → −x = 3 → <b>x = −3</b></div>
          <div class="step">代 x = −3：2⁻³ + (−3)·f(2³) = (−3)² + (−3)³</div>
          <div class="step">即 1/8 − 3f(8) = 9 − 27 = −18</div>
          <div class="step">−3f(8) = −18 − 1/8 = −145/8 → f(8) = 145/24</div>
        </div>
        <div class="ex-ans">f(8) = 145/24</div>
      </div>
      <div class="note"><strong>关键一步：</strong>要求 f(某数)，先想"括号里等于这个数时，x 应该取几"，再把那个 x 代进去。</div>
      <div class="practice">
        <div class="practice-head">练习 7</div>
        <ol>
          <li>若 f(x) = x² + x，求 f(x) + f(−x)</li>
          <li>（挑战）2f(x) + f(1 − x) = x 对所有 x 成立，求 f(0) 和 f(1)</li>
          <li>（挑战·光剑型）3ˣ + x·f(3⁻ˣ) = x + x² 对所有 x 成立，求 f(9)</li>
        </ol>
        <button class="reveal" onclick="ans(this)">显示答案</button>
        <div class="answer"><div class="answer-inner">
          1. (x²+x) + (x²−x) = <b>2x²</b><br>
          2. 代 x=0：2f(0)+f(1)=0；代 x=1：2f(1)+f(0)=1。解得 f(0) = −1/3，f(1) = 2/3<br>
          3. 要 3⁻ˣ = 9 = 3² → x = −2。代入：1/9 + (−2)f(9) = −2 + 4 = 2 → −2f(9) = 17/9 → <b>f(9) = −17/18</b>
        </div></div>
      </div>
    `

const tocList=document.getElementById('tocList');
const content=document.getElementById('content');
const progFill=document.getElementById('progFill');
const progLabel=document.getElementById('progLabel');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const doneBtn=document.getElementById('doneBtn');
let cur=0;
const done=new Set();
const trackedTotal=S.filter(s=>s.track).length;

S.forEach((s,i)=>{
  const a=document.createElement('a');
  a.dataset.i=i;
  a.innerHTML=`<span class="n">${s.num||'·'}</span><span class="lbl">${s.nav}</span><span class="tick"></span>`;
  a.onclick=()=>go(i);
  tocList.appendChild(a);
});
const tocLinks=[...tocList.children];

function render(){
  const s=S[cur];
  const badgeHtml = s.badge==='gk' ? '<span class="badge gk">★ 光剑常考</span>'
    : s.badge==='core' ? '<span class="badge core">★ 核心工具</span>'
    : s.badge==='hard' ? '<span class="badge hard">★ 光剑难度</span>'
    : s.badge==='warn' ? '<span class="badge warn">⚠ 易错</span>' : '';
  content.innerHTML=`
    <div class="sec-head">
      ${s.num?`<div class="sec-num">${s.num}</div>`:''}
      <div class="sec-titles"><h2>${s.title}</h2>${badgeHtml}</div>
    </div>
    <div class="divider"></div>
    ${s.body}`;
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
  prevBtn.disabled = cur===0;
  nextBtn.disabled = cur===S.length-1;
  if(s.track){
    doneBtn.style.display='';
    const isDone=done.has(cur);
    doneBtn.textContent=isDone?'已学完 ✓':'学完了 ✓';
    doneBtn.classList.toggle('is-done',isDone);
  }else{ doneBtn.style.display='none'; }
  content.focus({preventScroll:true});
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));render();closeMenu();}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
doneBtn.onclick=()=>{
  if(!S[cur].track) return;
  if(done.has(cur)) done.delete(cur); else done.add(cur);
  updateProgress(); render();
  if(done.has(cur) && cur<S.length-1) setTimeout(()=>go(cur+1),260);
};
function updateProgress(){
  const n=[...done].filter(i=>S[i].track).length;
  progFill.style.width=(n/trackedTotal*100)+'%';
  progLabel.textContent=`${n} / ${trackedTotal} 节`;
  tocLinks.forEach((a,i)=>a.classList.toggle('done',done.has(i)&&S[i].track));
}
function ans(btn){const box=btn.nextElementSibling;const open=box.classList.toggle('open');btn.textContent=open?'隐藏答案':'显示答案';}
function tick(el){el.classList.toggle('on');}
const toc=document.getElementById('toc');
const scrim=document.getElementById('scrim');
document.getElementById('menuBtn').onclick=()=>{toc.classList.add('open');scrim.classList.add('show');};
function closeMenu(){toc.classList.remove('open');scrim.classList.remove('show');}
scrim.onclick=closeMenu;
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON') return;
  if(e.key==='ArrowRight'&&cur<S.length-1) go(cur+1);
  if(e.key==='ArrowLeft'&&cur>0) go(cur-1);
});
render();
updateProgress();
</script>
