<style>

  .toc a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;}

  .parent{background:var(--indigo-soft);border-radius:12px;padding:16px 18px;margin-top:22px;}
  .parent h4{margin:0 0 6px;color:var(--indigo-deep);}
  .pager{display:flex;align-items:center;gap:12px;margin-top:26px;}

  .pager .done-btn.is-done{background:var(--green);border-color:var(--green);}
  .scrim{display:none;}

    section.card{padding:24px 20px;}.sec-num{font-size:28px;}.sec-titles h2{font-size:19px;}
    .pager{flex-wrap:wrap;}.pager .done-btn{order:-1;flex-basis:100%;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
  :focus-visible{outline:3px solid #A9A4F0;outline-offset:2px;border-radius:6px;}

<script>
const S = [{"key": "intro", "nav": "Intro 导读", "num": "", "track": false, "title": "Substitution, manipulation & the Factor Theorem", "zh": "换元·因式定理·代数变形", "body": "<p class=\"enh\">Four power tools: <b>substitution</b> (rename a messy chunk), <b>completing the square</b>, the <b>Factor / Remainder Theorem</b> (test a value to find factors), and <b>number-sense tricks</b> the way competitions use them.</p><p class=\"zh\">四把利器：<b>换元</b>、<b>配方</b>、<b>因式定理/余数定理</b>（代一个值就能找因式），以及竞赛常用的<b>数感变形</b>。</p><div class=\"note\">Sections marked <span class=\"badge hard\">★ Harder 难题</span> are AMC / 光剑 competition level. 最后一节「数感加练」全是竞赛味的。</div>"}, {"key": "s1", "nav": "Substitution 整体换元", "num": "01", "track": true, "title": "Whole substitution", "zh": "整体换元", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">substitute 换元</span> · <span class=\"t\">let 设</span> · <span class=\"t\">quadratic in disguise 伪装的二次</span></div><h3 class=\"blk\">Explanation 讲解</h3><p class=\"enh\">If the same chunk appears twice, <b>let it be t</b>. The equation often becomes a simple quadratic in t.</p><p class=\"zh\">同一坨东西出现两次，就<b>设它为 t</b>，方程常变成关于 t 的简单二次。</p><div class=\"example\"><div class=\"ex-title\">Example 例</div><p>Solve 解　(x²+x)² − 5(x²+x) + 6 = 0</p><div class=\"steps\"><div class=\"step\">Let 设 t=x²+x → t²−5t+6=0 → t=2, 3</div><div class=\"step\">x²+x=2→x=1,−2；x²+x=3→x=(−1±√13)/2</div></div><div class=\"ex-ans\">x = 1, −2, (−1±√13)/2</div></div><div class=\"practice\"><div class=\"practice-head\">Practice 1 练习1</div><ol><li>x⁴ − 10x² + 9 = 0</li><li>(x²−x)² − 8(x²−x) + 12 = 0（解出 t 即可）</li><li>Let t = x + 1/x. Write x² + 1/x² in terms of t</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. t=1,9 → x=±1,±3　2. t=2,6　3. t²−2</div></div></div>"}, {"key": "s2", "nav": "Symmetric 对称式", "num": "02", "track": true, "badge": "core", "title": "Symmetric expressions (s, p)", "zh": "对称式（和 s、积 p）", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">symmetric expression 对称式</span> · <span class=\"t\">sum s = x+y 和</span> · <span class=\"t\">product p = xy 积</span></div><h3 class=\"blk\">Explanation 讲解</h3><p class=\"enh\">Swap x, y and nothing changes? Write everything with <b>s = x+y</b>, <b>p = xy</b>.</p><p class=\"zh\">交换 x、y 不变的式子，全用 <b>s=x+y</b>、<b>p=xy</b> 表示。</p><span class=\"kbd-formula\">x²+y² = s²−2p　　x³+y³ = s³−3ps　　(x−y)² = s²−4p</span><div class=\"example\"><div class=\"ex-title\">Example 例</div><p>x+y=5, xy=6 → x²+y², x³+y³.</p><div class=\"steps\"><div class=\"step\">x²+y²=25−12=13；x³+y³=125−90=35</div></div><div class=\"ex-ans\">13 和 35</div></div><div class=\"practice\"><div class=\"practice-head\">Practice 2 练习2</div><ol><li>x+y=4, xy=3 → x²+y²</li><li>同上 → (x−y)²</li><li>x+y=3, xy=1 → x³+y³</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. 10　2. 4　3. 18</div></div></div>"}, {"key": "s3", "nav": "Factor Theorem 因式/余数定理", "num": "03", "track": true, "badge": "core", "title": "Factor &amp; Remainder Theorem", "zh": "因式定理与余数定理", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">polynomial 多项式</span> · <span class=\"t\">factor theorem 因式定理</span> · <span class=\"t\">remainder theorem 余数定理</span> · <span class=\"t\">root 根</span></div><h3 class=\"blk\">Explanation 讲解</h3><p class=\"enh\"><b>Remainder Theorem 余数定理：</b>divide a polynomial f(x) by (x − a); the remainder is just <b>f(a)</b>.</p><p class=\"zh\">用 (x − a) 去除多项式 f(x)，<b>余数就是 f(a)</b>——不用真的做长除法，代进去算一下就行。</p><p class=\"enh\"><b>Factor Theorem 因式定理：</b>(x − a) is a factor of f(x) <b>⟺ f(a) = 0</b>.</p><p class=\"zh\"><b>因式定理：</b>(x − a) 是 f(x) 的因式 <b>⟺ f(a)=0</b>。要因式分解三次式，就<b>试根</b>（±1,±2,±因数），命中一个就除下来降次。</p><div class=\"note\">回头看第 5 节「对称因式分解」——那里\"令 a=b 得 0 ⇒ (a−b) 是因式\"，正是把因式定理用在多元式上。</div><div class=\"example\"><div class=\"ex-title\">Example 1 例1 · 用试根分解三次式</div><p>Factorise 因式分解　x³ − 2x² − 5x + 6</p><div class=\"steps\"><div class=\"step\">试 x=1：1−2−5+6 = 0 ✓ → (x−1) 是因式</div><div class=\"step\">除下来 → x²−x−6 = (x−3)(x+2)</div></div><div class=\"ex-ans\">(x−1)(x−3)(x+2)，根 x = 1, 3, −2</div></div><div class=\"example\"><div class=\"ex-title\">Example 2 例2 · 余数</div><p>Find the remainder when 求 x³ + 2x² − 4 is divided by (x − 2).</p><div class=\"steps\"><div class=\"step\">余数 = f(2) = 8 + 8 − 4</div></div><div class=\"ex-ans\">12</div></div><div class=\"example\"><div class=\"ex-title\">Example 3 例3 · 反求系数</div><p>(x + 1) is a factor of 是……的因式　x³ + kx² + 3x + 2. Find k.</p><div class=\"steps\"><div class=\"step\">因式 ⇒ f(−1)=0：−1 + k − 3 + 2 = 0</div></div><div class=\"ex-ans\">k = 2</div></div><div class=\"practice\"><div class=\"practice-head\">Practice 3 练习3</div><ol><li>Factorise　x³ − 7x + 6</li><li>Remainder of x⁴ − 3x² + 2 divided by (x + 2)</li><li>(x − 2) is a factor of 2x³ − 3x² + kx − 4. Find k.</li><li>Show that (x − 1) is a factor of x³ + x² − x − 1, then factorise fully.</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. 试 x=1,2 → (x−1)(x−2)(x+3)<br>2. f(−2)=16−12+2 = 6<br>3. f(2)=16−12+2k−4=0 → k=0<br>4. f(1)=0 ✓ → (x−1)(x+1)² </div></div></div>"}, {"key": "s4", "nav": "Sym. factorising 对称因式分解", "num": "04", "track": true, "badge": "hard", "title": "Symmetric / cyclic factorising", "zh": "对称·轮换因式分解", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">cyclic 轮换</span> · <span class=\"t\">alternating 反对称</span> · <span class=\"t\">Vandermonde (a−b)(b−c)(c−a) 差积</span></div><h3 class=\"blk\">Explanation 讲解 <span class=\"badge hard\">★ 竞赛型</span></h3><p class=\"enh\">Factor theorem in several letters: if setting a=b gives 0, then (a−b) is a factor. Collect all such factors, then fix the constant by numbers.</p><p class=\"zh\">多元版因式定理：令 a=b 得 0 ⇒ (a−b) 是因式；轮换地凑齐 (a−b)(b−c)(c−a)。再<b>数次数</b>定常数、<b>代数字</b>定符号。</p><div class=\"example\"><div class=\"ex-title\">Example 1 例1</div><p>a²(b−c) + b²(c−a) + c²(a−b)</p><div class=\"steps\"><div class=\"step\">令 a=b 得 0 → (a−b) 因式；轮换得三个；3 次齐次 → 余常数 k</div><div class=\"step\">代 a=2,b=1,c=0：左=2，(a−b)(b−c)(c−a)=−2 → k=−1</div></div><div class=\"ex-ans\">−(a−b)(b−c)(c−a)</div></div><div class=\"example\"><div class=\"ex-title\">Example 2 例2 · 次数变 4（多一个对称因式）</div><p>a³(b−c) + b³(c−a) + c³(a−b)</p><div class=\"steps\"><div class=\"step\">4 次反对称 ÷ 3 次差积 → 还剩 1 次对称因式 = (a+b+c)；代数字定 k=−1</div></div><div class=\"ex-ans\">−(a−b)(b−c)(c−a)(a+b+c)</div></div><div class=\"practice\"><div class=\"practice-head\">Practice 4 练习4</div><ol><li>a(b−c) + b(c−a) + c(a−b)</li><li>bc(b−c) + ca(c−a) + ab(a−b)</li><li>(a+b+c)³ − a³ − b³ − c³</li><li>a³ + b³ + c³ − 3abc</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. 0<br>2. −(a−b)(b−c)(c−a)<br>3. 3(a+b)(b+c)(c+a)<br>4. (a+b+c)(a²+b²+c²−ab−bc−ca)</div></div></div>"}, {"key": "s5", "nav": "Complete the square 配方逼值", "num": "05", "track": true, "badge": "hard", "title": "Completing the square to find values", "zh": "配方逼值", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">complete the square 配方</span> · <span class=\"t\">sum of squares 平方和</span> · <span class=\"t\">each square = 0 每项为零</span></div><h3 class=\"blk\">Explanation 讲解</h3><p class=\"enh\">Sum of squares = 0 (or ≤ 0) ⇒ <b>every square = 0</b>. That pins down each variable.</p><p class=\"zh\">平方和 =0（或 ≤0）⇒ <b>每个平方都 =0</b>，从而定出每个变量。</p><div class=\"example\"><div class=\"ex-title\">Example 例 <span class=\"ex-tag\">平和真题型</span></div><p>Real a,b,c: a²+b²+c²+4 ≤ ab+3b+2c. Find 200a+9b+c.</p><div class=\"steps\"><div class=\"step\">(a−b/2)² + ¾(b−2)² + (c−1)² ≤ 0 → a=1,b=2,c=1</div></div><div class=\"ex-ans\">219</div></div><div class=\"practice\"><div class=\"practice-head\">Practice 5 练习5</div><ol><li>a²+b²−6a+2b+10=0 → a,b</li><li>x²+4y²+4x−4y+5=0 → x,y</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. a=3, b=−1　2. x=−2, y=½</div></div></div>"}, {"key": "s6", "nav": "Clever subst. 巧换元", "num": "06", "track": true, "title": "Clever substitution (big numbers)", "zh": "巧换元（大数字）", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">let u, v 设 u、v</span> · <span class=\"t\">big numbers 大数字</span></div><h3 class=\"blk\">Explanation 讲解</h3><p class=\"enh\">Scary big numbers → <b>name them u, v</b> and use symmetric identities.</p><p class=\"zh\">吓人的大数字 → <b>设 u、v</b> 再用对称式。</p><div class=\"example\"><div class=\"ex-title\">Example 例 <span class=\"ex-tag\">领科</span></div><p>(2020−a)(2019−a)=2021, find (2020−a)²+(2019−a)².</p><div class=\"steps\"><div class=\"step\">u=2020−a, v=2019−a → u−v=1, uv=2021 → u²+v²=1+4042</div></div><div class=\"ex-ans\">4043</div></div><div class=\"practice\"><div class=\"practice-head\">Practice 6 练习6</div><ol><li>(101−a)(99−a)=5 → (101−a)²+(99−a)²</li><li>x=√2−1 → x²+2x</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. u−v=2,uv=5 → 4+10=14　2. (x+1)²=2 → x²+2x=1</div></div></div>"}, {"key": "s7", "nav": "AMC·数感加练", "num": "07", "track": true, "badge": "hard", "title": "AMC &amp; number-sense drills", "zh": "AMC · 数感加练", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">conjugate pair 共轭配对</span> · <span class=\"t\">power sums 幂和</span> · <span class=\"t\">nested radical 嵌套根号</span></div><h3 class=\"blk\">Explanation 讲解 <span class=\"badge hard\">★ AMC / 光剑</span></h3><p class=\"enh\">Three competition staples: (a) <b>t = a + 1/a</b> then build power sums; (b) <b>conjugate pair</b> — add a tiny twin to get an integer; (c) <b>cube a nested-radical sum</b> to kill the radicals.</p><p class=\"zh\">三个竞赛套路：(a) 设 <b>t=a+1/a</b> 再逐级升幂；(b) <b>共轭配对</b>——加一个极小的\"孪生\"变整数；(c) <b>把嵌套根号之和立方</b>，根号自己消掉。</p><span class=\"kbd-formula\">a³+1/a³ = t³ − 3t　　a²+1/a² = t² − 2　（t = a + 1/a）</span><div class=\"example\"><div class=\"ex-title\">Example 1 例1 · 幂和</div><p>x² − 3x + 1 = 0. Find x³ + 1/x³.</p><div class=\"steps\"><div class=\"step\">÷x：x + 1/x = 3 = t</div><div class=\"step\">x³+1/x³ = t³−3t = 27−9</div></div><div class=\"ex-ans\">18</div></div><div class=\"example\"><div class=\"ex-title\">Example 2 例2 · 共轭配对 <span class=\"ex-tag\">光剑自查</span></div><p>Find the nearest integer to 求最接近 (√6 + √7)⁴ 的整数.</p><div class=\"steps\"><div class=\"step\">令 N = (√6+√7)⁴ + (√7−√6)⁴ —— 根号成对相消 → N 是整数 = 674</div><div class=\"step\">(√7−√6)⁴ 是极小正数（≈0.0015）→ (√6+√7)⁴ 比 674 小一点点</div></div><div class=\"ex-ans\">674</div></div><div class=\"example\"><div class=\"ex-title\">Example 3 例3 · 立方消根号</div><p>Evaluate 求　x = ∛(2+√5) + ∛(2−√5).</p><div class=\"steps\"><div class=\"step\">x³ = (2+√5)+(2−√5) + 3·∛((2+√5)(2−√5))·x = 4 + 3∛(−1)·x = 4 − 3x</div><div class=\"step\">x³+3x−4=0 → (x−1)(x²+x+4)=0 → x=1</div></div><div class=\"ex-ans\">x = 1</div></div><div class=\"practice\"><div class=\"practice-head\">Practice 7 练习7 <span class=\"badge hard\">★ 挑战</span></div><ol><li>a + 1/a = 4. Find a³ + 1/a³.</li><li>x² − 5x + 1 = 0. Find x² + 1/x².</li><li>Find the nearest integer to (√2 + √3)⁴.</li><li>Evaluate　x = ∛(7 + 5√2) + ∛(7 − 5√2).</li><li>a + 1/a = 3. Find a⁴ + 1/a⁴.（提示自己想：先 a²+1/a²）</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. 64 − 12 = <b>52</b><br>2. x+1/x=5 → 25−2 = <b>23</b><br>3. 配对 (√2+√3)⁴+(√3−√2)⁴ = 98，后者极小 → <b>98</b><br>4. x³ = 14 + 3∛(49−50)x = 14 − 3x → x³+3x−14=0 → (x−2)(x²+2x+7)=0 → <b>x=2</b><br>5. a²+1/a²=7 → a⁴+1/a⁴ = 7²−2 = <b>47</b></div></div></div>"}, {"key": "end", "nav": "Summary 小结", "num": "", "track": false, "title": "Summary", "zh": "小结", "body": "<h3 class=\"blk\">Self-check 自查</h3><div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">重复整体 → 换元 t</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">对称式 → 用 s、p</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">余数定理：余数 = f(a)；因式定理：f(a)=0 ⇔ (x−a) 是因式</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">三次式先<b>试根</b>降次</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">【难】对称因式分解：令 a=b 得 0 ⇒ (a−b) 因式</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">【难】平方和=0 ⇒ 每项=0（配方逼值）</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">【AMC】t=a+1/a 升幂、共轭配对取整、立方消嵌套根号</div></div></div><div class=\"parent\"><h4>For parents 给家长的话</h4><p class=\"zh\">这一章从\"换元/配方\"升级到\"因式定理 + 竞赛数感\"。第 3 节（因式/余数定理）是初中升高中的关键桥梁；最后一节全是 AMC/光剑味的加练，能做出 2–3 题就很强了。</p></div>"}];
const tocList=document.getElementById('tocList'),content=document.getElementById('content'),progFill=document.getElementById('progFill'),progLabel=document.getElementById('progLabel'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),doneBtn=document.getElementById('doneBtn');
let cur=0;const done=new Set();const trackedTotal=S.filter(s=>s.track).length;
S.forEach((s,i)=>{const a=document.createElement('a');a.dataset.i=i;a.innerHTML=`<span class="n">${s.num||'·'}</span><span class="lbl">${s.nav}</span><span class="tick"></span>`;a.onclick=()=>go(i);tocList.appendChild(a);});
const tocLinks=[...tocList.children];
function render(){
  const s=S[cur];
  const badgeHtml = s.badge==='core'?'<span class="badge core">★ Must-know 必背</span>':s.badge==='gk'?'<span class="badge gk">★ Often tested 常考</span>':s.badge==='core'?'<span class="badge core">★ Must-know 必背</span>':s.badge==='hard'?'<span class="badge hard">★ Harder 难题</span>':'';
  const zt = s.zh?`<div class="zh-title">${s.zh}</div>`:'';
  content.innerHTML=`<div class="sec-head">${s.num?`<div class="sec-num">${s.num}</div>`:''}<div class="sec-titles"><h2>${s.title}</h2>${zt}${badgeHtml}</div></div><div class="divider"></div>${s.body}`;
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
  prevBtn.disabled=cur===0;nextBtn.disabled=cur===S.length-1;
  if(s.track){doneBtn.style.display='';const d=done.has(cur);doneBtn.textContent=d?'Done 已学完 ✓':'Done 学完了 ✓';doneBtn.classList.toggle('is-done',d);}else{doneBtn.style.display='none';}
  content.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});
}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));render();closeMenu();}
prevBtn.onclick=()=>go(cur-1);nextBtn.onclick=()=>go(cur+1);
doneBtn.onclick=()=>{if(!S[cur].track)return;if(done.has(cur))done.delete(cur);else done.add(cur);updateProgress();render();if(done.has(cur)&&cur<S.length-1)setTimeout(()=>go(cur+1),260);};
function updateProgress(){const n=[...done].filter(i=>S[i].track).length;progFill.style.width=(n/trackedTotal*100)+'%';progLabel.textContent=`${n} / ${trackedTotal}`;tocLinks.forEach((a,i)=>a.classList.toggle('done',done.has(i)&&S[i].track));}
function ans(btn){const box=btn.nextElementSibling;const open=box.classList.toggle('open');btn.textContent=open?btn.textContent.replace('Show','Hide').replace('显示','隐藏'):btn.textContent.replace('Hide','Show').replace('隐藏','显示');}
function tick(el){el.classList.toggle('on');}
const PASCAL_EXP={0:'(a+b)⁰ = 1',1:'(a+b)¹ = a + b',2:'(a+b)² = a² + 2ab + b²',3:'(a+b)³ = a³ + 3a²b + 3ab² + b³',4:'(a+b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴',5:'(a+b)⁵ = a⁵ + 5a⁴b + 10a³b² + 10a²b³ + 5ab⁴ + b⁵',6:'(a+b)⁶ = a⁶ + 6a⁵b + 15a⁴b² + 20a³b³ + 15a²b⁴ + 6ab⁵ + b⁶'};
function pascalPick(r){document.querySelectorAll('#pascalTri .prow').forEach(el=>el.classList.toggle('sel',+el.dataset.r===r));const out=document.getElementById('pascalOut');if(out)out.innerHTML='Row 第 '+r+' 行 → <b>'+PASCAL_EXP[r]+'</b>';}
const toc=document.getElementById('toc'),scrim=document.getElementById('scrim');
document.getElementById('menuBtn').onclick=()=>{toc.classList.add('open');scrim.classList.add('show');};
function closeMenu(){toc.classList.remove('open');scrim.classList.remove('show');}
scrim.onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'&&cur<S.length-1)go(cur+1);if(e.key==='ArrowLeft'&&cur>0)go(cur-1);});
render();updateProgress();
