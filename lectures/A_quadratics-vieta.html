<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光剑数学讲义 02 · 一元二次方程与韦达定理</title>
<style>
  :root{
    --bg:#F4F6FB;
    --surface:#FFFFFF;
    --ink:#1B1B2A;
    --muted:#6A6A82;
    --line:#E3E6F0;
    --indigo:#4A43C4;
    --indigo-deep:#2E2A6B;
    --indigo-soft:#EEF0FC;
    --amber:#C77A15;
    --amber-soft:#FCF2DF;
    --green:#1F8A5B;
    --green-soft:#E6F5EE;
    --rose:#C0453B;
    --rose-soft:#FBEDEC;
    --radius:14px;
    --shadow:0 1px 2px rgba(30,30,60,.05), 0 8px 24px rgba(30,30,60,.06);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--font);line-height:1.75;font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- Header ---------- */
  header.top{
    position:sticky;top:0;z-index:30;
    background:rgba(244,246,251,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 22px;
  }
  .top-row{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto;}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--indigo);font-weight:700;text-transform:uppercase;}
  .brand h1{margin:0;font-size:17px;font-weight:800;color:var(--indigo-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prog-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:180px;}
  .prog-label{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .prog-track{flex:1;height:8px;background:#DDE1EE;border-radius:99px;overflow:hidden;min-width:90px;}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--indigo),#7A73E6);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer;color:var(--indigo-deep);}
  /* ---------- Layout ---------- */
  .layout{display:grid;grid-template-columns:262px 1fr;gap:30px;max-width:1180px;margin:26px auto;padding:0 22px;align-items:start;}
  /* ---------- Sidebar ---------- */
  nav.toc{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);}
  .toc h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 8px 10px;font-weight:700;}
  .toc a{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);
    font-size:14.5px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;
  }
  .toc a:hover{background:var(--indigo-soft);}
  .toc a.active{background:var(--indigo-soft);border-color:#D5D8F5;font-weight:700;color:var(--indigo-deep);}
  .toc .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--indigo);font-size:13px;width:22px;flex:none;}
  .toc a.active .n{color:var(--indigo-deep);}
  .toc .lbl{flex:1;min-width:0;}
  .toc .tick{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid #CBD0E4;display:grid;place-items:center;font-size:10px;color:#fff;}
  .toc a.done .tick{background:var(--green);border-color:var(--green);}
  .toc a.done .tick::after{content:"✓";}
  /* ---------- Content ---------- */
  main{min-width:0;}
  section.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 34px 30px;animation:rise .4s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px;}
  .sec-num{font-size:34px;font-weight:800;color:var(--indigo);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:none;padding-top:2px;}
  .sec-titles{flex:1;min-width:0;}
  .sec-titles h2{margin:0;font-size:23px;font-weight:800;color:var(--indigo-deep);letter-spacing:-.01em;}
  .badge{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;}
  .badge.gk{background:var(--amber-soft);color:var(--amber);}
  .badge.core{background:var(--indigo-soft);color:var(--indigo);}
  .badge.warn{background:var(--rose-soft);color:var(--rose);}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  h3.blk{font-size:15px;font-weight:800;color:var(--indigo);margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  h3.blk::before{content:"";width:5px;height:16px;border-radius:3px;background:var(--indigo);display:inline-block;}
  p{margin:10px 0;}
  .content b{color:var(--indigo-deep);}
  .content ul,.content ol{margin:10px 0;padding-left:22px;}
  .content li{margin:6px 0;}
  .kbd-formula{display:block;background:var(--indigo-soft);border:1px solid #D9DCF6;border-radius:10px;padding:14px 18px;margin:14px 0;font-size:18px;text-align:center;color:var(--indigo-deep);font-weight:700;letter-spacing:.01em;}
  /* example box */
  .example{background:#FBFBFE;border:1px solid var(--line);border-left:4px solid var(--indigo);border-radius:12px;padding:16px 18px;margin:16px 0;}
  .ex-title{font-weight:800;color:var(--indigo-deep);font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ex-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#EDEEF6;color:var(--muted);}
  .ex-tag.gk{background:var(--amber-soft);color:var(--amber);}
  .steps{margin:8px 0;}
  .step{position:relative;padding:5px 0 5px 20px;}
  .step::before{content:"";position:absolute;left:5px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--indigo);}
  .ex-ans{margin-top:10px;background:var(--green-soft);border-radius:8px;padding:8px 12px;font-weight:800;color:var(--green);}
  /* note / warning */
  .note{background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14.5px;color:#7a5210;}
  .note.warn{background:var(--rose-soft);color:#8c2f28;}
  .note strong{color:inherit;}
  /* practice */
  .practice{background:#FFFFFF;border:1.5px dashed #C9CEE6;border-radius:12px;padding:16px 18px;margin:18px 0;}
  .practice-head{font-weight:800;color:var(--indigo-deep);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .practice-head::before{content:"✎";color:var(--indigo);}
  .reveal{margin-top:10px;background:var(--indigo);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s;}
  .reveal:hover{background:#3a34a8;}
  .reveal:active{transform:translateY(1px);}
  .answer{max-height:0;overflow:hidden;transition:max-height .35s ease;margin-top:0;}
  .answer.open{max-height:1200px;margin-top:12px;}
  .answer-inner{background:var(--green-soft);border-radius:10px;padding:12px 16px;font-size:14.5px;}
  .answer-inner b{color:var(--green);}
  table.mini{border-collapse:collapse;margin:12px 0;width:100%;font-size:14.5px;}
  table.mini th,table.mini td{border:1px solid var(--line);padding:8px 12px;text-align:left;}
  table.mini th{background:var(--indigo-soft);color:var(--indigo-deep);font-weight:700;}
  /* checklist */
  .check-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;}
  .check-item:last-child{border-bottom:none;}
  .check-box{width:20px;height:20px;border:2px solid #C4C9E0;border-radius:6px;flex:none;margin-top:3px;display:grid;place-items:center;color:#fff;font-size:13px;transition:background .15s,border-color .15s;}
  .check-item.on .check-box{background:var(--green);border-color:var(--green);}
  .check-item.on .check-box::after{content:"✓";}
  .check-item.on .check-txt{color:var(--muted);text-decoration:line-through;}
  .parent{background:var(--indigo-soft);border-radius:12px;padding:16px 18px;margin-top:22px;}
  .parent h4{margin:0 0 6px;color:var(--indigo-deep);}
  /* 他校标签 */
  .stag{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:#2E2A6B;color:#fff;margin-right:8px;}
  .stag.pinghe{background:#1F8A5B;} .stag.shiwai{background:#C77A15;} .stag.huaer{background:#4A43C4;} .stag.lingke{background:#C0453B;}
  .xpref{font-size:12.5px;color:var(--muted);margin:2px 0 6px;}
  .xschool{background:#F7F5FF;border:1px solid #E3DEF7;border-left:4px solid #7A73E6;border-radius:12px;padding:14px 16px;margin:16px 0;}
  /* 难题指导 */
  .adv-guide{background:#FBF6F5;border:1px solid #F0D9D6;border-left:4px solid var(--rose);border-radius:12px;padding:16px 18px;margin:22px 0 6px;}
  .adv-guide h4{margin:0 0 8px;color:var(--rose);font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px;}
  .adv-guide .idf{display:block;background:#fff;border:1px solid #F0D9D6;border-radius:9px;padding:10px 14px;margin:10px 0;font-size:16px;text-align:center;color:#8c2f28;font-weight:700;}
  .adv-guide .mini-ex{background:#fff;border:1px dashed #E4C4C0;border-radius:9px;padding:10px 14px;margin:10px 0;font-size:14.5px;color:#5a3b38;}
  .adv-guide .mini-ex b{color:#8c2f28;}
  .adv-guide .to-prac{font-size:13.5px;color:var(--rose);margin-top:8px;}
  /* nav buttons */
  .pager{display:flex;align-items:center;gap:12px;margin-top:26px;}
  .pager button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--indigo-deep);transition:background .15s,border-color .15s,transform .1s;}
  .pager button:hover:not(:disabled){background:var(--indigo-soft);border-color:#CFD3F0;}
  .pager button:active:not(:disabled){transform:translateY(1px);}
  .pager button:disabled{opacity:.4;cursor:not-allowed;}
  .pager .done-btn{flex:1.3;background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .pager .done-btn:hover{background:#3a34a8;}
  .pager .done-btn.is-done{background:var(--green);border-color:var(--green);}
  .pager .done-btn.is-done:hover{background:#1a7550;}
  /* mobile */
  .scrim{display:none;}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;padding:0 16px;margin-top:16px;}
    .menu-btn{display:block;}
    nav.toc{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:50;border-radius:0 16px 16px 0;transform:translateX(-102%);transition:transform .28s ease;overflow-y:auto;top:0;padding-top:18px;}
    nav.toc.open{transform:none;}
    .scrim.show{display:block;position:fixed;inset:0;background:rgba(20,20,40,.4);z-index:40;}
    .prog-wrap{min-width:120px;}
    .brand h1{font-size:15px;white-space:normal;}
    section.card{padding:24px 20px;}
    .sec-num{font-size:28px;}
    .sec-titles h2{font-size:20px;}
    .pager{flex-wrap:wrap;}
    .pager .done-btn{order:-1;flex-basis:100%;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important;}
  }
  :focus-visible{outline:3px solid #A9A4F0;outline-offset:2px;border-radius:6px;}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <button class="menu-btn" id="menuBtn" aria-label="打开目录">☰ 目录</button>
    <div class="brand">
      <span class="eyebrow">光剑数学 · 讲义 02</span>
      <h1>一元二次方程与韦达定理（模块 A）</h1>
    </div>
    <div class="prog-wrap" aria-label="学习进度">
      <span class="prog-label" id="progLabel">0 / 9 节</span>
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    </div>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<div class="layout">
  <nav class="toc" id="toc" aria-label="章节目录">
    <h2>章节目录</h2>
    <div id="tocList"></div>
  </nav>
  <main>
    <section class="card content" id="content" tabindex="-1"></section>
    <div class="pager">
      <button id="prevBtn">← 上一节</button>
      <button class="done-btn" id="doneBtn">学完了 ✓</button>
      <button id="nextBtn">下一节 →</button>
    </div>
  </main>
</div>

<script>
/* ============ 讲义内容数据 ============ */
const S = [
  {
    key:"intro", nav:"导读", num:"", track:false,
    title:"导读：怎么用这份讲义",
    body:`
      <p>这是<b>模块 A 的自学版</b>。设计成你一个人看着就能学：每节先看<b>讲解</b>，再看<b>例题</b>（拿纸跟着做一遍），最后做<b>练习</b>——练习答案是藏起来的，<b>先自己做，再点"显示答案"</b>。</p>
      <h3 class="blk">开始前</h3>
      <p>需要先学完<b>讲义 01（代数基本功）</b>：乘法公式、因式分解、根式。这一份会用到那些。</p>
      <h3 class="blk">模块 A 是什么地位</h3>
      <p>模块 A 是光剑的<b>"保命区"</b>——这里的分必须拿住。内容从最基础的"什么是一元二次方程"讲起，一步步搭到光剑真正爱考的四个技巧。带 <span class="badge gk">光剑常考</span> 标记的小节要格外用心。</p>
      <h3 class="blk">每学完一节</h3>
      <p>点底部的 <b>"学完了 ✓"</b>，上方进度条会涨。九节全部点亮，模块 A 就通关了。（进度只在本次打开时保存，刷新会重置，不用担心。）</p>
      <div class="note">别急。这一份宁可学得慢一点、扎实一点。地基比速度重要。</div>
    `
  },
  {
    key:"s1", nav:"认识方程", num:"01", track:true,
    title:"认识一元二次方程",
    body:`
      <h3 class="blk">讲解</h3>
      <p><b>一元二次方程</b>长这样：</p>
      <span class="kbd-formula">a·x² + b·x + c = 0　（a ≠ 0）</span>
      <ul>
        <li><b>一元</b>：只有一个未知数（这里是 x）。</li>
        <li><b>二次</b>：未知数最高是 2 次方（有 x²）。</li>
        <li>a、b、c 是已知的数，叫<b>系数</b>；a 不能为 0，否则就没有 x² 了。</li>
      </ul>
      <p><b>举例：</b></p>
      <ul>
        <li>2x² − 3x + 1 = 0 ✓ 是（a=2, b=−3, c=1）</li>
        <li>x² − 5 = 0 ✓ 是（a=1, b=0, c=−5，b 可以是 0）</li>
        <li>3x + 2 = 0 ✗ 不是（没有 x²，这是一次方程）</li>
      </ul>
      <p>能让方程成立的 x 值，叫方程的<b>"根"</b>。一元二次方程<b>最多有两个根</b>。</p>
      <div class="practice">
        <div class="practice-head">练习 1</div>
        <p>判断哪些是一元二次方程，并写出 a、b、c：</p>
        <ol>
          <li>x² + 4x − 2 = 0</li>
          <li>5x − 1 = 0</li>
          <li>−x² + 7 = 0</li>
          <li>2x² = 3x（先整理成标准形式）</li>
        </ol>
        <button class="reveal" onclick="ans(this)">显示答案</button>
        <div class="answer"><div class="answer-inner">
          1. 是，a=1, b=4, c=−2<br>
          2. 不是（一次方程）<br>
          3. 是，a=−1, b=0, c=7<br>
          4. 是。整理成 2x² − 3x = 0，a=2, b=−3, c=0
        </div></div>
      </div>
    `
  },
  {
    key:"s2", nav:"三种解法", num:"02", track:true,
    title:"解一元二次方程（三种方法）",
    body:`
      <p>解方程有三招。先看能不能用最快的第一招，不行再往后。</p>
      <h3 class="blk">方法一：因式分解法（优先用）</h3>
      <p><b>原理</b>：若 A·B = 0，则 A = 0 或 B = 0。把左边分解成两括号相乘 = 0，再让每个括号 = 0。</p>
      <div class="example">
        <div class="ex-title">例 1</div>
        <p>解 x² − 5x + 6 = 0。</p>
        <div class="steps">
          <div class="step">十字相乘：找两数相乘 6、相加 −5 → −2 和 −3</div>
          <div class="step">(x − 2)(x − 3) = 0</div>
          <div class="step">x − 2 = 0 或 x − 3 = 0</div>
        </div>
        <div class="ex-ans">x = 2 或 x = 3</div>
      </div>
      <div class="example">
        <div class="ex-title">例 2</div>
        <p>解 3x² − 5x − 2 = 0。</p>
        <div class="steps">
          <div class="step">十字相乘：(3x + 1)(x − 2) = 0</div>
          <div class="step">3x + 1 = 0 → x = −1/3；　x − 2 = 0 → x = 2</div>
        </div>
        <div class="ex-ans">x = −1/3 或 x = 2</div>
      </div>
      <h3 class="blk">方法二：公式法（万能）</h3>
      <p>分解不出来时用<b>求根公式</b>（务必背下来）：</p>
      <span class="kbd-formula">x = ( −b ± √(b² − 4ac) ) ⁄ (2a)</span>
      <div class="example">
        <div class="ex-title">例 3</div>
        <p>解 x² − 2x − 5 = 0。</p>
        <div class="steps">
          <div class="step">a=1, b=−2, c=−5</div>
          <div class="step">根号里：b² − 4ac = 4 + 20 = 24</div>
          <div class="step">x = (2 ± √24) / 2 = (2 ± 2√6) / 2 = 1 ± √6</div>
        </div>
        <div class="ex-ans">x = 1 + √6 或 x = 1 − √6</div>
      </div>
      <h3 class="blk">方法三：配方法（了解即可）</h3>
      <div class="example">
        <div class="ex-title">例 4</div>
        <p>解 x² + 6x + 5 = 0。</p>
        <div class="steps">
          <div class="step">常数移右边：x² + 6x = −5</div>
          <div class="step">两边加 (6/2)² = 9：x² + 6x + 9 = 4</div>
          <div class="step">凑成平方：(x + 3)² = 4 → x + 3 = ±2</div>
        </div>
        <div class="ex-ans">x = −1 或 x = −5</div>
      </div>
      <div class="practice">
        <div class="practice-head">练习 2</div>
        <ol>
          <li>因式分解法：x² − 7x + 12 = 0</li>
          <li>因式分解法：x² + 3x − 10 = 0</li>
          <li>公式法：x² − 4x + 1 = 0</li>
          <li>公式法：2x² − 4x − 1 = 0</li>
        </ol>
        <button class="reveal" onclick="ans(this)">显示答案</button>
        <div class="answer"><div class="answer-inner">
          1. (x−3)(x−4)=0 → x = 3 或 4<br>
          2. (x+5)(x−2)=0 → x = −5 或 2<br>
          3. Δ=12，x = (4±2√3)/2 = 2 ± √3<br>
          4. Δ=24，x = (4±2√6)/4 = 1 ± (√6)/2
        </div></div>
      </div>
    `
  },
  {
    key:"s3", nav:"判别式 Δ", num:"03", track:true,
    title:"判别式 Δ（不解方程就知道有几个根）",
    body:`
      <h3 class="blk">讲解</h3>
      <p>求根公式里根号下面那部分 <b>b² − 4ac</b>，给它取名叫<b>判别式</b>，记作 <b>Δ</b>（读 delta）。它决定根的情况：</p>
      <table class="mini">
        <tr><th>Δ 的情况</th><th>根的情况</th></tr>
        <tr><td>Δ &gt; 0</td><td>两个<b>不相等</b>的实数根</td></tr>
        <tr><td>Δ = 0</td><td>两个<b>相等</b>的实数根（一个重根）</td></tr>
        <tr><td>Δ &lt; 0</td><td><b>没有</b>实数根</td></tr>
      </table>
      <p>很多题不用真解，只算 Δ 就知道有几个根。</p>
      <div class="example">

          <b>例：</b>x² − 3x + 1 = 0 的两根 α、β，求以 α²、β² 为根的方程。<br>
          α²+β² = 3²−2 = 7，α²β² = (αβ)² = 1 → <b>x² − 7x + 1 = 0</b>
        </div>
        <p><b>③ 最容易漏的一步 —— 回代检验判别式。</b>解出参数后，一定要检查原方程 Δ ≥ 0，否则"根"根本不存在，要舍去。</p>
        <div class="mini-ex">
          <b>例：</b>x² − 2(m−1)x + m² = 0 有两实根且 α²+β² = 4。<br>
          由 (α+β)²−2αβ = 4 解得 m = 0 或 4；但要 Δ = 4(1−2m) ≥ 0 即 m ≤ 1/2 → <b>m = 4 舍去，只剩 m = 0</b>
        </div>
        <p class="to-prac">➜ 对应进阶练习 · 第四部分（4–8 题）</p>
      </div>
    `
  },

      <div class="xschool">
        <div><span class="stag huaer">华二</span><b>等腰三角形 + 两根 + 分类讨论</b></div>
        <p class="xpref">华二偏好：一元二次方程结合几何（等腰三角形/三边关系），必须分类讨论。</p>
        <p>已知 a、b 是方程 x² − 6x + (n + 1) = 0 的两根，且一个等腰三角形的三边长分别为 a、b、4，求 n 的值。</p>
        <div class="practice" style="border-style:solid;border-color:#E3DEF7">

            分两种情况（等腰三角形的腰）：<br>
            <b>① a = 4</b>：代入 16−24+n+1=0 → n=7，方程 x²−6x+8=0 得根 2、4 → 三边 4、2、4 满足三角形不等式 ✓<br>
            <b>② a = b</b>（两根相等）：Δ=0 → 36−4(n+1)=0 → n=8，根 3、3 → 三边 3、3、4 ✓<br>
            → <b>n = 7 或 8</b>

        <p>求方程 2x² − 3|x| − 2 = 0 的所有实数根。</p>
        <div class="practice" style="border-style:solid;border-color:#E3DEF7">
          <button class="reveal" onclick="ans(this)">显示解答</button>
          <div class="answer"><div class="answer-inner">
            令 t = |x| ≥ 0：2t² − 3t − 2 = 0 → (2t+1)(t−2)=0 → t = 2（t = −½ 因 t≥0 舍）<br>

            令 u = 2020−a、v = 2019−a，则 u − v = 1、uv = 2021<br>
            u² + v² = (u − v)² + 2uv = 1 + 2·2021 = <b>4043</b>
          </div></div>

/* ============ 渲染与交互 ============ */
const tocList=document.getElementById('tocList');
const content=document.getElementById('content');
const progFill=document.getElementById('progFill');
const progLabel=document.getElementById('progLabel');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const doneBtn=document.getElementById('doneBtn');
let cur=0;
const done=new Set();
const trackedTotal=S.filter(s=>s.track).length;

S.forEach((s,i)=>{
  const a=document.createElement('a');
  a.dataset.i=i;
  a.innerHTML=`<span class="n">${s.num||'·'}</span><span class="lbl">${s.nav}</span><span class="tick"></span>`;
  a.onclick=()=>go(i);
  tocList.appendChild(a);
});
const tocLinks=[...tocList.children];

function render(){
  const s=S[cur];
  const badgeHtml = s.badge==='gk' ? '<span class="badge gk">★ 光剑常考</span>'
    : s.badge==='core' ? '<span class="badge core">★ 核心工具</span>'
    : s.badge==='warn' ? '<span class="badge warn">⚠ 光剑常考 · 易错</span>' : '';
  content.innerHTML=`
    <div class="sec-head">
      ${s.num?`<div class="sec-num">${s.num}</div>`:''}
      <div class="sec-titles"><h2>${s.title}</h2>${badgeHtml}</div>
    </div>
    <div class="divider"></div>
    ${s.body}`;
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
  prevBtn.disabled = cur===0;
  nextBtn.disabled = cur===S.length-1;
  // done button
  if(s.track){
    doneBtn.style.display='';
    const isDone=done.has(cur);
    doneBtn.textContent=isDone?'已学完 ✓':'学完了 ✓';
    doneBtn.classList.toggle('is-done',isDone);
  }else{
    doneBtn.style.display='none';
  }
  content.focus({preventScroll:true});
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(i){
  cur=Math.max(0,Math.min(S.length-1,i));
  render();
  closeMenu();
}
prevBtn.onclick=()=>go(cur-1);
nextBtn.onclick=()=>go(cur+1);
doneBtn.onclick=()=>{
  if(!S[cur].track) return;
  if(done.has(cur)) done.delete(cur); else done.add(cur);
  updateProgress();
  render();
  // auto-advance on marking done
  if(done.has(cur) && cur<S.length-1) setTimeout(()=>go(cur+1),260);
};
function updateProgress(){
  const n=[...done].filter(i=>S[i].track).length;
  progFill.style.width=(n/trackedTotal*100)+'%';
  progLabel.textContent=`${n} / ${trackedTotal} 节`;
  tocLinks.forEach((a,i)=>a.classList.toggle('done',done.has(i)&&S[i].track));
}

/* answer reveal */
function ans(btn){
  const box=btn.nextElementSibling;
  const open=box.classList.toggle('open');
  btn.textContent=open?'隐藏答案':'显示答案';
}
/* checklist tick */
function tick(el){ el.classList.toggle('on'); }

/* mobile menu */
const toc=document.getElementById('toc');
const scrim=document.getElementById('scrim');
document.getElementById('menuBtn').onclick=()=>{toc.classList.add('open');scrim.classList.add('show');};
function closeMenu(){toc.classList.remove('open');scrim.classList.remove('show');}
scrim.onclick=closeMenu;

/* keyboard arrows */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON') return;
  if(e.key==='ArrowRight'&&cur<S.length-1) go(cur+1);
  if(e.key==='ArrowLeft'&&cur>0) go(cur-1);
});

render();
updateProgress();
</script>
</body>
