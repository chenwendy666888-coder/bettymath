<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guangjian Maths · Prep · Graphs 图像基础</title>
<style>
  :root{
    --bg:#F4F6FB;--surface:#FFFFFF;--ink:#1B1B2A;--muted:#6A6A82;--line:#E3E6F0;
    --indigo:#4A43C4;--indigo-deep:#2E2A6B;--indigo-soft:#EEF0FC;
    --amber:#C77A15;--amber-soft:#FCF2DF;--green:#1F8A5B;--green-soft:#E6F5EE;
    --rose:#C0453B;--rose-soft:#FBEDEC;--radius:14px;
    --shadow:0 1px 2px rgba(30,30,60,.05), 0 8px 24px rgba(30,30,60,.06);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;}
  header.top{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;}
  .top-row{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto;}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--indigo);font-weight:700;text-transform:uppercase;}
  .brand h1{margin:0;font-size:16px;font-weight:800;color:var(--indigo-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prog-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:170px;}
  .prog-label{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .prog-track{flex:1;height:8px;background:#DDE1EE;border-radius:99px;overflow:hidden;min-width:80px;}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--indigo),#7A73E6);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer;color:var(--indigo-deep);}
  .layout{display:grid;grid-template-columns:262px 1fr;gap:30px;max-width:1180px;margin:26px auto;padding:0 22px;align-items:start;}
  nav.toc{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);}
  .toc h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 8px 10px;font-weight:700;}
  .toc a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;}
  .toc a:hover{background:var(--indigo-soft);}
  .toc a.active{background:var(--indigo-soft);border-color:#D5D8F5;font-weight:700;color:var(--indigo-deep);}
  .toc .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--indigo);font-size:13px;width:22px;flex:none;}
  .toc a.active .n{color:var(--indigo-deep);}
  .toc .lbl{flex:1;min-width:0;}
  .toc .tick{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid #CBD0E4;display:grid;place-items:center;font-size:10px;color:#fff;}
  .toc a.done .tick{background:var(--green);border-color:var(--green);}
  .toc a.done .tick::after{content:"✓";}
  main{min-width:0;}
  section.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 34px 30px;animation:rise .4s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px;}
  .sec-num{font-size:34px;font-weight:800;color:var(--indigo);line-height:1;font-variant-numeric:tabular-nums;flex:none;padding-top:2px;}
  .sec-titles{flex:1;min-width:0;}
  .sec-titles h2{margin:0;font-size:22px;font-weight:800;color:var(--indigo-deep);}
  .sec-titles .zh-title{font-size:15px;color:var(--muted);font-weight:700;margin-top:2px;}
  .badge{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;}
  .badge.gk{background:var(--amber-soft);color:var(--amber);}
  .badge.core{background:var(--indigo-soft);color:var(--indigo);}
  .badge.warn,.badge.hard{background:var(--rose-soft);color:var(--rose);}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  h3.blk{font-size:15px;font-weight:800;color:var(--indigo);margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  h3.blk::before{content:"";width:5px;height:16px;border-radius:3px;background:var(--indigo);display:inline-block;}
  p{margin:9px 0;}
  .content b{color:var(--indigo-deep);}
  .content ul,.content ol{margin:10px 0;padding-left:22px;}
  .content li{margin:6px 0;}
  .zh{color:#4a4a5e;font-size:14.5px;}
  .zh::before{content:"中  ";color:var(--green);font-weight:800;font-size:11px;letter-spacing:.05em;}
  .enh::before{content:"EN  ";color:var(--indigo);font-weight:800;font-size:11px;letter-spacing:.05em;}
  .terms{background:#F1F7F4;border:1px solid #CFE6DA;border-radius:10px;padding:11px 15px;margin:12px 0;font-size:14px;color:#14653f;line-height:1.9;}
  .terms b{color:#14653f;}
  .terms .t{white-space:nowrap;}
  .kbd-formula{display:block;background:var(--indigo-soft);border:1px solid #D9DCF6;border-radius:10px;padding:14px 18px;margin:14px 0;font-size:18px;text-align:center;color:var(--indigo-deep);font-weight:700;}
  .example{background:#FBFBFE;border:1px solid var(--line);border-left:4px solid var(--indigo);border-radius:12px;padding:16px 18px;margin:16px 0;}
  .ex-title{font-weight:800;color:var(--indigo-deep);font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ex-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--amber-soft);color:var(--amber);}
  .steps{margin:8px 0;}
  .step{position:relative;padding:5px 0 5px 20px;}
  .step::before{content:"";position:absolute;left:5px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--indigo);}
  .ex-ans{margin-top:10px;background:var(--green-soft);border-radius:8px;padding:8px 12px;font-weight:800;color:var(--green);}
  .note{background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14.5px;color:#7a5210;}
  .note.warn{background:var(--rose-soft);color:#8c2f28;}
  .note strong{color:inherit;}
  .practice{background:#FFFFFF;border:1.5px dashed #C9CEE6;border-radius:12px;padding:16px 18px;margin:18px 0;}
  .practice-head{font-weight:800;color:var(--indigo-deep);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .practice-head::before{content:"✎";color:var(--indigo);}
  .reveal{margin-top:10px;background:var(--indigo);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .reveal:hover{background:#3a34a8;}
  .answer{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .answer.open{max-height:1400px;margin-top:12px;}
  .answer-inner{background:var(--green-soft);border-radius:10px;padding:12px 16px;font-size:14.5px;}
  .answer-inner b{color:var(--green);}
  .pascal{display:flex;flex-direction:column;align-items:center;gap:9px;margin:18px 0 10px;}
  .prow{display:flex;gap:9px;cursor:pointer;padding:5px 9px;border-radius:12px;border:1.5px solid transparent;transition:background .15s,border-color .15s;}
  .prow:hover{background:var(--indigo-soft);}
  .prow.sel{background:var(--amber-soft);border-color:#EEDBB0;}
  .pcell{display:grid;place-items:center;min-width:40px;height:40px;padding:0 7px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;font-weight:800;color:var(--indigo-deep);font-variant-numeric:tabular-nums;}
  .prow.sel .pcell{border-color:var(--amber);color:var(--amber);}
  .pascal-out{text-align:center;background:var(--indigo-soft);border:1px solid #D9DCF6;border-radius:10px;padding:12px 16px;font-size:15px;color:var(--indigo-deep);margin:6px 0;min-height:22px;}
  .lore{background:#F2F3FC;border:1px solid #E0E3F5;border-left:4px solid #8983E0;border-radius:12px;padding:14px 18px;margin:16px 0;font-size:14.5px;color:#3b3b54;}
  .lore h5{margin:0 0 8px;color:var(--indigo-deep);font-size:14.5px;font-weight:800;}
  .check-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;}
  .check-item:last-child{border-bottom:none;}
  .check-box{width:20px;height:20px;border:2px solid #C4C9E0;border-radius:6px;flex:none;margin-top:3px;display:grid;place-items:center;color:#fff;font-size:13px;}
  .check-item.on .check-box{background:var(--green);border-color:var(--green);}
  .check-item.on .check-box::after{content:"✓";}
  .check-item.on .check-txt{color:var(--muted);text-decoration:line-through;}
  .parent{background:var(--indigo-soft);border-radius:12px;padding:16px 18px;margin-top:22px;}
  .parent h4{margin:0 0 6px;color:var(--indigo-deep);}
  .pager{display:flex;align-items:center;gap:12px;margin-top:26px;}
  .pager button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--indigo-deep);}
  .pager button:hover:not(:disabled){background:var(--indigo-soft);}
  .pager button:disabled{opacity:.4;cursor:not-allowed;}
  .pager .done-btn{flex:1.3;background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .pager .done-btn.is-done{background:var(--green);border-color:var(--green);}
  .scrim{display:none;}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;padding:0 16px;margin-top:16px;}
    .menu-btn{display:block;}
    nav.toc{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:50;border-radius:0 16px 16px 0;transform:translateX(-102%);transition:transform .28s ease;overflow-y:auto;padding-top:18px;}
    nav.toc.open{transform:none;}
    .scrim.show{display:block;position:fixed;inset:0;background:rgba(20,20,40,.4);z-index:40;}
    .brand h1{font-size:14px;white-space:normal;}.prog-wrap{min-width:110px;}
    section.card{padding:24px 20px;}.sec-num{font-size:28px;}.sec-titles h2{font-size:19px;}
    .pager{flex-wrap:wrap;}.pager .done-btn{order:-1;flex-basis:100%;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
  :focus-visible{outline:3px solid #A9A4F0;outline-offset:2px;border-radius:6px;}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
    <div class="brand"><span class="eyebrow">Guangjian Maths · Prep 预备篇</span><h1>Graphs: number line · coordinates · reading 图像基础</h1></div>
    <div class="prog-wrap" aria-label="Progress"><span class="prog-label" id="progLabel">0 / 5</span><div class="prog-track"><div class="prog-fill" id="progFill"></div></div></div>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <nav class="toc" id="toc" aria-label="Contents"><h2>Contents 目录</h2><div id="tocList"></div></nav>
  <main>
    <section class="card content" id="content" tabindex="-1"></section>
    <div class="pager">
      <button id="prevBtn">← Prev 上一节</button>
      <button class="done-btn" id="doneBtn">Done 学完了 ✓</button>
      <button id="nextBtn">Next 下一节 →</button>
    </div>
  </main>
</div>
<script>
const S = [{"key": "intro", "nav": "Intro 导读", "num": "", "track": false, "title": "Graphs first, then modules", "zh": "先学看图，再学模块", "body": "<p class=\"enh\">This is a <b>foundation note</b>. It builds the picture-sense you need everywhere: the <b>number line</b>, the <b>coordinate plane</b>, and <b>reading graphs</b>.</p><p class=\"zh\">这是<b>预备篇</b>，专门补后面处处要用的看图直觉：<b>数轴、坐标系、看图</b>。</p><p class=\"enh\">Why first? An inequality answer is a piece of the number line; a function is a graph; and to find a <b>range</b> you often look at whether a parabola is above or below the x-axis.</p><p class=\"zh\">为什么先学？不等式的答案是数轴上一段；函数就是一张图；求\"范围\"常要看抛物线在 x 轴上方还是下方。</p><div class=\"note\">Each section: <b>Key terms → Explanation → Examples → Practice</b>. 每节：术语 → 讲解 → 例题 → 练习。Do this note <b>before</b> Inequalities. 建议在\"不等式\"之前学。</div>"}, {"key": "s1", "nav": "Number line 数轴", "num": "01", "track": true, "title": "Number line, negatives & absolute value", "zh": "数轴、负数与绝对值", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">number line 数轴</span> · <span class=\"t\">negative 负数</span> · <span class=\"t\">opposite 相反数</span> · <span class=\"t\">absolute value 绝对值</span> · <span class=\"t\">distance 距离</span></div><h3 class=\"blk\">Explanation 讲解</h3><p class=\"enh\">On a <b>number line</b>, 0 is in the middle; <b>positive to the right, negative to the left</b>. The further right, the larger.</p><p class=\"zh\">数轴上 0 在中间，<b>右正左负</b>，越往右越大。</p><div style=\"display:flex;justify-content:center;margin:14px 0\"><svg viewBox=\"0 0 460 66\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:480px;height:auto\"><line x1=\"24\" y1=\"34\" x2=\"448\" y2=\"34\" stroke=\"#6A6A82\" stroke-width=\"1.6\"/><polygon points=\"448,34 440,30 440,38\" fill=\"#6A6A82\"/><polygon points=\"24,34 32,30 32,38\" fill=\"#6A6A82\"/><line x1=\"32.0\" y1=\"30\" x2=\"32.0\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"32.0\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" t hor=\"middle\">3</text><text x=\"230.0\" y=\"64\" font-size=\"11\" font-weight=\"700\" fill=\"#2E2A6B\" text-anchor=\"middle\">Number line 数轴：right is larger 右大</text></svg></div><p class=\"enh\"><b>Comparing 比较大小：</b>whichever is further right is bigger, so −2 &gt; −5. <b>Opposite 相反数</b>: same distance, other side (3 and −3). <b>Absolute value |a| 绝对值</b>: the <b>distance</b> from 0, always ≥ 0.</p><p class=\"zh\">谁在右边谁大，所以 −2 &gt; −5；相反数如 3 与 −3；|a| 是到 0 的<b>距离</b>，永远 ≥ 0。</p><div style=\"display:flex;justify-content:center;margin:14px 0\"><svg viewBox=\"0 0 460 66\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:480px;height:auto\"><line x1=\"24\" y1=\"34\" x2=\"448\" y2=\"34\" stroke=\"#6A6A82\" stroke-width=\"1.6\"/><polygon points=\"448,34 440,30 440,38\" fill=\"#6A6A82\"/><polygon points=\"24,34 32,30 32,38\" fill=\"#6A6A82\"/><line x1=\"32.0\" y1=\"30\" x2=\"32.0\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"32.0\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">-4</text><line x1=\"83.0\" y1=\"30\" x2=\"83.0\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"83.0\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">-3</text><line x1=\"134.0\" y1=\"30\" x2=\"134.0\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"134.0\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">-2</text><line x1=\"185.0\" y1=\"30\" x2=\"185.0\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"185.0\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">-1</text><line x1=\"236.0\" y1=\"30\" x2=\"236.0\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"236.0\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">0</text><line x1=\"287.0\" y1=\"30\" x2=\"287.0\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"287.0\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">1</text><line x1=\"338.0\" y1=\"30 ont-weight=\"700\" fill=\"#2E2A6B\" text-anchor=\"middle\">x ≥ −2 (filled, right)</text></svg></div></div><div class=\"example\"><div class=\"ex-title\">Example 2 例2</div><p>Show 画出　−3 &lt; x ≤ 1</p><div style=\"display:flex;justify-content:center;margin:14px 0\"><svg viewBox=\"0 0 460 66\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:480px;height:auto\"><line x1=\"24\" y1=\"34\" x2=\"448\" y2=\"34\" stroke=\"#6A6A82\" stroke-width=\"1.6\"/><polygon points=\"448,34 440,30 440,38\" fill=\"#6A6A82\"/><polygon points=\"24,34 32,30 32,38\" fill=\"#6A6A82\"/><line x1=\"32.0\" y1=\"30\" x2=\"32.0\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"32.0\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">-5</text><line x1=\"77.3\" y1=\"30\" x2=\"77.3\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"77.3\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">-4</text><line x1=\"122.7\" y1=\"30\" x2=\"122.7\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"122.7\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">-3</text><line x1=\"168.0\" y1=\"30\" x2=\"168.0\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"168.0\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">-2</text><line x1=\"213.3\" y1=\"30\" x2=\"213.3\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"213.3\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">-1</text><line x1=\"258.7\" y1=\"30\" x2=\"258.7\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"258.7\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">0</text><line x1=\"304.0\" y1=\"30\" x2=\"304.0\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"304.0\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">1</text><line x1=\"349.3\" y1=\"30\" x2=\"349.3\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"349.3\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">2</text><line x1=\"394.7\" y1=\"30\" x2=\"394.7\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"394.7\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">3</text><line x1=\"440.0\" y1=\"30\" x2=\"440.0\" y2=\"38\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/><text x=\"440.0\" y=\"52\" font-size=\"12\" fill=\"#6A6A82\" text-anchor=\"middle\">4</text><line x1=\"122.7\" y1=\"34\" x2=\"304.0\" y2=\"34\" stroke=\"#4A43C4\" stroke-width=\"4\"/><circle cx=\"122.7\" cy=\"34\" r=\"5.5\" fill=\"#fff\" stroke=\"#4A43C4\" stroke-width=\"2.4\"/><circle cx=\"304.0\" cy=\"34\" r=\"5.5\" fill=\"#4A43C4\" stroke=\"#4A43C4\" stroke-width=\"2.4\"/><text x=\"230.0\" y=\"64\" font-size=\"11\" font-weight=\"700\" fill=\"#2E2A6B\" text-anchor=\"middle\">−3 < x ≤ 1 (open/filled)</text></svg></div></div><div class=\"practice\"><div class=\"practice-head\">Practice 2 练习2</div><ol><li>For x &gt; 0, open or filled circle 空心还是实心?</li><li>For x ≤ 4, which circle?</li><li>Solve 解　x − 3 &gt; 0，and describe the picture 说画法</li><li>Does −2 ≤ x &lt; 5 include which ends 含哪个端点?</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. open 空心　2. filled 实心　3. x &gt; 3, open circle at 3, shade right　4. includes −2, not 5 含−2不含5</div></div></div>"}, {"key": "s3", "nav": "Coordinates 坐标系", "num": "03", "track": true, "title": "The coordinate plane", "zh": "平面直角坐标系", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">coordinate plane 坐标系</span> · <span class=\"t\">x-axis / y-axis 横/纵轴</span> · <span class=\"t\">origin 原点</span> · <span class=\"t\">quadrant 象限</span> · <span class=\"t\">coordinates (x, y) 坐标</span></div><h3 class=\"blk\">Explanation 讲解</h3><p class=\"enh\">Two number lines at right angles: the horizontal <b>x-axis</b>, the vertical <b>y-axis</b>, meeting at the <b>origin O</b>. Every point is <b>(x, y)</b> — <b>x first, then y</b>. (3, 2) = right 3, up 2.</p><p class=\"zh\">两条数轴垂直：横 <b>x 轴</b>、竖 <b>y 轴</b>、交点 <b>原点 O</b>。每点用 <b>(x, y)</b>，<b>先横后纵</b>。(3,2) = 右 3、上 2。</p><div style=\"display:flex;justify-content:center;margin:14px 0\"><svg viewBox=\"0 0 300 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;height:auto;background:#FBFBFE;border:1px solid #E3E6F0;border-radius:10px\"><line x1=\"30\" y1=\"20\" x2=\"30\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"54\" y1=\"20\" x2=\"54\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"78\" y1=\"20\" x2=\"78\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"102\" y1=\"20\" x2=\"102\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"126\" y1=\"20\" x2=\"126\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"150\" y1=\"20\" x2=\"150\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"174\" y1=\"20\" x2=\"174\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"198\" y1=\"20\" x2=\"198\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"222\" y1=\"20\" x2=\"222\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"246\" y1=\"20\" x2=\"246\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"270\" y1=\"20\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"220\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"200\" x2=\"270\" y2=\"200\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"180\" x2=\"270\" y2=\"180\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"160\" x2=\"270\" y2=\"160\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"140\" x2=\"270\" y2=\"140\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"100\" x2=\"270\" y2=\"100\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"80\" x2=\"270\" y2=\"80\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"60\" x2=\"270\" y2=\"60\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"40\" x2=\"270\" y2=\"40\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"20\" x2=\"270\" y2=\"20\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"276\" y2=\"120\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"220\" x2=\"150\" y2=\"14\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><text x=\"278\" y=\"124\" font-size=\"11\" fill=\"#6A6A82\">x</text><text x=\"155\" y=\"14\" font-size=\"11\" fill=\"#6A6A82\">y</text><text x=\"139\" y=\"133\" font-size=\"10\" fill=\"#9AA0B8\">O</text><circle cx=\"222.0\" cy=\"80.0\" r=\"4\" fill=\"#4A43C4\"/><text x=\"228.0\" y=\"74.0\" font-size=\"11\" font-weight=\"700\" fill=\"#4A43C4\">(3,2)</text><circle cx=\"102.0\" cy=\"100.0\" r=\"4\" fill=\"#1F8A5B\"/><text x=\"108.0\" y=\"94.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1F8A5B\">(−2,1)</text><circle cx=\"126.0\" cy=\"160.0\" r=\"4\" fill=\"#C0453B\"/><text x=\"132.0\" y=\"154.0\" font-size=\"11\" font-weight=\"700\" fill=\"#C0453B\">(−1,−2)</text><circle cx=\"198.0\" cy=\"140.0\" r=\"4\" fill=\"#C77A15\"/><text x=\"204.0\" y=\"134.0\" font-size=\"11\" font-weight=\"700\" fill=\"#C77A15\">(2,−1)</text><text x=\"150.0\" y=\"244\" font-size=\"11\" font-weight=\"700\" fill=\"#2E2A6B\" text-anchor=\"middle\">Quadrants 象限 Ⅰ(+,+) Ⅱ(−,+) Ⅲ(−,−) Ⅳ(+,−)</text></svg></div><div class=\"example\"><div class=\"ex-title\">Example 1 例1</div><p>Which quadrant 第几象限　(−3, 2)?</p><div class=\"steps\"><div class=\"step\">x negative, y positive　x 负 y 正</div></div><div class=\"ex-ans\">Quadrant II 第二象限</div></div><div class=\"practice\"><div class=\"practice-head\">Practice 3 练习3</div><ol><li>Which quadrant 第几象限　(4, −1)?</li><li>Where is 在哪　(0, 5)?</li><li>Coordinates of the origin 原点坐标?</li><li>Which quadrant　(−2, −3)?</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. Quadrant IV 第四象限　2. on the y-axis 在 y 轴上　3. (0, 0)　4. Quadrant III 第三象限</div></div></div>"}, {"key": "s4", "nav": "Reading graphs 看图", "num": "04", "track": true, "badge": "gk", "title": "Reading a graph", "zh": "从图象读信息", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">intercept 交点/截距</span> · <span class=\"t\">above/below the x-axis 在 x 轴上方/下方</span> · <span class=\"t\">increasing / decreasing 递增 / 递减</span></div><h3 class=\"blk\">Explanation 讲解</h3><p class=\"enh\">From a graph you can read: <b>where it crosses the axes</b>, <b>when y &gt; 0</b>, and whether it is <b>increasing or decreasing</b>. Look at this line (it is y = x − 1):</p><p class=\"zh\">看图能直接读出：<b>与轴的交点、什么时候 y &gt; 0、升还是降</b>。看这条 y = x − 1：</p><div style=\"display:flex;justify-content:center;margin:14px 0\"><svg viewBox=\"0 0 300 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;height:auto;background:#FBFBFE;border:1px solid #E3E6F0;border-radius:10px\"><line x1=\"30\" y1=\"20\" x2=\"30\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"54\" y1=\"20\" x2=\"54\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"78\" y1=\"20\" x2=\"78\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"102\" y1=\"20\" x2=\"102\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"126\" y1=\"20\" x2=\"126\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"150\" y1=\"20\" x2=\"150\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"174\" y1=\"20\" x2=\"174\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"198\" y1=\"20\" x2=\"198\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"222\" y1=\"20\" x2=\"222\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"246\" y1=\"20\" x2=\"246\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"270\" y1=\"20\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"220\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"200\" x2=\"270\" y2=\"200\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"180\" x2=\"270\" y2=\"180\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"160\" x2=\"270\" y2=\"160\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"140\" x2=\"270\" y2=\"140\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"100\" x2=\"270\" y2=\"100\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"80\" x2=\"270\" y2=\"80\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"60\" x2=\"270\" y2=\"60\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"40\" x2=\"270\" y2=\"40\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"20\" x2=\"270\" y2=\"20\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"276\" y2=\"120\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"220\" x2=\"150\" y2=\"14\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><text x=\"278\" y=\"124\" font-size=\"11\" fill=\"#6A6A82\">x</text><text x=\"155\" y=\"14\" font-size=\"11\" fill=\"#6A6A82\">y</text><text x=\"139\" y=\"133\" font-size=\"10\" fill=\"#9AA0B8\">O</text><polyline points=\"54.0,220.0 66.0,210.0 78.0,200.0 90.0,190.0 102.0,180.0 114.0,170.0 126.0,160.0 138.0,150.0 150.0,140.0 162.0,130.0 174.0,120.0 186.0,110.0 198.0,100.0 210.0,90.0 222.0,80.0 234.0,70.0 246.0,60.0 258.0,50.0 270.0,40.0\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2.6\"/><circle cx=\"174.0\" cy=\"120.0\" r=\"4\" fill=\"#C0453B\"/><text x=\"180.0\" y=\"114.0\" font-size=\"11\" font-weight=\"700\" fill=\"#C0453B\">(1,0)</text><circle cx=\"150.0\" cy=\"140.0\" r=\"4\" fill=\"#1F8A5B\"/><text x=\"156.0\" y=\"134.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1F8A5B\">(0,−1)</text><text x=\"150.0\" y=\"244\" font-size=\"11\" font-weight=\"700\" fill=\"#2E2A6B\" text-anchor=\"middle\">Line 直线 y = x − 1</text></svg></div><ul><li><b>x-axis crossing</b> 与 x 轴交点 (set y=0)：(1, 0)</li><li><b>y-axis crossing</b> 与 y 轴交点 (set x=0)：(0, −1)</li><li><b>y &gt; 0</b>：the part <b>above</b> the x-axis 在 x 轴上方 → x &gt; 1</li><li><b>Increasing</b> 递增：goes up left-to-right 从左往右上升</li></ul><div class=\"note\"><strong>Remember 记住：</strong>y &gt; 0 means the graph is <b>above</b> the x-axis; y &lt; 0 means <b>below</b>. 这在\"求范围\"时天天用。</div><div class=\"practice\"><div class=\"practice-head\">Practice 4 练习4 (all about 都对着 y = 2x − 4)</div><ol><li>x-axis crossing 与 x 轴交点 (y = 0)</li><li>y-axis crossing 与 y 轴交点 (x = 0)</li><li>Increasing or decreasing 升还是降?</li><li>For which x is y &gt; 0 何时 y &gt; 0?</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. (2, 0)　2. (0, −4)　3. increasing 递增 (k = 2 &gt; 0)　4. x &gt; 2</div></div></div>"}, {"key": "s5", "nav": "Common graphs 常见图象", "num": "05", "track": true, "title": "Two graphs you must recognise", "zh": "两种最常见的图象", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">straight line 直线</span> · <span class=\"t\">gradient / slope 斜率</span> · <span class=\"t\">parabola 抛物线</span> · <span class=\"t\">opens up / down 开口向上/下</span> · <span class=\"t\">vertex 顶点</span></div><h3 class=\"blk\">Explanation 讲解</h3><p class=\"enh\"><b>① Straight line y = kx + b</b>：<b>k &gt; 0 rises 上升, k &lt; 0 falls 下降</b>; b is where it meets the y-axis.</p><p class=\"enh\"><b>② Parabola y = ax² + bx + c</b>：<b>a &gt; 0 opens up 开口向上 (has a lowest point), a &lt; 0 opens down 开口向下 (highest point)</b>; the tip is the <b>vertex</b>.</p><p class=\"zh\">直线 k 决定升降、b 是 y 轴交点；抛物线 a 正开口向上有最低点、a 负开口向下有最高点，尖点叫顶点。</p><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0\"><div><div style=\"display:flex;justify-content:center;margin:14px 0\"><svg viewBox=\"0 0 300 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;height:auto;background:#FBFBFE;border:1px solid #E3E6F0;border-radius:10px\"><line x1=\"30\" y1=\"20\" x2=\"30\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"54\" y1=\"20\" x2=\"54\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"78\" y1=\"20\" x2=\"78\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"102\" y1=\"20\" x2=\"102\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"126\" y1=\"20\" x2=\"126\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"150\" y1=\"20\" x2=\"150\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"174\" y1=\"20\" x2=\"174\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"198\" y1=\"20\" x2=\"198\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"222\" y1=\"20\" x2=\"222\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"246\" y1=\"20\" x2=\"246\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"270\" y1=\"20\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"220\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"200\" x2=\"270\" y2=\"200\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"180\" x2=\"270\" y2=\"180\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"160\" x2=\"270\" y2=\"160\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"140\" x2=\"270\" y2=\"140\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"100\" x2=\"270\" y2=\"100\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"80\" x2=\"270\" y2=\"80\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"60\" x2=\"270\" y2=\"60\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"40\" x2=\"270\" y2=\"40\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"20\" x2=\"270\" y2=\"20\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"276\" y2=\"120\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"220\" x2=\"150\" y2=\"14\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><text x=\"278\" y=\"124\" font-size=\"11\" fill=\"#6A6A82\">x</text><text x=\"155\" y=\"14\" font-size=\"11\" fill=\"#6A6A82\">y</text><text x=\"139\" y=\"133\" font-size=\"10\" fill=\"#9AA0B8\">O</text><polyline points=\"30.0,200.0 42.0,190.0 54.0,180.0 66.0,170.0 78.0,160.0 90.0,150.0 102.0,140.0 114.0,130.0 126.0,120.0 138.0,110.0 150.0,100.0 162.0,90.0 174.0,80.0 186.0,70.0 198.0,60.0 210.0,50.0 222.0,40.0 234.0,30.0 246.0,20.0\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2.6\"/><text x=\"150.0\" y=\"244\" font-size=\"11\" font-weight=\"700\" fill=\"#2E2A6B\" text-anchor=\"middle\">y = x + 1 (k>0, rises 上升)</text></svg></div></div><div><div style=\"display:flex;justify-content:center;margin:14px 0\"><svg viewBox=\"0 0 300 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;height:auto;background:#FBFBFE;border:1px solid #E3E6F0;border-radius:10px\"><line x1=\"30\" y1=\"20\" x2=\"30\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"54\" y1=\"20\" x2=\"54\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"78\" y1=\"20\" x2=\"78\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"102\" y1=\"20\" x2=\"102\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"126\" y1=\"20\" x2=\"126\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"150\" y1=\"20\" x2=\"150\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"174\" y1=\"20\" x2=\"174\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"198\" y1=\"20\" x2=\"198\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"222\" y1=\"20\" x2=\"222\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"246\" y1=\"20\" x2=\"246\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"270\" y1=\"20\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"220\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"200\" x2=\"270\" y2=\"200\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"180\" x2=\"270\" y2=\"180\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"160\" x2=\"270\" y2=\"160\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"140\" x2=\"270\" y2=\"140\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"100\" x2=\"270\" y2=\"100\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"80\" x2=\"270\" y2=\"80\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"60\" x2=\"270\" y2=\"60\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"40\" x2=\"270\" y2=\"40\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"20\" x2=\"270\" y2=\"20\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"276\" y2=\"120\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"220\" x2=\"150\" y2=\"14\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><text x=\"278\" y=\"124\" font-size=\"11\" fill=\"#6A6A82\">x</text><text x=\"155\" y=\"14\" font-size=\"11\" fill=\"#6A6A82\">y</text><text x=\"139\" y=\"133\" font-size=\"10\" fill=\"#9AA0B8\">O</text><polyline points=\"63.6,30.4 68.4,44.4 73.2,57.6 78.0,70.0 82.8,81.6 87.6,92.4 92.4,102.4 97.2,111.6 102.0,120.0 106.8,127.6 111.6,134.4 116.4,140.4 121.2,145.6 126.0,150.0 130.8,153.6 135.6,156.4 140.4,158.4 145.2,159.6 150.0,160.0 154.8,159.6 159.6,158.4 164.4,156.4 169.2,153.6 174.0,150.0 178.8,145.6 183.6,140.4 188.4,134.4 193.2,127.6 198.0,120.0 202.8,111.6 207.6,102.4 212.4,92.4 217.2,81.6 222.0,70.0 226.8,57.6 231.6,44.4 236.4,30.4\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2.6\"/><text x=\"150.0\" y=\"244\" font-size=\"11\" font-weight=\"700\" fill=\"#2E2A6B\" text-anchor=\"middle\">y = ½x² − 2 (a>0, opens up 向上)</text></svg></div></div></div><div class=\"example\"><div class=\"ex-title\">Example 1 例1</div><p>Is y = −x + 2 increasing or decreasing 升还是降?</p><div class=\"steps\"><div class=\"step\">k = −1 &lt; 0</div></div><div class=\"ex-ans\">decreasing 下降</div></div><div class=\"example\"><div class=\"ex-title\">Example 2 例2</div><p>y = x² − 4：opens which way 开口方向? x-axis crossings 与 x 轴交点?</p><div class=\"steps\"><div class=\"step\">a = 1 &gt; 0 up 向上；y=0 → x = ±2</div></div><div class=\"ex-ans\">opens up; crosses at (−2,0),(2,0)</div></div><div class=\"practice\"><div class=\"practice-head\">Practice 5 练习5</div><ol><li>y = 3x + 1 rises or falls 升还是降?</li><li>y = −2x + 5?</li><li>y = x² + 1 opens which way 开口方向?</li><li>y = −x² + 3 highest or lowest point 最高还是最低点?</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. rises 上升　2. falls 下降　3. up 向上　4. highest point 最高点</div></div></div>"}, {"key": "s_line", "nav": "Draw & shade 画线与阴影", "num": "06", "track": true, "badge": "gk", "title": "Drawing a line & shading a region", "zh": "画直线与阴影区域", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">table of values 列表法</span> · <span class=\"t\">plot 描点</span> · <span class=\"t\">shade / region 阴影 / 区域</span> · <span class=\"t\">above / below the line 直线上方/下方</span> · <span class=\"t\">dashed / solid line 虚线/实线</span></div><h3 class=\"blk\">① Draw a line from a table 用列表法画直线</h3><p class=\"enh\">To draw <b>y = x + 1</b>, pick a few x-values, work out y, plot the points, and join them with a straight line.</p><p class=\"zh\">画 <b>y = x + 1</b>：取几个 x，算出 y，描点，再连成直线。</p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;margin:10px auto;font-size:14.5px\"><tr><th style=\"border:1px solid #D9DCF6;padding:5px 12px;background:#EEF0FC\">x</th><td style=\"border:1px solid #E3E6F0;padding:5px 12px\">−2</td><td style=\"border:1px solid #E3E6F0;padding:5px 12px\">−1</td><td style=\"border:1px solid #E3E6F0;padding:5px 12px\">0</td><td style=\"border:1px solid #E3E6F0;padding:5px 12px\">1</td><td style=\"border:1px solid #E3E6F0;padding:5px 12px\">2</td></tr><tr><th style=\"border:1px solid #D9DCF6;padding:5px 12px;background:#EEF0FC\">y = x+1</th><td style=\"border:1px solid #E3E6F0;padding:5px 12px\">−1</td><td style=\"border:1px solid #E3E6F0;padding:5px 12px\">0</td><td style=\"border:1px solid #E3E6F0;padding:5px 12px\">1</td><td style=\"border:1px solid #E3E6F0;padding:5px 12px\">2</td><td style=\"border:1px solid #E3E6F0;padding:5px 12px\">3</td></tr></table></div><div style=\"display:flex;justify-content:center;margin:14px 0\"><svg viewBox=\"0 0 300 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;height:auto;background:#FBFBFE;border:1px solid #E3E6F0;border-radius:10px\"><line x1=\"30\" y1=\"20\" x2=\"30\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"54\" y1=\"20\" x2=\"54\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"78\" y1=\"20\" x2=\"78\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"102\" y1=\"20\" x2=\"102\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"126\" y1=\"20\" x2=\"126\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"150\" y1=\"20\" x2=\"150\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"174\" y1=\"20\" x2=\"174\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"198\" y1=\"20\" x2=\"198\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"222\" y1=\"20\" x2=\"222\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"246\" y1=\"20\" x2=\"246\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"270\" y1=\"20\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"220\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"200\" x2=\"270\" y2=\"200\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"180\" x2=\"270\" y2=\"180\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"160\" x2=\"270\" y2=\"160\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"140\" x2=\"270\" y2=\"140\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"100\" x2=\"270\" y2=\"100\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"80\" x2=\"270\" y2=\"80\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"60\" x2=\"270\" y2=\"60\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"40\" x2=\"270\" y2=\"40\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"20\" x2=\"270\" y2=\"20\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"276\" y2=\"120\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"220\" x2=\"150\" y2=\"14\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><text x=\"278\" y=\"124\" font-size=\"11\" fill=\"#6A6A82\">x</text><text x=\"155\" y=\"14\" font-size=\"11\" fill=\"#6A6A82\">y</text><text x=\"139\" y=\"133\" font-size=\"10\" fill=\"#9AA0B8\">O</text><polyline points=\"30.0,200.0 36.0,195.0 42.0,190.0 48.0,185.0 54.0,180.0 60.0,175.0 66.0,170.0 72.0,165.0 78.0,160.0 84.0,155.0 90.0,150.0 96.0,145.0 102.0,140.0 108.0,135.0 114.0,130.0 120.0,125.0 126.0,120.0 132.0,115.0 138.0,110.0 144.0,105.0 150.0,100.0 156.0,95.0 162.0,90.0 168.0,85.0 174.0,80.0 180.0,75.0 186.0,70.0 192.0,65.0 198.0,60.0 204.0,55.0 210.0,50.0 216.0,45.0 222.0,40.0 228.0,35.0 234.0,30.0 240.0,25.0 246.0,20.0\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2.6\" /><circle cx=\"102.0\" cy=\"140.0\" r=\"4\" fill=\"#1F8A5B\"/><text x=\"108.0\" y=\"134.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1F8A5B\">(−2,−1)</text><circle cx=\"126.0\" cy=\"120.0\" r=\"4\" fill=\"#1F8A5B\"/><text x=\"132.0\" y=\"114.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1F8A5B\">(−1,0)</text><circle cx=\"150.0\" cy=\"100.0\" r=\"4\" fill=\"#1F8A5B\"/><text x=\"156.0\" y=\"94.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1F8A5B\">(0,1)</text><circle cx=\"174.0\" cy=\"80.0\" r=\"4\" fill=\"#1F8A5B\"/><text x=\"180.0\" y=\"74.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1F8A5B\">(1,2)</text><circle cx=\"198.0\" cy=\"60.0\" r=\"4\" fill=\"#1F8A5B\"/><text x=\"204.0\" y=\"54.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1F8A5B\">(2,3)</text><text x=\"150.0\" y=\"244\" font-size=\"11\" font-weight=\"700\" fill=\"#2E2A6B\" text-anchor=\"middle\">y = x + 1</text></svg></div><p class=\"enh\">It crosses the x-axis at <b>(−1, 0)</b> and the y-axis at <b>(0, 1)</b>. Since the gradient k = 1 &gt; 0, the line <b>rises</b>.</p><p class=\"zh\">它与 x 轴交于 <b>(−1, 0)</b>、与 y 轴交于 <b>(0, 1)</b>；斜率 k = 1 &gt; 0，所以<b>上升</b>。</p><h3 class=\"blk\">② Where is y &gt; 0? — the shaded part 阴影部分</h3><p class=\"enh\">\"y &gt; 0\" means the line is <b>above the x-axis</b>. Look at the picture: the line is above the axis exactly when <b>x &gt; −1</b> (the shaded part). So the solution of <b>x + 1 &gt; 0</b> is <b>x &gt; −1</b>.</p><p class=\"zh\">\"y &gt; 0\" 就是直线在 <b>x 轴上方</b>。看图：只有当 <b>x &gt; −1</b> 时直线在轴上方（阴影部分）。所以 <b>x + 1 &gt; 0</b> 的解就是 <b>x &gt; −1</b>。</p><div style=\"display:flex;justify-content:center;margin:14px 0\"><svg viewBox=\"0 0 300 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;height:auto;background:#FBFBFE;border:1px solid #E3E6F0;border-radius:10px\"><polygon points=\"126.0,120.0 246.0,20.0 246.0,120.0\" fill=\"#C0453B\" opacity=\"0.2\"/><line x1=\"30\" y1=\"20\" x2=\"30\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"54\" y1=\"20\" x2=\"54\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"78\" y1=\"20\" x2=\"78\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"102\" y1=\"20\" x2=\"102\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"126\" y1=\"20\" x2=\"126\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"150\" y1=\"20\" x2=\"150\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"174\" y1=\"20\" x2=\"174\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"198\" y1=\"20\" x2=\"198\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"222\" y1=\"20\" x2=\"222\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"246\" y1=\"20\" x2=\"246\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"270\" y1=\"20\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"220\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"200\" x2=\"270\" y2=\"200\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"180\" x2=\"270\" y2=\"180\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"160\" x2=\"270\" y2=\"160\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"140\" x2=\"270\" y2=\"140\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"100\" x2=\"270\" y2=\"100\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"80\" x2=\"270\" y2=\"80\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"60\" x2=\"270\" y2=\"60\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"40\" x2=\"270\" y2=\"40\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"20\" x2=\"270\" y2=\"20\" stroke=\"#EEF0F6\"/><line x1=\"126\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"#C0453B\" stroke-width=\"5\" opacity=\"0.85\"/><line x1=\"30\" y1=\"120\" x2=\"276\" y2=\"120\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"220\" x2=\"150\" y2=\"14\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><text x=\"278\" y=\"124\" font-size=\"11\" fill=\"#6A6A82\">x</text><text x=\"155\" y=\"14\" font-size=\"11\" fill=\"#6A6A82\">y</text><text x=\"139\" y=\"133\" font-size=\"10\" fill=\"#9AA0B8\">O</text><polyline points=\"30.0,200.0 36.0,195.0 42.0,190.0 48.0,185.0 54.0,180.0 60.0,175.0 66.0,170.0 72.0,165.0 78.0,160.0 84.0,155.0 90.0,150.0 96.0,145.0 102.0,140.0 108.0,135.0 114.0,130.0 120.0,125.0 126.0,120.0 132.0,115.0 138.0,110.0 144.0,105.0 150.0,100.0 156.0,95.0 162.0,90.0 168.0,85.0 174.0,80.0 180.0,75.0 186.0,70.0 192.0,65.0 198.0,60.0 204.0,55.0 210.0,50.0 216.0,45.0 222.0,40.0 228.0,35.0 234.0,30.0 240.0,25.0 246.0,20.0\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2.6\" /><polyline points=\"126.0,120.0 130.8,116.0 135.6,112.0 140.4,108.0 145.2,104.0 150.0,100.0 154.8,96.0 159.6,92.0 164.4,88.0 169.2,84.0 174.0,80.0 178.8,76.0 183.6,72.0 188.4,68.0 193.2,64.0 198.0,60.0 202.8,56.0 207.6,52.0 212.4,48.0 217.2,44.0 222.0,40.0 226.8,36.0 231.6,32.0 236.4,28.0 241.2,24.0 246.0,20.0\" fill=\"none\" stroke=\"#C0453B\" stroke-width=\"4.5\"/><circle cx=\"126.0\" cy=\"120.0\" r=\"4\" fill=\"#4A43C4\"/><text x=\"132.0\" y=\"114.0\" font-size=\"11\" font-weight=\"700\" fill=\"#4A43C4\">(−1,0)</text><text x=\"150.0\" y=\"244\" font-size=\"11\" font-weight=\"700\" fill=\"#2E2A6B\" text-anchor=\"middle\">y > 0 shaded 阴影 → x > −1</text></svg></div><div class=\"note\"><strong>Key link 关键联系：</strong>solving the inequality x + 1 &gt; 0 = finding where the graph of y = x + 1 is above the x-axis. 解不等式 = 看图象在 x 轴上方的那段 x。y &lt; 0 就是在<b>下方</b>（x &lt; −1）。</div><h3 class=\"blk\">③ Shading a region 阴影区域（进阶）</h3><p class=\"enh\">Sometimes we shade a whole <b>region</b> of the plane. <b>y &gt; x + 1</b> means <b>all points above the line</b>; y &lt; x + 1 means below. Use a <b>dashed line</b> for &gt; or &lt; (line not included), a <b>solid line</b> for ≥ or ≤.</p><p class=\"zh\">有时要给整片<b>区域</b>涂阴影：<b>y &gt; x + 1</b> = 直线<b>上方</b>所有点；y &lt; x + 1 = 下方。&gt; / &lt; 用<b>虚线</b>（不含线），≥ / ≤ 用<b>实线</b>。</p><div style=\"display:flex;justify-content:center;margin:14px 0\"><svg viewBox=\"0 0 300 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;height:auto;background:#FBFBFE;border:1px solid #E3E6F0;border-radius:10px\"><polygon points=\"30.0,200.0 30.0,20.0 246.0,20.0\" fill=\"#4A43C4\" opacity=\"0.18\"/><line x1=\"30\" y1=\"20\" x2=\"30\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"54\" y1=\"20\" x2=\"54\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"78\" y1=\"20\" x2=\"78\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"102\" y1=\"20\" x2=\"102\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"126\" y1=\"20\" x2=\"126\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"150\" y1=\"20\" x2=\"150\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"174\" y1=\"20\" x2=\"174\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"198\" y1=\"20\" x2=\"198\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"222\" y1=\"20\" x2=\"222\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"246\" y1=\"20\" x2=\"246\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"270\" y1=\"20\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"220\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"200\" x2=\"270\" y2=\"200\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"180\" x2=\"270\" y2=\"180\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"160\" x2=\"270\" y2=\"160\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"140\" x2=\"270\" y2=\"140\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"100\" x2=\"270\" y2=\"100\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"80\" x2=\"270\" y2=\"80\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"60\" x2=\"270\" y2=\"60\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"40\" x2=\"270\" y2=\"40\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"20\" x2=\"270\" y2=\"20\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"276\" y2=\"120\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"220\" x2=\"150\" y2=\"14\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><text x=\"278\" y=\"124\" font-size=\"11\" fill=\"#6A6A82\">x</text><text x=\"155\" y=\"14\" font-size=\"11\" fill=\"#6A6A82\">y</text><text x=\"139\" y=\"133\" font-size=\"10\" fill=\"#9AA0B8\">O</text><polyline points=\"30.0,200.0 36.0,195.0 42.0,190.0 48.0,185.0 54.0,180.0 60.0,175.0 66.0,170.0 72.0,165.0 78.0,160.0 84.0,155.0 90.0,150.0 96.0,145.0 102.0,140.0 108.0,135.0 114.0,130.0 120.0,125.0 126.0,120.0 132.0,115.0 138.0,110.0 144.0,105.0 150.0,100.0 156.0,95.0 162.0,90.0 168.0,85.0 174.0,80.0 180.0,75.0 186.0,70.0 192.0,65.0 198.0,60.0 204.0,55.0 210.0,50.0 216.0,45.0 222.0,40.0 228.0,35.0 234.0,30.0 240.0,25.0 246.0,20.0\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2.6\" stroke-dasharray=\"6 5\"/><circle cx=\"150.0\" cy=\"60.0\" r=\"4\" fill=\"#1F8A5B\"/><text x=\"156.0\" y=\"54.0\" font-size=\"11\" font-weight=\"700\" fill=\"#1F8A5B\">(0,3) ✓</text><text x=\"150.0\" y=\"244\" font-size=\"11\" font-weight=\"700\" fill=\"#2E2A6B\" text-anchor=\"middle\">Region 区域 y > x + 1 (above 上方)</text></svg></div><p class=\"enh\"><b>Quick test 快速判断：</b>pick a point. Is (0, 3) in y &gt; x + 1? Check 3 &gt; 0 + 1 = 1 ✓ — yes, so (0,3) is in the shaded region.</p><p class=\"zh\">取一点代入判断：(0, 3) 在 y &gt; x + 1 里吗？3 &gt; 0+1 = 1 ✓ → 在阴影内。</p><div class=\"practice\"><div class=\"practice-head\">Practice 练习</div><ol><li>For y = x + 1, find y when x = 3　求 x=3 时 y</li><li>Where does y = x + 1 cross the x-axis　与 x 轴交点?</li><li>For which x is x + 1 &gt; 0 (i.e. y &gt; 0)　何时 y &gt; 0?</li><li>Is (0, 2) above or below the line y = x + 1　(0,2) 在直线上方还是下方?</li><li>Is the point (1, 1) in the region y &gt; x + 1　(1,1) 在区域 y &gt; x+1 内吗?</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. y = 4<br>2. (−1, 0)<br>3. x &gt; −1<br>4. 2 &gt; 0+1 = 1 → above 上方<br>5. 1 &gt; 1+1 = 2? No → not in the region 不在（在下方）</div></div></div>"}, {"key": "s6", "nav": "Range from graph 用图求范围", "num": "07", "track": true, "badge": "hard", "title": "Using a graph to find a range", "zh": "用图理解范围（连接不等式）", "body": "<div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">quadratic inequality 二次不等式</span> · <span class=\"t\">root 根</span> · <span class=\"t\">region 区域</span></div><h3 class=\"blk\">Explanation 讲解</h3><p class=\"enh\">Here is why finding a <b>range</b> uses a graph. Take y = x² − 4, which crosses the x-axis at −2 and 2. Solving <b>x² − 4 &gt; 0</b> means \"for which x is the graph <b>above</b> the x-axis?\" — the red parts:</p><p class=\"zh\">这就是\"求范围要看图\"的原因。y = x² − 4 与 x 轴交在 −2、2；解 x² − 4 &gt; 0 = 问\"图象在 x 轴<b>上方</b>的是哪段 x\"（红色）。</p><div style=\"display:flex;justify-content:center;margin:14px 0\"><svg viewBox=\"0 0 300 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:320px;height:auto;background:#FBFBFE;border:1px solid #E3E6F0;border-radius:10px\"><line x1=\"30\" y1=\"20\" x2=\"30\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"54\" y1=\"20\" x2=\"54\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"78\" y1=\"20\" x2=\"78\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"102\" y1=\"20\" x2=\"102\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"126\" y1=\"20\" x2=\"126\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"150\" y1=\"20\" x2=\"150\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"174\" y1=\"20\" x2=\"174\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"198\" y1=\"20\" x2=\"198\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"222\" y1=\"20\" x2=\"222\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"246\" y1=\"20\" x2=\"246\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"270\" y1=\"20\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"220\" x2=\"270\" y2=\"220\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"200\" x2=\"270\" y2=\"200\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"180\" x2=\"270\" y2=\"180\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"160\" x2=\"270\" y2=\"160\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"140\" x2=\"270\" y2=\"140\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"100\" x2=\"270\" y2=\"100\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"80\" x2=\"270\" y2=\"80\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"60\" x2=\"270\" y2=\"60\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"40\" x2=\"270\" y2=\"40\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"20\" x2=\"270\" y2=\"20\" stroke=\"#EEF0F6\"/><line x1=\"30\" y1=\"120\" x2=\"276\" y2=\"120\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"220\" x2=\"150\" y2=\"14\" stroke=\"#6A6A82\" stroke-width=\"1.5\"/><text x=\"278\" y=\"124\" font-size=\"11\" fill=\"#6A6A82\">x</text><text x=\"155\" y=\"14\" font-size=\"11\" fill=\"#6A6A82\">y</text><text x=\"139\" y=\"133\" font-size=\"10\" fill=\"#9AA0B8\">O</text><line x1=\"30\" y1=\"120\" x2=\"102\" y2=\"120\" stroke=\"#C0453B\" stroke-width=\"5\" opacity=\"0.85\"/><line x1=\"198\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"#C0453B\" stroke-width=\"5\" opacity=\"0.85\"/><polyline points=\"78.0,20.0 82.8,43.2 87.6,64.8 92.4,84.8 97.2,103.2 102.0,120.0 106.8,135.2 111.6,148.8 116.4,160.8 121.2,171.2 126.0,180.0 130.8,187.2 135.6,192.8 140.4,196.8 145.2,199.2 150.0,200.0 154.8,199.2 159.6,196.8 164.4,192.8 169.2,187.2 174.0,180.0 178.8,171.2 183.6,160.8 188.4,148.8 193.2,135.2 198.0,120.0 202.8,103.2 207.6,84.8 212.4,64.8 217.2,43.2 222.0,20.0\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2.6\"/><circle cx=\"102.0\" cy=\"120.0\" r=\"4\" fill=\"#C0453B\"/><text x=\"108.0\" y=\"114.0\" font-size=\"11\" font-weight=\"700\" fill=\"#C0453B\">−2</text><circle cx=\"198.0\" cy=\"120.0\" r=\"4\" fill=\"#C0453B\"/><text x=\"204.0\" y=\"114.0\" font-size=\"11\" font-weight=\"700\" fill=\"#C0453B\">2</text><text x=\"150.0\" y=\"244\" font-size=\"11\" font-weight=\"700\" fill=\"#2E2A6B\" text-anchor=\"middle\">y = x² − 4: red = where y > 0</text></svg></div><ul><li><b>x² − 4 &gt; 0</b> (above 上方) → <b>x &lt; −2 or x &gt; 2</b> (outside the roots 取两边)</li><li><b>x² − 4 &lt; 0</b> (below 下方) → <b>−2 &lt; x &lt; 2</b> (between the roots 取中间)</li></ul><div class=\"note\">This is the picture behind \"<strong>outside the roots for &gt;0, between the roots for &lt;0</strong>\". 这就是\"大于取两边、小于取中间\"的图像来源：先求根（交点）→ 分段 → 看上方/下方。</div><div class=\"practice\"><div class=\"practice-head\">Practice 6 练习6 (about 对着 y = x² − 1)</div><ol><li>Solve 解　x² − 1 &gt; 0</li><li>Solve 解　x² − 1 &lt; 0</li><li>Solve 解　x² + 1 &gt; 0 (think where the parabola sits 想抛物线在哪)</li><li>Why find the roots first 为什么先求根?</li></ol><button class=\"reveal\" onclick=\"ans(this)\">Show answers 显示答案</button><div class=\"answer\"><div class=\"answer-inner\">1. x &lt; −1 or x &gt; 1<br>2. −1 &lt; x &lt; 1<br>3. all real numbers 所有实数 (whole parabola is above the x-axis)<br>4. the roots are where it crosses the x-axis; they split the axis into pieces so you can tell above from below　根是交点，把 x 轴分段后才能判断上/下方</div></div></div>"}, {"key": "end", "nav": "Summary 小结", "num": "", "track": false, "title": "Summary & self-check", "zh": "小结与自查", "body": "<h3 class=\"blk\">Self-check 自查 (tap to tick 点一下打勾)</h3><div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">Number line: right &gt; left; compare negatives, opposite, absolute value　数轴右大左小、负数比较、相反数、绝对值</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">Draw a solution set (open/filled circle)　用空心/实心圆画解集</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">Know why the sign flips (reflection)　懂变号原因</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">Plot points, name quadrants　描点、判断象限</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">Read intercepts, y&gt;0 region, increasing/decreasing　读交点、y&gt;0 区间、升降</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">Recognise line (k) & parabola (a, vertex)　认得直线与抛物线</div></div><div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">Solve a quadratic inequality from its graph　用图解二次不等式</div></div></div><div class=\"note\" style=\"margin-top:18px\"><strong>Pass mark 过关：</strong>get the practice right, then go to <b>Inequalities</b>. 练习做对就进\"不等式\"。</div><div class=\"parent\"><h4>For parents 给家长的话</h4><p class=\"zh\">这份是零基础的看图直觉，是不等式、函数、坐标几何的共同地基，别跳过。重点确认两点：① 她能把不等式解<b>画到数轴上</b>（空心/实心别反）；② 理解 <b>y&gt;0 = 图象在 x 轴上方</b>。顺序：本份 → 不等式 → 模块。</p></div>"}];
const tocList=document.getElementById('tocList'),content=document.getElementById('content'),progFill=document.getElementById('progFill'),progLabel=document.getElementById('progLabel'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),doneBtn=document.getElementById('doneBtn');
let cur=0;const done=new Set();const trackedTotal=S.filter(s=>s.track).length;
S.forEach((s,i)=>{const a=document.createElement('a');a.dataset.i=i;a.innerHTML=`<span class="n">${s.num||'·'}</span><span class="lbl">${s.nav}</span><span class="tick"></span>`;a.onclick=()=>go(i);tocList.appendChild(a);});
const tocLinks=[...tocList.children];
function render(){
  const s=S[cur];
  const badgeHtml = s.badge==='core'?'<span class="badge core">★ Must-know 必背</span>':s.badge==='gk'?'<span class="badge gk">★ Often tested 常考</span>':s.badge==='hard'?'<span class="badge hard">★ Harder 难题</span>':'';
  const zt = s.zh?`<div class="zh-title">${s.zh}</div>`:'';
  content.innerHTML=`<div class="sec-head">${s.num?`<div class="sec-num">${s.num}</div>`:''}<div class="sec-titles"><h2>${s.title}</h2>${zt}${badgeHtml}</div></div><div class="divider"></div>${s.body}`;
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
  prevBtn.disabled=cur===0;nextBtn.disabled=cur===S.length-1;
  if(s.track){doneBtn.style.display='';const d=done.has(cur);doneBtn.textContent=d?'Done 已学完 ✓':'Done 学完了 ✓';doneBtn.classList.toggle('is-done',d);}else{doneBtn.style.display='none';}
  content.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});
}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));render();closeMenu();}
prevBtn.onclick=()=>go(cur-1);nextBtn.onclick=()=>go(cur+1);
doneBtn.onclick=()=>{if(!S[cur].track)return;if(done.has(cur))done.delete(cur);else done.add(cur);updateProgress();render();if(done.has(cur)&&cur<S.length-1)setTimeout(()=>go(cur+1),260);};
function updateProgress(){const n=[...done].filter(i=>S[i].track).length;progFill.style.width=(n/trackedTotal*100)+'%';progLabel.textContent=`${n} / ${trackedTotal}`;tocLinks.forEach((a,i)=>a.classList.toggle('done',done.has(i)&&S[i].track));}
function ans(btn){const box=btn.nextElementSibling;const open=box.classList.toggle('open');btn.textContent=open?btn.textContent.replace('Show','Hide').replace('显示','隐藏'):btn.textContent.replace('Hide','Show').replace('隐藏','显示');}
function tick(el){el.classList.toggle('on');}
const PASCAL_EXP={0:'(a+b)⁰ = 1',1:'(a+b)¹ = a + b',2:'(a+b)² = a² + 2ab + b²',3:'(a+b)³ = a³ + 3a²b + 3ab² + b³',4:'(a+b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴',5:'(a+b)⁵ = a⁵ + 5a⁴b + 10a³b² + 10a²b³ + 5ab⁴ + b⁵',6:'(a+b)⁶ = a⁶ + 6a⁵b + 15a⁴b² + 20a³b³ + 15a²b⁴ + 6ab⁵ + b⁶'};
function pascalPick(r){document.querySelectorAll('#pascalTri .prow').forEach(el=>el.classList.toggle('sel',+el.dataset.r===r));const out=document.getElementById('pascalOut');if(out)out.innerHTML='Row 第 '+r+' 行 → <b>'+PASCAL_EXP[r]+'</b>';}
const toc=document.getElementById('toc'),scrim=document.getElementById('scrim');
document.getElementById('menuBtn').onclick=()=>{toc.classList.add('open');scrim.classList.add('show');};
function closeMenu(){toc.classList.remove('open');scrim.classList.remove('show');}
scrim.onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'&&cur<S.length-1)go(cur+1);if(e.key==='ArrowLeft'&&cur>0)go(cur-1);});
render();updateProgress();
</script>
