<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guangjian Maths · G · Quadrilaterals 四边形</title>
<style>
  :root{
    --bg:#F4F6FB;--surface:#FFFFFF;--ink:#1B1B2A;--muted:#6A6A82;--line:#E3E6F0;
    --indigo:#4A43C4;--indigo-deep:#2E2A6B;--indigo-soft:#EEF0FC;
    --amber:#C77A15;--amber-soft:#FCF2DF;--green:#1F8A5B;--green-soft:#E6F5EE;
    --rose:#C0453B;--rose-soft:#FBEDEC;--radius:14px;
    --shadow:0 1px 2px rgba(30,30,60,.05), 0 8px 24px rgba(30,30,60,.06);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;}
  header.top{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;}
  .top-row{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto;}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--indigo);font-weight:700;text-transform:uppercase;}
  .brand h1{margin:0;font-size:16px;font-weight:800;color:var(--indigo-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prog-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:170px;}
  .prog-label{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .prog-track{flex:1;height:8px;background:#DDE1EE;border-radius:99px;overflow:hidden;min-width:80px;}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--indigo),#7A73E6);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer;color:var(--indigo-deep);}
  .layout{display:grid;grid-template-columns:262px 1fr;gap:30px;max-width:1180px;margin:26px auto;padding:0 22px;align-items:start;}
  nav.toc{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);}
  .toc h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 8px 10px;font-weight:700;}
  .toc a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;}
  .toc a:hover{background:var(--indigo-soft);}
  .toc a.active{background:var(--indigo-soft);border-color:#D5D8F5;font-weight:700;color:var(--indigo-deep);}
  .toc .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--indigo);font-size:13px;width:22px;flex:none;}
  .toc a.active .n{color:var(--indigo-deep);}
  .toc .lbl{flex:1;min-width:0;}
  .toc .tick{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid #CBD0E4;display:grid;place-items:center;font-size:10px;color:#fff;}
  .toc a.done .tick{background:var(--green);border-color:var(--green);}
  .toc a.done .tick::after{content:"✓";}
  main{min-width:0;}
  section.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 34px 30px;animation:rise .4s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px;}
  .sec-num{font-size:34px;font-weight:800;color:var(--indigo);line-height:1;font-variant-numeric:tabular-nums;flex:none;padding-top:2px;}
  .sec-titles{flex:1;min-width:0;}
  .sec-titles h2{margin:0;font-size:22px;font-weight:800;color:var(--indigo-deep);}
  .sec-titles .zh-title{font-size:15px;color:var(--muted);font-weight:700;margin-top:2px;}
  .badge{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;}
  .badge.gk{background:var(--amber-soft);color:var(--amber);}
  .badge.core{background:var(--indigo-soft);color:var(--indigo);}
  .badge.hard,.badge.warn{background:var(--rose-soft);color:var(--rose);}
  .badge.Concept{background:var(--grey-soft,#EEF0F4);color:#4a4a5e;}
  .badge.Fluency{background:var(--green-soft);color:var(--green);}
  .badge.Applied{background:var(--amber-soft);color:var(--amber);}
  .badge.Elite{background:var(--rose-soft);color:var(--rose);}
  .blk{font-size:15px;color:var(--indigo-deep);margin:14px 0 6px;font-weight:800;}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  h3.blk{font-size:15px;font-weight:800;color:var(--indigo);margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  h3.blk::before{content:"";width:5px;height:16px;border-radius:3px;background:var(--indigo);display:inline-block;}
  p{margin:9px 0;}
  .content b{color:var(--indigo-deep);}
  .content ul,.content ol{margin:10px 0;padding-left:22px;}
  .content li{margin:6px 0;}
  .zh{color:#4a4a5e;font-size:14.5px;}
  .zh::before{content:"中  ";color:var(--green);font-weight:800;font-size:11px;letter-spacing:.05em;}
  .enh::before{content:"EN  ";color:var(--indigo);font-weight:800;font-size:11px;letter-spacing:.05em;}
  .terms{background:#F1F7F4;border:1px solid #CFE6DA;border-radius:10px;padding:11px 15px;margin:12px 0;font-size:14px;color:#14653f;line-height:1.9;}
  .terms b{color:#14653f;}
  .terms .t{white-space:nowrap;}
  .kbd-formula{display:block;background:var(--indigo-soft);border:1px solid #D9DCF6;border-radius:10px;padding:14px 18px;margin:14px 0;font-size:18px;text-align:center;color:var(--indigo-deep);font-weight:700;}
  .example{background:#FBFBFE;border:1px solid var(--line);border-left:4px solid var(--indigo);border-radius:12px;padding:16px 18px;margin:16px 0;}
  .ex-title{font-weight:800;color:var(--indigo-deep);font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ex-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--amber-soft);color:var(--amber);}
  .steps{margin:8px 0;}
  .step{position:relative;padding:5px 0 5px 20px;}
  .step::before{content:"";position:absolute;left:5px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--indigo);}
  .ex-ans{margin-top:10px;background:var(--green-soft);border-radius:8px;padding:8px 12px;font-weight:800;color:var(--green);}
  .note{background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14.5px;color:#7a5210;}
  .note.warn{background:var(--rose-soft);color:#8c2f28;}
  .note strong{color:inherit;}
  .practice{background:#FFFFFF;border:1.5px dashed #C9CEE6;border-radius:12px;padding:16px 18px;margin:18px 0;}
  .practice-head{font-weight:800;color:var(--indigo-deep);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .practice-head::before{content:"✎";color:var(--indigo);}
  .reveal{margin-top:10px;background:var(--indigo);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .reveal:hover{background:#3a34a8;}
  .answer{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .answer.open{max-height:1400px;margin-top:12px;}
  .answer-inner{background:var(--green-soft);border-radius:10px;padding:12px 16px;font-size:14.5px;}
  .answer-inner b{color:var(--green);}
  .pascal{display:flex;flex-direction:column;align-items:center;gap:9px;margin:18px 0 10px;}
  .prow{display:flex;gap:9px;cursor:pointer;padding:5px 9px;border-radius:12px;border:1.5px solid transparent;transition:background .15s,border-color .15s;}
  .prow:hover{background:var(--indigo-soft);}
  .prow.sel{background:var(--amber-soft);border-color:#EEDBB0;}
  .pcell{display:grid;place-items:center;min-width:40px;height:40px;padding:0 7px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;font-weight:800;color:var(--indigo-deep);font-variant-numeric:tabular-nums;}
  .prow.sel .pcell{border-color:var(--amber);color:var(--amber);}
  .pascal-out{text-align:center;background:var(--indigo-soft);border:1px solid #D9DCF6;border-radius:10px;padding:12px 16px;font-size:15px;color:var(--indigo-deep);margin:6px 0;min-height:22px;}
  .lore{background:#F2F3FC;border:1px solid #E0E3F5;border-left:4px solid #8983E0;border-radius:12px;padding:14px 18px;margin:16px 0;font-size:14.5px;color:#3b3b54;}
  .lore h5{margin:0 0 8px;color:var(--indigo-deep);font-size:14.5px;font-weight:800;}
  .check-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;}
  .check-item:last-child{border-bottom:none;}
  .check-box{width:20px;height:20px;border:2px solid #C4C9E0;border-radius:6px;flex:none;margin-top:3px;display:grid;place-items:center;color:#fff;font-size:13px;}
  .check-item.on .check-box{background:var(--green);border-color:var(--green);}
  .check-item.on .check-box::after{content:"✓";}
  .check-item.on .check-txt{color:var(--muted);text-decoration:line-through;}
  .parent{background:var(--indigo-soft);border-radius:12px;padding:16px 18px;margin-top:22px;}
  .parent h4{margin:0 0 6px;color:var(--indigo-deep);}
  .pager{display:flex;align-items:center;gap:12px;margin-top:26px;}
  .pager button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--indigo-deep);}
  .pager button:hover:not(:disabled){background:var(--indigo-soft);}
  .pager button:disabled{opacity:.4;cursor:not-allowed;}
  .pager .done-btn{flex:1.3;background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .pager .done-btn.is-done{background:var(--green);border-color:var(--green);}
  .scrim{display:none;}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;padding:0 16px;margin-top:16px;}
    .menu-btn{display:block;}
    nav.toc{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:50;border-radius:0 16px 16px 0;transform:translateX(-102%);transition:transform .28s ease;overflow-y:auto;padding-top:18px;}
    nav.toc.open{transform:none;}
    .scrim.show{display:block;position:fixed;inset:0;background:rgba(20,20,40,.4);z-index:40;}
    .brand h1{font-size:14px;white-space:normal;}.prog-wrap{min-width:110px;}
    section.card{padding:24px 20px;}.sec-num{font-size:28px;}.sec-titles h2{font-size:19px;}
    .pager{flex-wrap:wrap;}.pager .done-btn{order:-1;flex-basis:100%;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
  :focus-visible{outline:3px solid #A9A4F0;outline-offset:2px;border-radius:6px;}

.dltools{position:fixed;top:12px;right:14px;z-index:70;display:flex;gap:8px}
.dltools button{border:none;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;box-shadow:0 4px 12px rgba(30,30,60,.18)}
.dltools .b-md{background:#1F8A5B}.dltools .b-pdf{background:#4A43C4}
@media(max-width:860px){.dltools{top:auto;bottom:14px;right:12px}}
@media print{.top,nav.toc,.pager,.scrim,.dltools,.menu-btn,.prog-wrap,.hero,.sumbar,.back,.reset{display:none!important}
 .layout{display:block!important;margin:0!important;padding:0!important;grid-template-columns:1fr!important}
 main,.wrap{max-width:100%!important;margin:0!important}
 section.card{box-shadow:none!important;border:none!important;padding:0!important;animation:none!important}
 .answer{max-height:none!important;overflow:visible!important}
 .psec{page-break-after:always}}
</style>

<script>
const S = [{"key": "intro", "nav": "Intro 导读", "num": "", "track": false, "title": "Quadrilaterals — the second-biggest geometry topic", "zh": "四边形——几何第二高频", "body": "\n <p class=\"enh\">Quadrilaterals are the <b>second most-tested geometry topic</b> in the Guangjian papers (about eight times). They build directly on triangles &amp; congruence, and lead into area problems, folding and coordinate geometry.</p>\n <p class=\"zh\">四边形是光剑几何里<b>第二高频</b>（约考八次）。它直接建立在三角形与全等之上，往上通向面积法、翻折、坐标几何。</p>\n <div class=\"note\"><b>先要会 needs：</b>triangles &amp; congruence 三角形与全等、similarity 相似。<b>解锁 unlocks：</b>area method 面积法、folding 翻折、coordinate figures 坐标图形。</div>\n <p class=\"zh\">难度：<b>Concept</b> 概念 · <b>Fluency</b> 熟练 · <b>Applied</b> 综合 · <b>Elite</b> 压轴。每节难度按真实例题定。</p>"}, {"key": "pgram", "nav": "Parallelogram 平行四边形", "num": "01", "track": true, "tier": "Fluency", "title": "Parallelogram", "zh": "平行四边形", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">parallelogram 平行四边形</span> · <span class=\"t\">opposite sides 对边</span> · <span class=\"t\">diagonal 对角线</span> · <span class=\"t\">bisect 平分</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">A <b>parallelogram</b> has both pairs of opposite sides parallel. Then: opposite sides equal, opposite angles equal, and the <b>diagonals bisect each other</b>. Area = base × height.</p>\n <p class=\"zh\">平行四边形：两组对边分别平行。于是——对边相等、对角相等、<b>对角线互相平分</b>。面积 = 底 × 高。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 175\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<polygon points=\"55,145 205,145 250,55 100,55\" fill=\"#EEF0FC\" stroke=\"#4A43C4\" stroke-width=\"1.6\"/>\n<line x1=\"100\" y1=\"55\" x2=\"100\" y2=\"145\" stroke=\"#C77A15\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n<rect x=\"100\" y=\"136\" width=\"9\" height=\"9\" fill=\"none\" stroke=\"#C77A15\" stroke-width=\"1\"/>\n<text x=\"46\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1B1B2A\">A</text><text x=\"213\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1B1B2A\">B</text><text x=\"258\" y=\"55\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1B1B2A\">C</text><text x=\"91\" y=\"55\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1B1B2A\">D</text>\n<text x=\"130.0\" y=\"161\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#4a4a5e\">base 底</text><text x=\"84\" y=\"100.0\" text-anchor=\"end\" font-size=\"10\" font-weight=\"700\" fill=\"#C77A15\">h 高</text></svg></div>\n <span class=\"kbd-formula\">Area 面积 = base × height = b × h</span>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">A parallelogram has base 8 and height 5, and one angle 70°. Find its area and the other angles.</div>\n   <div class=\"step\">Area = 8 × 5 = 40. Opposite angle = 70°; adjacent = 180 − 70 = 110°.</div></div>\n   <div class=\"ex-ans\">Area = <b>40</b>; angles <b>70°, 110°, 70°, 110°</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Parallelogram base 12, height 4.5. Find the area.</li>\n   <li>In ▱ABCD, ∠A = 65°. Find ∠B and ∠C.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>54</b>　2) <b>∠B = 115°, ∠C = 65°</b>（邻角互补、对角相等）</div></div></div>"}, {"key": "special", "nav": "Rect/Rhombus/Square 特殊", "num": "02", "track": true, "tier": "Applied", "badge": "gk", "title": "Rectangle · Rhombus · Square", "zh": "矩形 · 菱形 · 正方形", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">rectangle 矩形</span> · <span class=\"t\">rhombus 菱形</span> · <span class=\"t\">square 正方形</span> · <span class=\"t\">perpendicular 垂直</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">These are special parallelograms, so they inherit all its properties and add more:</p>\n <p class=\"zh\">它们都是特殊的平行四边形，继承全部性质再加料：</p>\n <span class=\"kbd-formula\"><b>Rectangle 矩形</b>：4 right angles 四直角；diagonals equal 对角线相等<br><b>Rhombus 菱形</b>：4 equal sides 四边相等；diagonals ⊥ &amp; area = ½·d₁·d₂<br><b>Square 正方形</b>：both 兼具；diagonal = side·√2</span>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 250 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<polygon points=\"125,25 215,95 125,165 35,95\" fill=\"#E6F5EE\" stroke=\"#1F8A5B\" stroke-width=\"1.6\"/>\n<line x1=\"125\" y1=\"25\" x2=\"125\" y2=\"165\" stroke=\"#C77A15\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n<line x1=\"215\" y1=\"95\" x2=\"35\" y2=\"95\" stroke=\"#C77A15\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n<rect x=\"119\" y=\"89\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"#C77A15\" stroke-width=\"0.9\"/>\n<text x=\"15\" y=\"99\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#C77A15\">d₁</text><text x=\"141\" y=\"59\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#C77A15\">d₂</text>\n<text x=\"125\" y=\"182\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#1F8A5B\">菱形 rhombus · 面积=½·d₁·d₂</text></svg></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · rhombus 菱形</div>\n   <div class=\"steps\"><div class=\"step\">A rhombus has diagonals 6 and 8. Find its area and side length.</div>\n   <div class=\"step\">Area = ½ × 6 × 8 = 24.</div>\n   <div class=\"step\">Diagonals bisect at right angles ⇒ side = √(3² + 4²) = 5.</div></div>\n   <div class=\"ex-ans\">Area = <b>24</b>, side = <b>5</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Rectangle 6 by 8. Find the length of a diagonal.</li>\n   <li>Square of side 5. Find its diagonal (leave in surd form).</li>\n   <li>Rhombus with diagonals 10 and 24. Find area and side.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>10</b>（√(6²+8²)）　2) <b>5√2</b>　3) area <b>120</b>, side <b>13</b>（√(5²+12²)）</div></div></div>"}, {"key": "trap", "nav": "Trapezium 梯形", "num": "03", "track": true, "tier": "Fluency", "title": "Trapezium & midsegment", "zh": "梯形与中位线", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">trapezium 梯形</span> · <span class=\"t\">parallel sides 两底</span> · <span class=\"t\">midsegment 中位线</span> · <span class=\"t\">height 高</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">A <b>trapezium</b> has one pair of parallel sides (a and b). Its area is the average of the two parallel sides times the height. The <b>midsegment</b> (joining the midpoints of the legs) equals that average.</p>\n <p class=\"zh\">梯形：只有一组对边平行（上底 a、下底 b）。面积 = 两底平均 × 高；<b>中位线</b>（两腰中点连线）= 两底平均。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 165\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<polygon points=\"40,135 262,135 206,52 92,52\" fill=\"#FCF2DF\" stroke=\"#C77A15\" stroke-width=\"1.6\"/>\n<line x1=\"66.0\" y1=\"93.5\" x2=\"234.0\" y2=\"93.5\" stroke=\"#4A43C4\" stroke-width=\"1.5\" stroke-dasharray=\"5 3\"/>\n<text x=\"149.0\" y=\"47\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#4a4a5e\">a (top 上底)</text><text x=\"151.0\" y=\"151\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#4a4a5e\">b (bottom 下底)</text>\n<text x=\"238.0\" y=\"97.5\" text-anchor=\"start\" font-size=\"10\" font-weight=\"700\" fill=\"#4A43C4\">中位线</text>\n<text x=\"32\" y=\"140\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1B1B2A\">A</text><text x=\"270\" y=\"140\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1B1B2A\">B</text><text x=\"214\" y=\"52\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1B1B2A\">C</text><text x=\"84\" y=\"52\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1B1B2A\">D</text></svg></div>\n <span class=\"kbd-formula\">Area 面积 = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">(a + b)</span><span style=\"padding:0 3px\">2</span></span> × h　·　Midsegment 中位线 = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">a + b</span><span style=\"padding:0 3px\">2</span></span></span>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">Trapezium: top a = 6, bottom b = 10, height h = 4. Find the area and midsegment.</div>\n   <div class=\"step\">Area = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">(6+10)</span><span style=\"padding:0 3px\">2</span></span> × 4 = 8 × 4 = 32. Midsegment = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">6+10</span><span style=\"padding:0 3px\">2</span></span> = 8.</div></div>\n   <div class=\"ex-ans\">Area = <b>32</b>, midsegment = <b>8</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Trapezium a = 5, b = 9, h = 6. Find the area.</li>\n   <li>A trapezium has midsegment 11 and height 4. Find its area.　（提示：面积=中位线×高）</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>42</b>（½·14·6）　2) <b>44</b>（中位线×高 = 11×4）</div></div></div>"}, {"key": "mid", "nav": "Midpoints 中点/中位线", "num": "04", "track": true, "tier": "Applied", "title": "Midpoints & the midpoint quadrilateral", "zh": "中点、中位线与中点四边形", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">midpoint 中点</span> · <span class=\"t\">triangle midsegment 三角形中位线</span> · <span class=\"t\">parallel & half 平行且一半</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">The segment joining the midpoints of two sides of a triangle is <b>parallel to the third side and half its length</b> — this is really similarity with ratio <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">2</span></span>.</p>\n <p class=\"zh\">连接三角形两边中点的线段，<b>平行于第三边且等于它的一半</b>——本质就是相似比 <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">2</span></span>。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 280 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<polygon points=\"40,185 245,160 200,40 60,70\" fill=\"#F4F6FB\" stroke=\"#6A6A82\" stroke-width=\"1.4\"/>\n<polygon points=\"142,172 222,100 130,55 50,128\" fill=\"#EEF0FC\" stroke=\"#4A43C4\" stroke-width=\"1.8\"/>\n<circle cx=\"142\" cy=\"172\" r=\"2.6\" fill=\"#4A43C4\"/><circle cx=\"222\" cy=\"100\" r=\"2.6\" fill=\"#4A43C4\"/><circle cx=\"130\" cy=\"55\" r=\"2.6\" fill=\"#4A43C4\"/><circle cx=\"50\" cy=\"128\" r=\"2.6\" fill=\"#4A43C4\"/>\n<text x=\"140\" y=\"200\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#4A43C4\">任意四边形各边中点 → 平行四边形</text></svg></div>\n <div class=\"note\"><b>Varignon 中点四边形：</b>the midpoints of <b>any</b> quadrilateral's sides form a parallelogram (area = half the original). 任意四边形各边中点连成的一定是平行四边形，面积是原来的一半。</div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">In △ABC, D, E are midpoints of AB, AC. BC = 12. Find DE.</div>\n   <div class=\"step\">DE = ½ BC = ½ × 12.</div></div>\n   <div class=\"ex-ans\">DE = <b>6</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>D, E midpoints of AB, AC; DE = 7. Find BC.</li>\n   <li>A quadrilateral has area 40. Find the area of its midpoint parallelogram (Varignon).</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>BC = 14</b>　2) <b>20</b>（原面积的一半）</div></div></div>"}, {"key": "coord", "nav": "Coordinates 坐标四边形", "num": "05", "track": true, "tier": "Applied", "title": "Quadrilaterals in coordinates", "zh": "坐标中的四边形", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">distance formula 距离公式</span> · <span class=\"t\">midpoint formula 中点公式</span> · <span class=\"t\">diagonal 对角线</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">On the grid, use the <b>distance formula</b> for side lengths and the <b>midpoint formula</b> for centres. A rhombus ⇔ all four sides equal; a rectangle ⇔ diagonals equal; a square ⇔ both.</p>\n <p class=\"zh\">在坐标系里，用<b>距离公式</b>算边长、<b>中点公式</b>算中心。四边相等 ⇒ 菱形；对角线相等 ⇒ 矩形；两者都满足 ⇒ 正方形。</p>\n <div class=\"example\"><div class=\"ex-title\">Example 例题　【同型·光剑 4年制】</div>\n   <div class=\"steps\"><div class=\"step\">A(0,0), B(4,3), C(8,0), D(4,−3). Show ABCD is a rhombus and find its diagonals.</div>\n   <div class=\"step\">Each side = √(4² + 3²) = 5 (all equal) ⇒ rhombus.</div>\n   <div class=\"step\">Diagonal AC = 8, diagonal BD = 6.</div></div>\n   <div class=\"ex-ans\">Rhombus; diagonals <b>AC = 8, BD = 6</b> (area = ½·8·6 = 24)</div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>P(1,1), Q(5,1), R(5,4), S(1,4). What special quadrilateral is PQRS? Find its area.</li>\n   <li>A(0,0), C(6,8) are opposite corners of a rectangle. Find the midpoint of AC (the centre).</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>Rectangle 矩形</b>, area = 4×3 = <b>12</b>　2) centre = <b>(3, 4)</b></div></div></div>"}, {"key": "elite", "nav": "Elite 压轴", "num": "06", "track": true, "tier": "Elite", "badge": "hard", "title": "Exam-level: quadrilaterals combined", "zh": "压轴 · 四边形综合", "body": "\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">Hard problems mix quadrilaterals with <b>similarity</b>, <b>Pythagoras</b> and <b>reflection (shortest path)</b>. Below are adapted exam-type problems.</p>\n <p class=\"zh\">压轴题常把四边形和<b>相似</b>、<b>勾股</b>、<b>翻折/将军饮马</b>混起来。下面是改编同型题。</p>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · rectangle + similar 矩形+相似　【同型·光剑】</div>\n   <div class=\"steps\"><div class=\"step\">Rectangle with AB = 6, BC = 8, so diagonal AC = 10. H is the foot of the perpendicular from B to AC. Find BH.</div>\n   <div class=\"step\">△ABH ~ △ACB (AA) ⇒ <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">BH</span><span style=\"padding:0 3px\">AB</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">BC</span><span style=\"padding:0 3px\">AC</span></span> ⇒ BH = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">AB·BC</span><span style=\"padding:0 3px\">AC</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">6×8</span><span style=\"padding:0 3px\">10</span></span>.</div></div>\n   <div class=\"ex-ans\">BH = <b><span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">24</span><span style=\"padding:0 3px\">5</span></span> = 4.8</b></div></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · rhombus + reflection 菱形+将军饮马　【同型·光剑春招】</div>\n   <div class=\"steps\"><div class=\"step\">In rhombus ABCD a moving point P on a diagonal must reach two fixed points E, F. Reflect one point across the diagonal; the shortest PE + PF becomes a straight segment.</div>\n   <div class=\"step\">The minimum equals the straight-line distance between E and the reflected F.</div></div>\n   <div class=\"ex-ans\">Method: <b>reflect across the axis, then straighten 对称化直</b>（将军饮马）</div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习（纯题·先做再看）</div>\n   <ol><li>Rhombus diagonals 16 and 12. Find its side and area.　【同型】</li>\n   <li>Rectangle 5 by 12; find the length of the perpendicular from a corner to the diagonal.</li>\n   <li>Square ABCD side 6; E is the midpoint of BC. Find the length AE.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) side <b>10</b>（√(8²+6²)）, area <b>96</b>（½·16·12）　2) <b><span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">60</span><span style=\"padding:0 3px\">13</span></span></b>（5·12/13, 对角线=13）　3) <b>3√5</b>（√(6²+3²)）</div></div></div>"}, {"key": "end", "nav": "Summary 小结", "num": "", "track": false, "title": "Summary & where this leads", "zh": "小结与它通向哪里", "body": "\n <div class=\"terms\" style=\"background:#EEF0FC;border-color:#D9DCF6;color:#2E2A6B\"><b>One-line 一句话：</b>Parallelogram is the parent; rectangle/rhombus/square add \"equal / perpendicular diagonals\". For area, use base×height, ½·d₁·d₂ (rhombus) or ½(a+b)h (trapezium). 平行四边形是\"父类\"，特殊四边形加\"对角线相等/垂直\"。面积三招：底×高、½d₁d₂、½(a+b)h。</div>\n <h3 class=\"blk\">This unlocks 它解锁了</h3>\n <p class=\"zh\">四边形往下通向：<b>面积法</b>（梯形/图形分割）、<b>翻折·旋转</b>（矩形/正方形折叠压轴）、<b>坐标几何</b>（用坐标判定图形）。在总逻辑图里点「四边形」能看到这些下游。</p>\n <div class=\"check-list\">\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">平行四边形性质：对边/对角相等、对角线互相平分</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">矩形对角线相等、菱形对角线垂直且面积=½d₁d₂、正方形对角线=边√2</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">梯形面积=½(a+b)h、中位线=½(a+b)</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">三角形/四边形中位线、Varignon 中点四边形</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">坐标判定图形、矩形+相似求垂足段、菱形+将军饮马</div></div>\n </div>\n <div class=\"parent\"><h4>给家长的话</h4><p style=\"margin:0;font-size:14px;color:#4a4a5e\">四边形是几何第二高频（光剑约8次）。这份把\"平行四边形→特殊四边形→梯形→中位线→坐标→压轴\"串成一条线，压轴部分刻意和相似/勾股/翻折叠在一起，跟真题一致。她若卡住，多半是没认出\"这里能用相似或对角线性质\"。</p></div>"}];
const tocList=document.getElementById('tocList'),content=document.getElementById('content'),progFill=document.getElementById('progFill'),progLabel=document.getElementById('progLabel'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),doneBtn=document.getElementById('doneBtn');
let cur=0;const done=new Set();const trackedTotal=S.filter(s=>s.track).length;
S.forEach((s,i)=>{const a=document.createElement('a');a.dataset.i=i;a.innerHTML=`<span class="n">${s.num||'·'}</span><span class="lbl">${s.nav}</span><span class="tick"></span>`;a.onclick=()=>go(i);tocList.appendChild(a);});
const tocLinks=[...tocList.children];
function render(){
  const s=S[cur];
  const tierHtml = s.tier?`<span class="badge ${s.tier}">${s.tier}</span>`:'';const gkHtml = s.badge==='gk'?'<span class="badge gk">★ Often tested 常考</span>':s.badge==='hard'?'<span class="badge hard">★ Harder 难题</span>':s.badge==='core'?'<span class="badge core">★ Must-know 必背</span>':'';const badgeHtml = tierHtml+gkHtml;
  const zt = s.zh?`<div class="zh-title">${s.zh}</div>`:'';
  content.innerHTML=`<div class="sec-head">${s.num?`<div class="sec-num">${s.num}</div>`:''}<div class="sec-titles"><h2>${s.title}</h2>${zt}${badgeHtml}</div></div><div class="divider"></div>${s.body}`;
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
  prevBtn.disabled=cur===0;nextBtn.disabled=cur===S.length-1;
  if(s.track){doneBtn.style.display='';const d=done.has(cur);doneBtn.textContent=d?'Done 已学完 ✓':'Done 学完了 ✓';doneBtn.classList.toggle('is-done',d);}else{doneBtn.style.display='none';}
  content.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});
}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));render();closeMenu();}
prevBtn.onclick=()=>go(cur-1);nextBtn.onclick=()=>go(cur+1);
doneBtn.onclick=()=>{if(!S[cur].track)return;if(done.has(cur))done.delete(cur);else done.add(cur);updateProgress();render();if(done.has(cur)&&cur<S.length-1)setTimeout(()=>go(cur+1),260);};
function updateProgress(){const n=[...done].filter(i=>S[i].track).length;progFill.style.width=(n/trackedTotal*100)+'%';progLabel.textContent=`${n} / ${trackedTotal}`;tocLinks.forEach((a,i)=>a.classList.toggle('done',done.has(i)&&S[i].track));}
function ans(btn){const box=btn.nextElementSibling;const open=box.classList.toggle('open');btn.textContent=open?btn.textContent.replace('Show','Hide').replace('显示','隐藏'):btn.textContent.replace('Hide','Show').replace('隐藏','显示');}
function tick(el){el.classList.toggle('on');}
const PASCAL_EXP={0:'(a+b)⁰ = 1',1:'(a+b)¹ = a + b',2:'(a+b)² = a² + 2ab + b²',3:'(a+b)³ = a³ + 3a²b + 3ab² + b³',4:'(a+b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴',5:'(a+b)⁵ = a⁵ + 5a⁴b + 10a³b² + 10a²b³ + 5ab⁴ + b⁵',6:'(a+b)⁶ = a⁶ + 6a⁵b + 15a⁴b² + 20a³b³ + 15a²b⁴ + 6ab⁵ + b⁶'};
function pascalPick(r){document.querySelectorAll('#pascalTri .prow').forEach(el=>el.classList.toggle('sel',+el.dataset.r===r));const out=document.getElementById('pascalOut');if(out)out.innerHTML='Row 第 '+r+' 行 → <b>'+PASCAL_EXP[r]+'</b>';}
const toc=document.getElementById('toc'),scrim=document.getElementById('scrim');
document.getElementById('menuBtn').onclick=()=>{toc.classList.add('open');scrim.classList.add('show');};
function closeMenu(){toc.classList.remove('open');scrim.classList.remove('show');}
scrim.onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'&&cur<S.length-1)go(cur+1);if(e.key==='ArrowLeft'&&cur>0)go(cur-1);});
render();updateProgress();
</script>
