<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Guangjian Maths · G · Circles 圆</title>
<style>
  :root{
    --bg:#F4F6FB;--surface:#FFFFFF;--ink:#1B1B2A;--muted:#6A6A82;--line:#E3E6F0;
    --indigo:#4A43C4;--indigo-deep:#2E2A6B;--indigo-soft:#EEF0FC;
    --amber:#C77A15;--amber-soft:#FCF2DF;--green:#1F8A5B;--green-soft:#E6F5EE;
    --rose:#C0453B;--rose-soft:#FBEDEC;--radius:14px;
    --shadow:0 1px 2px rgba(30,30,60,.05), 0 8px 24px rgba(30,30,60,.06);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;}
  header.top{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;}
  .top-row{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto;}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--indigo);font-weight:700;text-transform:uppercase;}
  .brand h1{margin:0;font-size:16px;font-weight:800;color:var(--indigo-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prog-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:170px;}
  .prog-label{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .prog-track{flex:1;height:8px;background:#DDE1EE;border-radius:99px;overflow:hidden;min-width:80px;}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--indigo),#7A73E6);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer;color:var(--indigo-deep);}
  .layout{display:grid;grid-template-columns:262px 1fr;gap:30px;max-width:1180px;margin:26px auto;padding:0 22px;align-items:start;}
  nav.toc{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);}
  .toc h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 8px 10px;font-weight:700;}
  .toc a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;}
  .toc a:hover{background:var(--indigo-soft);}
  .toc a.active{background:var(--indigo-soft);border-color:#D5D8F5;font-weight:700;color:var(--indigo-deep);}
  .toc .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--indigo);font-size:13px;width:22px;flex:none;}
  .toc a.active .n{color:var(--indigo-deep);}
  .toc .lbl{flex:1;min-width:0;}
  .toc .tick{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid #CBD0E4;display:grid;place-items:center;font-size:10px;color:#fff;}
  .toc a.done .tick{background:var(--green);border-color:var(--green);}
  .toc a.done .tick::after{content:"✓";}
  main{min-width:0;}
  section.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 34px 30px;animation:rise .4s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px;}
  .sec-num{font-size:34px;font-weight:800;color:var(--indigo);line-height:1;font-variant-numeric:tabular-nums;flex:none;padding-top:2px;}
  .sec-titles{flex:1;min-width:0;}
  .sec-titles h2{margin:0;font-size:22px;font-weight:800;color:var(--indigo-deep);}
  .sec-titles .zh-title{font-size:15px;color:var(--muted);font-weight:700;margin-top:2px;}
  .badge{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;}
  .badge.gk{background:var(--amber-soft);color:var(--amber);}
  .badge.core{background:var(--indigo-soft);color:var(--indigo);}
  .badge.hard,.badge.warn{background:var(--rose-soft);color:var(--rose);}
  .badge.Concept{background:var(--grey-soft,#EEF0F4);color:#4a4a5e;}
  .badge.Fluency{background:var(--green-soft);color:var(--green);}
  .badge.Applied{background:var(--amber-soft);color:var(--amber);}
  .badge.Elite{background:var(--rose-soft);color:var(--rose);}
  .blk{font-size:15px;color:var(--indigo-deep);margin:14px 0 6px;font-weight:800;}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  h3.blk{font-size:15px;font-weight:800;color:var(--indigo);margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  h3.blk::before{content:"";width:5px;height:16px;border-radius:3px;background:var(--indigo);display:inline-block;}
  p{margin:9px 0;}
  .content b{color:var(--indigo-deep);}
  .content ul,.content ol{margin:10px 0;padding-left:22px;}
  .content li{margin:6px 0;}
  .zh{color:#4a4a5e;font-size:14.5px;}
  .zh::before{content:"中  ";color:var(--green);font-weight:800;font-size:11px;letter-spacing:.05em;}
  .enh::before{content:"EN  ";color:var(--indigo);font-weight:800;font-size:11px;letter-spacing:.05em;}
  .terms{background:#F1F7F4;border:1px solid #CFE6DA;border-radius:10px;padding:11px 15px;margin:12px 0;font-size:14px;color:#14653f;line-height:1.9;}
  .terms b{color:#14653f;}
  .terms .t{white-space:nowrap;}
  .kbd-formula{display:block;background:var(--indigo-soft);border:1px solid #D9DCF6;border-radius:10px;padding:14px 18px;margin:14px 0;font-size:18px;text-align:center;color:var(--indigo-deep);font-weight:700;}
  .example{background:#FBFBFE;border:1px solid var(--line);border-left:4px solid var(--indigo);border-radius:12px;padding:16px 18px;margin:16px 0;}
  .ex-title{font-weight:800;color:var(--indigo-deep);font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ex-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--amber-soft);color:var(--amber);}
  .steps{margin:8px 0;}
  .step{position:relative;padding:5px 0 5px 20px;}
  .step::before{content:"";position:absolute;left:5px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--indigo);}
  .ex-ans{margin-top:10px;background:var(--green-soft);border-radius:8px;padding:8px 12px;font-weight:800;color:var(--green);}
  .note{background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14.5px;color:#7a5210;}
  .note.warn{background:var(--rose-soft);color:#8c2f28;}
  .note strong{color:inherit;}
  .practice{background:#FFFFFF;border:1.5px dashed #C9CEE6;border-radius:12px;padding:16px 18px;margin:18px 0;}
  .practice-head{font-weight:800;color:var(--indigo-deep);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .practice-head::before{content:"✎";color:var(--indigo);}
  .reveal{margin-top:10px;background:var(--indigo);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .reveal:hover{background:#3a34a8;}
  .answer{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .answer.open{max-height:1400px;margin-top:12px;}
  .answer-inner{background:var(--green-soft);border-radius:10px;padding:12px 16px;font-size:14.5px;}
  .answer-inner b{color:var(--green);}
  .pascal{display:flex;flex-direction:column;align-items:center;gap:9px;margin:18px 0 10px;}
  .prow{display:flex;gap:9px;cursor:pointer;padding:5px 9px;border-radius:12px;border:1.5px solid transparent;transition:background .15s,border-color .15s;}
  .prow:hover{background:var(--indigo-soft);}
  .prow.sel{background:var(--amber-soft);border-color:#EEDBB0;}
  .pcell{display:grid;place-items:center;min-width:40px;height:40px;padding:0 7px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;font-weight:800;color:var(--indigo-deep);font-variant-numeric:tabular-nums;}
  .prow.sel .pcell{border-color:var(--amber);color:var(--amber);}
  .pascal-out{text-align:center;background:var(--indigo-soft);border:1px solid #D9DCF6;border-radius:10px;padding:12px 16px;font-size:15px;color:var(--indigo-deep);margin:6px 0;min-height:22px;}
  .lore{background:#F2F3FC;border:1px solid #E0E3F5;border-left:4px solid #8983E0;border-radius:12px;padding:14px 18px;margin:16px 0;font-size:14.5px;color:#3b3b54;}
  .lore h5{margin:0 0 8px;color:var(--indigo-deep);font-size:14.5px;font-weight:800;}
  .check-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;}
  .check-item:last-child{border-bottom:none;}
  .check-box{width:20px;height:20px;border:2px solid #C4C9E0;border-radius:6px;flex:none;margin-top:3px;display:grid;place-items:center;color:#fff;font-size:13px;}
  .check-item.on .check-box{background:var(--green);border-color:var(--green);}
  .check-item.on .check-box::after{content:"✓";}
  .check-item.on .check-txt{color:var(--muted);text-decoration:line-through;}
  .parent{background:var(--indigo-soft);border-radius:12px;padding:16px 18px;margin-top:22px;}
  .parent h4{margin:0 0 6px;color:var(--indigo-deep);}
  .pager{display:flex;align-items:center;gap:12px;margin-top:26px;}
  .pager button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--indigo-deep);}
  .pager button:hover:not(:disabled){background:var(--indigo-soft);}
  .pager button:disabled{opacity:.4;cursor:not-allowed;}
  .pager .done-btn{flex:1.3;background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .pager .done-btn.is-done{background:var(--green);border-color:var(--green);}
  .scrim{display:none;}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;padding:0 16px;margin-top:16px;}
    .menu-btn{display:block;}
    nav.toc{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:50;border-radius:0 16px 16px 0;transform:translateX(-102%);transition:transform .28s ease;overflow-y:auto;padding-top:18px;}
    nav.toc.open{transform:none;}
    .scrim.show{display:block;position:fixed;inset:0;background:rgba(20,20,40,.4);z-index:40;}
    .brand h1{font-size:14px;white-space:normal;}.prog-wrap{min-width:110px;}
    section.card{padding:24px 20px;}.sec-num{font-size:28px;}.sec-titles h2{font-size:19px;}
    .pager{flex-wrap:wrap;}.pager .done-btn{order:-1;flex-basis:100%;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
  :focus-visible{outline:3px solid #A9A4F0;outline-offset:2px;border-radius:6px;}

.dltools{position:fixed;top:12px;right:14px;z-index:70;display:flex;gap:8px}
.dltools button{border:none;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;box-shadow:0 4px 12px rgba(30,30,60,.18)}
.dltools .b-md{background:#1F8A5B}.dltools .b-pdf{background:#4A43C4}
@media(max-width:860px){.dltools{top:auto;bottom:14px;right:12px}}
@media print{.top,nav.toc,.pager,.scrim,.dltools,.menu-btn,.prog-wrap,.hero,.sumbar,.back,.reset{display:none!important}
 .layout{display:block!important;margin:0!important;padding:0!important;grid-template-columns:1fr!important}
 main,.wrap{max-width:100%!important;margin:0!important}
 section.card{box-shadow:none!important;border:none!important;padding:0!important;animation:none!important}
 .answer{max-height:none!important;overflow:visible!important}
 .psec{page-break-after:always}}
</style>

<script>
const S = [{"key": "intro", "nav": "Intro 导读", "num": "", "track": false, "title": "Circles — where geometry gets its hardest problems", "zh": "圆——几何压轴的主场", "body": "\n <p class=\"enh\">Circles appear in the Guangjian papers about four times, but almost always as <b>hard, combined</b> problems (tangent + chord + similarity + Pythagoras). Master the basic facts first, then the combinations become routine.</p>\n <p class=\"zh\">圆在光剑约考四次，但几乎都是<b>压轴综合</b>（切线+弦+相似+勾股）。先把基本结论背熟，综合题就有套路了。</p>\n <div class=\"note\"><b>先要会 needs：</b>triangles 三角形、Pythagoras 勾股、similarity 相似。<b>解锁 unlocks：</b>circle synthesis 圆综合、tangent problems 切线题。</div>\n <p class=\"zh\">难度：<b>Concept</b> · <b>Fluency</b> · <b>Applied</b> · <b>Elite</b>，按真实例题定。</p>"}, {"key": "parts", "nav": "Parts 基本量", "num": "01", "track": true, "tier": "Concept", "title": "Parts of a circle", "zh": "圆的基本量", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">radius 半径</span> · <span class=\"t\">diameter 直径</span> · <span class=\"t\">chord 弦</span> · <span class=\"t\">arc 弧</span> · <span class=\"t\">sector 扇形</span> · <span class=\"t\">tangent 切线</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">Know the names precisely — the English paper uses them everywhere. A <b>chord</b> joins two points on the circle; a <b>tangent</b> touches at one point; a <b>sector</b> is a \"pie slice\".</p>\n <p class=\"zh\">这些名字要背准，英文卷全靠它读题。<b>弦</b>连圆上两点、<b>直径</b>是过圆心的弦、<b>切线</b>只碰一个点、<b>扇形</b>是\"披萨块\"。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 235\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<path d=\"M150,115 L232,115 A82,82 0 0 0 197,48 Z\" fill=\"#EEF0FC\"/>\n<circle cx=\"150\" cy=\"115\" r=\"82\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"1.8\"/>\n<line x1=\"150\" y1=\"115\" x2=\"232\" y2=\"115\" stroke=\"#C77A15\" stroke-width=\"1.6\"/>\n<line x1=\"68\" y1=\"115\" x2=\"232\" y2=\"115\" stroke=\"#6A6A82\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\"/>\n<line x1=\"197\" y1=\"48\" x2=\"213\" y2=\"168\" stroke=\"#1F8A5B\" stroke-width=\"1.6\"/>\n<line x1=\"30\" y1=\"197\" x2=\"270\" y2=\"197\" stroke=\"#C0453B\" stroke-width=\"1.4\"/>\n<circle cx=\"150\" cy=\"115\" r=\"2.5\" fill=\"#1B1B2A\"/>\n<text x=\"142\" y=\"119\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">O</text>\n<text x=\"191\" y=\"111\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#C77A15\">radius 半径</text>\n<text x=\"150\" y=\"126\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#6A6A82\">diameter 直径</text>\n<text x=\"213\" y=\"46\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#1F8A5B\">chord 弦</text>\n<text x=\"190\" y=\"150\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#4A43C4\">sector 扇形</text>\n<text x=\"150\" y=\"211\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#C0453B\">tangent 切线</text></svg></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习 · 术语</div>\n   <ol><li>Which is longer: a radius or a diameter, and by what factor?</li>\n   <li>What do you call a straight line that touches the circle at exactly one point?</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) diameter 直径 = 2 × radius 半径　2) a <b>tangent 切线</b></div></div></div>"}, {"key": "angles", "nav": "Angles 圆周角", "num": "02", "track": true, "tier": "Applied", "badge": "gk", "title": "Central & inscribed angles", "zh": "圆心角与圆周角", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">central angle 圆心角</span> · <span class=\"t\">inscribed angle 圆周角</span> · <span class=\"t\">same arc 同弧</span> · <span class=\"t\">semicircle 半圆</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">On the <b>same arc</b>: the central angle is <b>twice</b> any inscribed angle. Two inscribed angles on the same arc are equal. An angle in a <b>semicircle</b> (on a diameter) is 90°.</p>\n <p class=\"zh\">同弧所对：<b>圆心角 = 2 × 圆周角</b>；同弧的圆周角都相等；<b>直径所对的圆周角 = 90°</b>（半圆定理，超好用）。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 280 230\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<circle cx=\"140\" cy=\"125\" r=\"88\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"1.8\"/>\n<line x1=\"140\" y1=\"125\" x2=\"60\" y2=\"162\" stroke=\"#C77A15\" stroke-width=\"1.6\"/>\n<line x1=\"140\" y1=\"125\" x2=\"220\" y2=\"162\" stroke=\"#C77A15\" stroke-width=\"1.6\"/>\n<line x1=\"155\" y1=\"38\" x2=\"60\" y2=\"162\" stroke=\"#1F8A5B\" stroke-width=\"1.5\"/>\n<line x1=\"155\" y1=\"38\" x2=\"220\" y2=\"162\" stroke=\"#1F8A5B\" stroke-width=\"1.5\"/>\n<circle cx=\"140\" cy=\"125\" r=\"2.4\" fill=\"#1B1B2A\"/>\n<text x=\"134\" y=\"119\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">O</text><text x=\"54\" y=\"166\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">A</text><text x=\"226\" y=\"166\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">B</text><text x=\"155\" y=\"32\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">C</text>\n<text x=\"140\" y=\"147\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" fill=\"#C77A15\">圆心角 = 2×圆周角</text>\n<text x=\"157\" y=\"54\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#1F8A5B\">∠ACB 圆周角</text></svg></div>\n <span class=\"kbd-formula\">central 圆心角 = 2 × inscribed 圆周角　·　angle in semicircle 直径所对 = 90°</span>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">An inscribed angle ∠ACB = 35° subtends arc AB. Find the central angle ∠AOB.</div>\n   <div class=\"step\">∠AOB = 2 × 35°.</div></div>\n   <div class=\"ex-ans\">∠AOB = <b>70°</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Central angle ∠AOB = 96°. Find the inscribed angle on the same arc.</li>\n   <li>AB is a diameter, C is on the circle. Find ∠ACB.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>48°</b>（圆周角=½圆心角）　2) <b>90°</b>（直径所对）</div></div></div>"}, {"key": "perp", "nav": "Perp chord 垂径", "num": "03", "track": true, "tier": "Applied", "title": "Perpendicular from centre to a chord", "zh": "垂径定理", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">perpendicular 垂直</span> · <span class=\"t\">bisect 平分</span> · <span class=\"t\">chord 弦</span> · <span class=\"t\">Pythagoras 勾股</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">The perpendicular from the centre to a chord <b>bisects</b> it. This gives a right triangle: (distance)² + (½ chord)² = r². Almost every chord length problem uses this.</p>\n <p class=\"zh\">从圆心向弦作垂线，一定<b>平分</b>这条弦。于是得到直角三角形：弦心距² + (半弦)² = r²。几乎所有求弦长的题都靠它。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 280 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<circle cx=\"140\" cy=\"80\" r=\"90\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"1.8\"/>\n<line x1=\"66\" y1=\"132\" x2=\"214\" y2=\"132\" stroke=\"#1F8A5B\" stroke-width=\"1.6\"/>\n<line x1=\"140\" y1=\"80\" x2=\"140\" y2=\"132\" stroke=\"#C77A15\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n<line x1=\"140\" y1=\"80\" x2=\"66\" y2=\"132\" stroke=\"#6A6A82\" stroke-width=\"1.2\"/>\n<rect x=\"134\" y=\"126\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"#C77A15\" stroke-width=\"0.9\"/>\n<circle cx=\"140\" cy=\"80\" r=\"2.4\" fill=\"#1B1B2A\"/>\n<text x=\"140\" y=\"74\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">O</text><text x=\"60\" y=\"136\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">A</text><text x=\"220\" y=\"136\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">B</text><text x=\"146\" y=\"146\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">M</text>\n<text x=\"134\" y=\"106\" text-anchor=\"end\" font-size=\"10\" font-weight=\"700\" fill=\"#C77A15\">d</text>\n<text x=\"97\" y=\"106\" text-anchor=\"end\" font-size=\"10\" font-weight=\"700\" fill=\"#6A6A82\">r</text>\n<text x=\"140\" y=\"205\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" fill=\"#4a4a5e\">OM⊥AB ⇒ AM=MB；d²+(½弦)²=r²</text></svg></div>\n <span class=\"kbd-formula\">d² + (<span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">chord</span><span style=\"padding:0 3px\">2</span></span>)² = r²</span>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">A circle of radius 5 has a chord of length 8. Find the distance from the centre to the chord.</div>\n   <div class=\"step\">Half-chord = 4. d = √(5² − 4²) = √9.</div></div>\n   <div class=\"ex-ans\">d = <b>3</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Radius 13, chord 24. Find the distance from the centre to the chord.</li>\n   <li>Radius 10, chord is 6 from the centre. Find the chord length.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>5</b>（√(13²−12²)）　2) <b>16</b>（半弦=√(10²−6²)=8, 弦=16）</div></div></div>"}, {"key": "arc", "nav": "Arc & sector 弧长扇形", "num": "04", "track": true, "tier": "Fluency", "title": "Arc length & sector area", "zh": "弧长与扇形面积", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">arc length 弧长</span> · <span class=\"t\">sector area 扇形面积</span> · <span class=\"t\">angle at centre θ 圆心角</span> · <span class=\"t\">circumference 周长</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">A sector is a fraction <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">θ</span><span style=\"padding:0 3px\">360</span></span> of the whole circle. So the arc is that fraction of the circumference, and the sector area that fraction of πr².</p>\n <p class=\"zh\">扇形是整个圆的 <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">θ</span><span style=\"padding:0 3px\">360</span></span>。所以弧长是周长的这个比例、扇形面积是 πr² 的这个比例。</p>\n <span class=\"kbd-formula\">arc 弧长 = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">θ</span><span style=\"padding:0 3px\">360</span></span> × 2πr　·　sector 扇形 = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">θ</span><span style=\"padding:0 3px\">360</span></span> × πr²</span>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">Radius 6, central angle 60°. Find the arc length and sector area (leave π).</div>\n   <div class=\"step\">arc = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">60</span><span style=\"padding:0 3px\">360</span></span> × 2π×6 = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">6</span></span> × 12π = 2π.</div>\n   <div class=\"step\">sector = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">60</span><span style=\"padding:0 3px\">360</span></span> × π×36 = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">6</span></span> × 36π = 6π.</div></div>\n   <div class=\"ex-ans\">arc = <b>2π</b>, sector = <b>6π</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Radius 10, angle 90°. Find the arc length and sector area.</li>\n   <li>Radius 4, angle 45°. Find the sector area.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) arc <b>5π</b>, sector <b>25π</b>（¼圆）　2) <b>2π</b>（⅛·16π）</div></div></div>"}, {"key": "tangent", "nav": "Tangent 切线", "num": "05", "track": true, "tier": "Applied", "title": "Tangents", "zh": "切线", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">tangent 切线</span> · <span class=\"t\">point of contact 切点</span> · <span class=\"t\">external point 外点</span> · <span class=\"t\">perpendicular 垂直</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">A tangent is <b>perpendicular to the radius</b> at the point of contact. From an <b>external point</b>, the two tangents to a circle are <b>equal in length</b> (and the radius–tangent right angle gives Pythagoras).</p>\n <p class=\"zh\">切线在切点处<b>垂直于半径</b>。从<b>圆外一点</b>引的两条切线<b>长度相等</b>；切线⊥半径正好配勾股用。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 215\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"1.8\"/>\n<line x1=\"110\" y1=\"110\" x2=\"121\" y2=\"39\" stroke=\"#C77A15\" stroke-width=\"1.4\"/>\n<line x1=\"255\" y1=\"60\" x2=\"121\" y2=\"39\" stroke=\"#C0453B\" stroke-width=\"1.6\"/>\n<line x1=\"255\" y1=\"60\" x2=\"163\" y2=\"159\" stroke=\"#C0453B\" stroke-width=\"1.6\"/>\n<circle cx=\"110\" cy=\"110\" r=\"2.4\" fill=\"#1B1B2A\"/><circle cx=\"255\" cy=\"60\" r=\"2.6\" fill=\"#C0453B\"/>\n<text x=\"104\" y=\"114\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">O</text><text x=\"261\" y=\"64\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">P</text>\n<text x=\"140\" y=\"200\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" fill=\"#4a4a5e\">切线⊥半径；从P引两切线 PT₁=PT₂</text></svg></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">P is 13 from the centre O of a circle of radius 5. PT is a tangent. Find PT.</div>\n   <div class=\"step\">OT ⊥ PT ⇒ PT = √(OP² − r²) = √(13² − 5²) = √144.</div></div>\n   <div class=\"ex-ans\">PT = <b>12</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>OP = 10, radius 6. Find the tangent length PT.</li>\n   <li>From P, two tangents touch at A and B; PA = 7. Find PB.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>8</b>（√(10²−6²)）　2) <b>7</b>（两切线相等）</div></div></div>"}, {"key": "cyclic", "nav": "Cyclic quad 内接四边形", "num": "06", "track": true, "tier": "Applied", "title": "Cyclic quadrilaterals", "zh": "圆内接四边形", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">cyclic quadrilateral 圆内接四边形</span> · <span class=\"t\">opposite angles 对角</span> · <span class=\"t\">supplementary 互补</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">If all four vertices lie on a circle, the <b>opposite angles add to 180°</b>. This one fact solves most cyclic-quadrilateral angle problems.</p>\n <p class=\"zh\">四个顶点都在圆上时，<b>对角互补（和为 180°）</b>。圆内接四边形的角度题，基本靠这一句。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 260 230\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<circle cx=\"130\" cy=\"115\" r=\"92\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"1.8\"/>\n<polygon points=\"84,35 205,62 183,190 47,154\" fill=\"#FCF2DF\" stroke=\"#C77A15\" stroke-width=\"1.6\"/>\n<text x=\"80\" y=\"29\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">A</text><text x=\"211\" y=\"62\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">B</text><text x=\"187\" y=\"204\" text-anchor=\"start\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">C</text><text x=\"41\" y=\"160\" text-anchor=\"end\" font-size=\"11\" font-weight=\"700\" fill=\"#1B1B2A\">D</text>\n<text x=\"130\" y=\"222\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" fill=\"#C77A15\">圆内接四边形：∠A+∠C=180°，∠B+∠D=180°</text></svg></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">ABCD is cyclic with ∠A = 85°. Find ∠C.</div>\n   <div class=\"step\">∠A + ∠C = 180° ⇒ ∠C = 180 − 85.</div></div>\n   <div class=\"ex-ans\">∠C = <b>95°</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Cyclic ABCD, ∠B = 110°. Find ∠D.</li>\n   <li>Cyclic ABCD, ∠A = 2∠C. Find ∠A.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>70°</b>　2) <b>120°</b>（A+C=180, A=2C ⇒ 3C=180, C=60, A=120）</div></div></div>"}, {"key": "elite", "nav": "Elite 圆综合", "num": "07", "track": true, "tier": "Elite", "badge": "hard", "title": "Exam-level: circle synthesis", "zh": "压轴 · 圆综合", "body": "\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">Hard circle problems combine <b>tangent ⊥ radius</b>, <b>perpendicular-chord</b>, <b>similar triangles</b> and <b>Pythagoras</b>. Spot the right triangle, then it's just algebra.</p>\n <p class=\"zh\">圆的压轴 = <b>切线⊥半径</b> + <b>垂径</b> + <b>相似</b> + <b>勾股</b> 的组合。先找出那个直角三角形，剩下就是算。下面是改编同型题。</p>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · inscribed equilateral △ 内接等边　【同型·光剑春招】</div>\n   <div class=\"steps\"><div class=\"step\">An equilateral triangle is inscribed in a circle of radius 6. Find its side length.</div>\n   <div class=\"step\">Centre to a side = ½r = 3; half-side = √(6² − 3²) = √27 = 3√3.</div></div>\n   <div class=\"ex-ans\">side = <b>6√3</b></div></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · circle inscribed in a square 正方形内切圆　【同型·光剑】</div>\n   <div class=\"steps\"><div class=\"step\">A circle is inscribed in a square of side 10 (touching all four sides). Find the circle's radius and area.</div>\n   <div class=\"step\">Radius = half the side = 5. Area = π·5² = 25π.</div></div>\n   <div class=\"ex-ans\">r = <b>5</b>, area = <b>25π</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习（纯题·先做再看）</div>\n   <ol><li>Radius 10, chord 12. Find the distance from the centre to the chord.　【同型】</li>\n   <li>Tangent PT = 8, radius 6. Find OP.</li>\n   <li>Cyclic ABCD; ∠A = 70°, ∠B = 95°. Find ∠C and ∠D.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>8</b>（√(10²−6²)）　2) <b>10</b>（√(8²+6²)）　3) <b>∠C=110°, ∠D=85°</b>（对角互补）</div></div></div>"}, {"key": "end", "nav": "Summary 小结", "num": "", "track": false, "title": "Summary & where this leads", "zh": "小结与它通向哪里", "body": "\n <div class=\"terms\" style=\"background:#EEF0FC;border-color:#D9DCF6;color:#2E2A6B\"><b>One-line 一句话：</b>Central = 2×inscribed; diameter ⇒ 90°; perpendicular bisects a chord (d²+(½chord)²=r²); tangent ⊥ radius &amp; two tangents equal; cyclic opposite angles = 180°. 圆心角=2圆周角、直径对90°、垂径配勾股、切线⊥半径且两切线相等、内接四边形对角互补。</div>\n <h3 class=\"blk\">This unlocks 它解锁了</h3>\n <p class=\"zh\">圆往下通向：<b>圆综合压轴</b>（切线+垂径+相似+勾股）、<b>坐标几何</b>里的圆。在总逻辑图点「圆」能看到这些。</p>\n <div class=\"check-list\">\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">分清半径/直径/弦/弧/扇形/切线（中英）</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">圆心角=2×圆周角、直径所对=90°</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">垂径定理配勾股求弦长/弦心距</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">弧长=θ/360·2πr、扇形=θ/360·πr²</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">切线⊥半径、两切线相等、内接四边形对角互补</div></div>\n </div>\n <div class=\"parent\"><h4>给家长的话</h4><p style=\"margin:0;font-size:14px;color:#4a4a5e\">圆是光剑压轴的主场，难点在\"综合\"。这份把基本结论一条条讲清，最后教怎么把切线/垂径/相似/勾股拼起来。她若卡住，多半是没找到那个\"直角三角形\"——提醒她先连半径、作垂线。</p></div>"}];
const tocList=document.getElementById('tocList'),content=document.getElementById('content'),progFill=document.getElementById('progFill'),progLabel=document.getElementById('progLabel'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),doneBtn=document.getElementById('doneBtn');
let cur=0;const done=new Set();const trackedTotal=S.filter(s=>s.track).length;
S.forEach((s,i)=>{const a=document.createElement('a');a.dataset.i=i;a.innerHTML=`<span class="n">${s.num||'·'}</span><span class="lbl">${s.nav}</span><span class="tick"></span>`;a.onclick=()=>go(i);tocList.appendChild(a);});
const tocLinks=[...tocList.children];
function render(){
  const s=S[cur];
  const tierHtml = s.tier?`<span class="badge ${s.tier}">${s.tier}</span>`:'';const gkHtml = s.badge==='gk'?'<span class="badge gk">★ Often tested 常考</span>':s.badge==='hard'?'<span class="badge hard">★ Harder 难题</span>':s.badge==='core'?'<span class="badge core">★ Must-know 必背</span>':'';const badgeHtml = tierHtml+gkHtml;
  const zt = s.zh?`<div class="zh-title">${s.zh}</div>`:'';
  content.innerHTML=`<div class="sec-head">${s.num?`<div class="sec-num">${s.num}</div>`:''}<div class="sec-titles"><h2>${s.title}</h2>${zt}${badgeHtml}</div></div><div class="divider"></div>${s.body}`;
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
  prevBtn.disabled=cur===0;nextBtn.disabled=cur===S.length-1;
  if(s.track){doneBtn.style.display='';const d=done.has(cur);doneBtn.textContent=d?'Done 已学完 ✓':'Done 学完了 ✓';doneBtn.classList.toggle('is-done',d);}else{doneBtn.style.display='none';}
  content.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});
}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));render();closeMenu();}
prevBtn.onclick=()=>go(cur-1);nextBtn.onclick=()=>go(cur+1);
doneBtn.onclick=()=>{if(!S[cur].track)return;if(done.has(cur))done.delete(cur);else done.add(cur);updateProgress();render();if(done.has(cur)&&cur<S.length-1)setTimeout(()=>go(cur+1),260);};
function updateProgress(){const n=[...done].filter(i=>S[i].track).length;progFill.style.width=(n/trackedTotal*100)+'%';progLabel.textContent=`${n} / ${trackedTotal}`;tocLinks.forEach((a,i)=>a.classList.toggle('done',done.has(i)&&S[i].track));}
function ans(btn){const box=btn.nextElementSibling;const open=box.classList.toggle('open');btn.textContent=open?btn.textContent.replace('Show','Hide').replace('显示','隐藏'):btn.textContent.replace('Hide','Show').replace('隐藏','显示');}
function tick(el){el.classList.toggle('on');}
const PASCAL_EXP={0:'(a+b)⁰ = 1',1:'(a+b)¹ = a + b',2:'(a+b)² = a² + 2ab + b²',3:'(a+b)³ = a³ + 3a²b + 3ab² + b³',4:'(a+b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴',5:'(a+b)⁵ = a⁵ + 5a⁴b + 10a³b² + 10a²b³ + 5ab⁴ + b⁵',6:'(a+b)⁶ = a⁶ + 6a⁵b + 15a⁴b² + 20a³b³ + 15a²b⁴ + 6ab⁵ + b⁶'};
function pascalPick(r){document.querySelectorAll('#pascalTri .prow').forEach(el=>el.classList.toggle('sel',+el.dataset.r===r));const out=document.getElementById('pascalOut');if(out)out.innerHTML='Row 第 '+r+' 行 → <b>'+PASCAL_EXP[r]+'</b>';}
const toc=document.getElementById('toc'),scrim=document.getElementById('scrim');
document.getElementById('menuBtn').onclick=()=>{toc.classList.add('open');scrim.classList.add('show');};
function closeMenu(){toc.classList.remove('open');scrim.classList.remove('show');}
scrim.onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'&&cur<S.length-1)go(cur+1);if(e.key==='ArrowLeft'&&cur>0)go(cur-1);});
render();updateProgress();
</script>
