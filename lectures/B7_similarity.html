<!DOCTYPE html>

<head>

<style>
  :root{
    --bg:#F4F6FB;--surface:#FFFFFF;--ink:#1B1B2A;--muted:#6A6A82;--line:#E3E6F0;

  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;}
  header.top{position:sticky;top:0;z-index:30;background:rgba(244,246,251,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 22px;}
  .top-row{display:flex;align-items:center;gap:14px;max-width:1180px;margin:0 auto;}
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--indigo);font-weight:700;text-transform:uppercase;}
  .brand h1{margin:0;font-size:16px;font-weight:800;color:var(--indigo-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prog-wrap{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:170px;}
  .prog-label{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .prog-track{flex:1;height:8px;background:#DDE1EE;border-radius:99px;overflow:hidden;min-width:80px;}
  .prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--indigo),#7A73E6);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer;color:var(--indigo-deep);}
  .layout{display:grid;grid-template-columns:262px 1fr;gap:30px;max-width:1180px;margin:26px auto;padding:0 22px;align-items:start;}
  nav.toc{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);}
  .toc h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 8px 10px;font-weight:700;}
  .toc a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;}
  .toc a:hover{background:var(--indigo-soft);}
  .toc a.active{background:var(--indigo-soft);border-color:#D5D8F5;font-weight:700;color:var(--indigo-deep);}
  .toc .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--indigo);font-size:13px;width:22px;flex:none;}
  .toc a.active .n{color:var(--indigo-deep);}
  .toc .lbl{flex:1;min-width:0;}
  .toc .tick{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid #CBD0E4;display:grid;place-items:center;font-size:10px;color:#fff;}
  .toc a.done .tick{background:var(--green);border-color:var(--green);}
  .toc a.done .tick::after{content:"✓";}
  main{min-width:0;}
  section.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 34px 30px;animation:rise .4s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px;}
  .sec-num{font-size:34px;font-weight:800;color:var(--indigo);line-height:1;font-variant-numeric:tabular-nums;flex:none;padding-top:2px;}
  .sec-titles{flex:1;min-width:0;}
  .sec-titles h2{margin:0;font-size:22px;font-weight:800;color:var(--indigo-deep);}
  .sec-titles .zh-title{font-size:15px;color:var(--muted);font-weight:700;margin-top:2px;}
  .badge{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;}
  .badge.gk{background:var(--amber-soft);color:var(--amber);}
  .badge.core{background:var(--indigo-soft);color:var(--indigo);}
  .badge.hard,.badge.warn{background:var(--rose-soft);color:var(--rose);}
  .badge.Concept{background:var(--grey-soft,#EEF0F4);color:#4a4a5e;}
  .badge.Fluency{background:var(--green-soft);color:var(--green);}
  .badge.Applied{background:var(--amber-soft);color:var(--amber);}
  .badge.Elite{background:var(--rose-soft);color:var(--rose);}
  .blk{font-size:15px;color:var(--indigo-deep);margin:14px 0 6px;font-weight:800;}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  h3.blk{font-size:15px;font-weight:800;color:var(--indigo);margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  h3.blk::before{content:"";width:5px;height:16px;border-radius:3px;background:var(--indigo);display:inline-block;}
  p{margin:9px 0;}
  .content b{color:var(--indigo-deep);}
  .content ul,.content ol{margin:10px 0;padding-left:22px;}
  .content li{margin:6px 0;}
  .zh{color:#4a4a5e;font-size:14.5px;}
  .zh::before{content:"中  ";color:var(--green);font-weight:800;font-size:11px;letter-spacing:.05em;}
  .enh::before{content:"EN  ";color:var(--indigo);font-weight:800;font-size:11px;letter-spacing:.05em;}
  .terms{background:#F1F7F4;border:1px solid #CFE6DA;border-radius:10px;padding:11px 15px;margin:12px 0;font-size:14px;color:#14653f;line-height:1.9;}
  .terms b{color:#14653f;}
  .terms .t{white-space:nowrap;}
  .kbd-formula{display:block;background:var(--indigo-soft);border:1px solid #D9DCF6;border-radius:10px;padding:14px 18px;margin:14px 0;font-size:18px;text-align:center;color:var(--indigo-deep);font-weight:700;}
  .example{background:#FBFBFE;border:1px solid var(--line);border-left:4px solid var(--indigo);border-radius:12px;padding:16px 18px;margin:16px 0;}
  .ex-title{font-weight:800;color:var(--indigo-deep);font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ex-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--amber-soft);color:var(--amber);}
  .steps{margin:8px 0;}
  .step{position:relative;padding:5px 0 5px 20px;}
  .step::before{content:"";position:absolute;left:5px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--indigo);}
  .ex-ans{margin-top:10px;background:var(--green-soft);border-radius:8px;padding:8px 12px;font-weight:800;color:var(--green);}
  .note{background:var(--amber-soft);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:14.5px;color:#7a5210;}
  .note.warn{background:var(--rose-soft);color:#8c2f28;}
  .note strong{color:inherit;}
  .practice{background:#FFFFFF;border:1.5px dashed #C9CEE6;border-radius:12px;padding:16px 18px;margin:18px 0;}
  .practice-head{font-weight:800;color:var(--indigo-deep);margin-bottom:6px;display:flex;align-items:center;gap:8px;}

  .answer.open{max-height:1400px;margin-top:12px;}
  .answer-inner{background:var(--green-soft);border-radius:10px;padding:12px 16px;font-size:14.5px;}
  .answer-inner b{color:var(--green);}
  .pascal{display:flex;flex-direction:column;align-items:center;gap:9px;margin:18px 0 10px;}
  .prow{display:flex;gap:9px;cursor:pointer;padding:5px 9px;border-radius:12px;border:1.5px solid transparent;transition:background .15s,border-color .15s;}
  .prow:hover{background:var(--indigo-soft);}
  .prow.sel{background:var(--amber-soft);border-color:#EEDBB0;}
  .pcell{display:grid;place-items:center;min-width:40px;height:40px;padding:0 7px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;font-weight:800;color:var(--indigo-deep);font-variant-numeric:tabular-nums;}
  .prow.sel .pcell{border-color:var(--amber);color:var(--amber);}
  .pascal-out{text-align:center;background:var(--indigo-soft);border:1px solid #D9DCF6;border-radius:10px;padding:12px 16px;font-size:15px;color:var(--indigo-deep);margin:6px 0;min-height:22px;}
  .lore{background:#F2F3FC;border:1px solid #E0E3F5;border-left:4px solid #8983E0;border-radius:12px;padding:14px 18px;margin:16px 0;font-size:14.5px;color:#3b3b54;}
  .lore h5{margin:0 0 8px;color:var(--indigo-deep);font-size:14.5px;font-weight:800;}
  .check-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;}
  .check-item:last-child{border-bottom:none;}
  .check-box{width:20px;height:20px;border:2px solid #C4C9E0;border-radius:6px;flex:none;margin-top:3px;display:grid;place-items:center;color:#fff;font-size:13px;}
  .check-item.on .check-box{background:var(--green);border-color:var(--green);}
  .check-item.on .check-box::after{content:"✓";}
  .check-item.on .check-txt{color:var(--muted);text-decoration:line-through;}
  .parent{background:var(--indigo-soft);border-radius:12px;padding:16px 18px;margin-top:22px;}
  .parent h4{margin:0 0 6px;color:var(--indigo-deep);}
  .pager{display:flex;align-items:center;gap:12px;margin-top:26px;}
  .pager button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--indigo-deep);}
  .pager button:hover:not(:disabled){background:var(--indigo-soft);}
  .pager button:disabled{opacity:.4;cursor:not-allowed;}
  .pager .done-btn{flex:1.3;background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .pager .done-btn.is-done{background:var(--green);border-color:var(--green);}
  .scrim{display:none;}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;padding:0 16px;margin-top:16px;}
    .menu-btn{display:block;}
    nav.toc{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:50;border-radius:0 16px 16px 0;transform:translateX(-102%);transition:transform .28s ease;overflow-y:auto;padding-top:18px;}
    nav.toc.open{transform:none;}
    .scrim.show{display:block;position:fixed;inset:0;background:rgba(20,20,40,.4);z-index:40;}
    .brand h1{font-size:14px;white-space:normal;}.prog-wrap{min-width:110px;}
    section.card{padding:24px 20px;}.sec-num{font-size:28px;}.sec-titles h2{font-size:19px;}
    .pager{flex-wrap:wrap;}.pager .done-btn{order:-1;flex-basis:100%;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
  :focus-visible{outline:3px solid #A9A4F0;outline-offset:2px;border-radius:6px;}

.dltools{position:fixed;top:12px;right:14px;z-index:70;display:flex;gap:8px}
.dltools button{border:none;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;box-shadow:0 4px 12px rgba(30,30,60,.18)}
.dltools .b-md{background:#1F8A5B}.dltools .b-pdf{background:#4A43C4}
@media(max-width:860px){.dltools{top:auto;bottom:14px;right:12px}}
@media print{.top,nav.toc,.pager,.scrim,.dltools,.menu-btn,.prog-wrap,.hero,.sumbar,.back,.reset{display:none!important}
 .layout{display:block!important;margin:0!important;padding:0!important;grid-template-columns:1fr!important}
 main,.wrap{max-width:100%!important;margin:0!important}
 section.card{box-shadow:none!important;border:none!important;padding:0!important;animation:none!important}
 .answer{max-height:none!important;overflow:visible!important}
 .psec{page-break-after:always}}
</style>

<script>
const S = [{"key": "intro", "nav": "Intro 导读", "num": "", "track": false, "title": "Similarity — the biggest hub in geometry", "zh": "相似——几何里最关键的枢纽", "body": "\n <p class=\"enh\">In the Guangjian papers, <b>similarity is the single most-tested idea</b> (it shows up about ten times across the papers we scanned). It is the \"hub\" that unlocks area problems, circle problems and coordinate-geometry problems.</p>\n <p class=\"zh\">在光剑卷里，<b>相似是出现最多的一个考点</b>（我们扫过的卷子里大约考了十次）。它是\"枢纽\"——学会它，才能解锁面积法、圆的综合题、坐标几何求值这些压轴。</p>\n <div class=\"note\"><b>What you need first 先要会：</b>triangles &amp; angles 三角形与角、ratio 比例。<b>What this unlocks 学完解锁：</b>area method 面积法、circle synthesis 圆综合、coordinate geometry 坐标几何。</div>\n <p class=\"zh\">难度标签：<b>Concept</b> 概念 · <b>Fluency</b> 熟练 · <b>Applied</b> 综合 · <b>Elite</b> 压轴。每一节的难度都按真实例题定。</p>"}, {"key": "ratio", "nav": "Ratio 比例", "num": "01", "track": true, "tier": "Fluency", "title": "Ratio & proportion", "zh": "比例与比例线段", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">ratio 比</span> · <span class=\"t\">proportion 比例(相等的两个比)</span> · <span class=\"t\">cross-multiply 交叉相乘</span> · <span class=\"t\">proportional segments 成比例线段</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">A <b>ratio</b> a : b compares two lengths. A <b>proportion</b> says two ratios are equal: <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">a</span><span style=\"padding:0 3px\">b</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">c</span><span style=\"padding:0 3px\">d</span></span>. Then you may <b>cross-multiply</b>: a·d = b·c.</p>\n <p class=\"zh\">比 a : b 比较两条长度；比例是\"两个比相等\"：<span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">a</span><span style=\"padding:0 3px\">b</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">c</span><span style=\"padding:0 3px\">d</span></span>，可<b>交叉相乘</b>得 a·d = b·c。这是相似一切计算的底层工具。</p>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · chaining ratios 连比</div>\n   <div class=\"steps\"><div class=\"step\">Given a : b = 3 : 4 and b : c = 2 : 5. Find a : c.　已知 a:b=3:4、b:c=2:5，求 a:c。</div>\n   <div class=\"step\">Make b the same: a:b = 3:4, and b:c = 2:5 = 4:10.　把 b 统一为 4：b:c 乘 2 得 4:10。</div>\n   <div class=\"step\">So a : b : c = 3 : 4 : 10.</div></div>\n   <div class=\"ex-ans\">a : c = <b>3 : 10</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>If x : y = 5 : 3 and y : z = 6 : 7, find x : z.　求 x:z。</li>\n   <li>Given <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">a</span><span style=\"padding:0 3px\">b</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">3</span><span style=\"padding:0 3px\">7</span></span>, find <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">a+b</span><span style=\"padding:0 3px\">b</span></span>.　求 (a+b)/b。</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>x : z = 10 : 7</b>（y 统一为 6：x:y=10:6）　2) <b><span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">10</span><span style=\"padding:0 3px\">7</span></span></b>（a=3, b=7 → (3+7)/7）</div></div></div>"}, {"key": "parallel", "nav": "Parallel lines 平行线成比例", "num": "02", "track": true, "tier": "Fluency", "title": "Parallel lines cut sides proportionally", "zh": "平行线分线段成比例", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">parallel 平行</span> · <span class=\"t\">divide proportionally 按比例分</span> · <span class=\"t\">DE ∥ BC DE平行BC</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">If a line is <b>parallel</b> to one side of a triangle, it cuts the other two sides in the <b>same ratio</b>. If DE ∥ BC then <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">AD</span><span style=\"padding:0 3px\">DB</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">AE</span><span style=\"padding:0 3px\">EC</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">AD</span><span style=\"padding:0 3px\">AB</span></span> · (ratios match).</p>\n <p class=\"zh\">一条线若平行于三角形一边，就把另外两边分成<b>相同的比</b>。DE ∥ BC ⇒ <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">AD</span><span style=\"padding:0 3px\">DB</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">AE</span><span style=\"padding:0 3px\">EC</span></span>。这是通往\"相似\"的第一步。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 240\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<polygon points=\"150,22 42,208 258,208\" fill=\"#EEF0FC\" stroke=\"#4A43C4\" stroke-width=\"1.6\"/>\n<line x1=\"106.8\" y1=\"96.4\" x2=\"193.2\" y2=\"96.4\" stroke=\"#C77A15\" stroke-width=\"2\"/>\n<circle cx=\"150\" cy=\"22\" r=\"2.5\" fill=\"#2E2A6B\"/><circle cx=\"42\" cy=\"208\" r=\"2.5\" fill=\"#2E2A6B\"/><circle cx=\"258\" cy=\"208\" r=\"2.5\" fill=\"#2E2A6B\"/>\n<circle cx=\"106.8\" cy=\"96.4\" r=\"2.5\" fill=\"#C77A15\"/><circle cx=\"193.2\" cy=\"96.4\" r=\"2.5\" fill=\"#C77A15\"/>\n<text x=\"150\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\">A</text>\n<text x=\"34\" y=\"221\" font-size=\"13\" font-weight=\"700\">B</text>\n<text x=\"262\" y=\"221\" font-size=\"13\" font-weight=\"700\">C</text>\n<text x=\"93.8\" y=\"100.4\" font-size=\"12\" fill=\"#C77A15\" font-weight=\"700\">D</text>\n<text x=\"198.2\" y=\"100.4\" font-size=\"12\" fill=\"#C77A15\" font-weight=\"700\">E</text>\n<text x=\"114.4\" y=\"59.2\" font-size=\"10\" fill=\"#4a4a5e\">2</text>\n<text x=\"58.400000000000006\" y=\"152.2\" font-size=\"10\" fill=\"#4a4a5e\">3</text>\n<text x=\"150\" y=\"150\" text-anchor=\"middle\" font-size=\"10\" fill=\"#C77A15\">DE ∥ BC</text></svg></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">DE ∥ BC. AD = 4, DB = 6, EC = 9. Find AE.</div>\n   <div class=\"step\"><span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">AE</span><span style=\"padding:0 3px\">EC</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">AD</span><span style=\"padding:0 3px\">DB</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">4</span><span style=\"padding:0 3px\">6</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">2</span><span style=\"padding:0 3px\">3</span></span>.</div>\n   <div class=\"step\">AE = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">2</span><span style=\"padding:0 3px\">3</span></span> × 9.</div></div>\n   <div class=\"ex-ans\">AE = <b>6</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>DE ∥ BC, AD = 3, AB = 8, AE = 4.5. Find AC.</li>\n   <li>DE ∥ BC, <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">AD</span><span style=\"padding:0 3px\">AB</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">2</span><span style=\"padding:0 3px\">5</span></span>, BC = 15. Find DE.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>AC = 12</b>（AE/AC=AD/AB=3/8 → AC=4.5·8/3）　2) <b>DE = 6</b>（DE/BC=2/5）</div></div></div>"}, {"key": "criteria", "nav": "Criteria 判定", "num": "03", "track": true, "tier": "Fluency", "title": "Similar triangles: definition & criteria", "zh": "相似三角形：定义与判定", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">similar 相似 (~)</span> · <span class=\"t\">corresponding 对应的</span> · <span class=\"t\">AA / SAS / SSS 三种判定</span> · <span class=\"t\">scale factor 相似比 k</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">Two triangles are <b>similar</b> (△ABC ~ △DEF) when they have the same shape: corresponding angles equal and corresponding sides in the same ratio. Three quick tests:</p>\n <p class=\"zh\">两个三角形<b>相似</b>指\"形状相同\"：对应角相等、对应边成比例。三个判定：</p>\n <span class=\"kbd-formula\"><b>AA</b>: two angles equal 两角对应相等<br><b>SAS</b>: two sides in ratio + included angle 两边成比例且夹角相等<br><b>SSS</b>: all three sides in ratio 三边对应成比例</span>\n <div class=\"note warn\"><b>Careful 易错：</b>order matters. △ABC ~ △DEF means A↔D, B↔E, C↔F. 写相似时字母顺序要对应，别写乱。</div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · find a side 求边长</div>\n   <div class=\"steps\"><div class=\"step\">△ABC ~ △DEF with AB = 6, BC = 8, DE = 9. Find EF.</div>\n   <div class=\"step\">Scale factor k = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">DE</span><span style=\"padding:0 3px\">AB</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">9</span><span style=\"padding:0 3px\">6</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">3</span><span style=\"padding:0 3px\">2</span></span>.</div>\n   <div class=\"step\">EF = BC × k = 8 × <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">3</span><span style=\"padding:0 3px\">2</span></span>.</div></div>\n   <div class=\"ex-ans\">EF = <b>12</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>△ABC ~ △PQR, AB=10, PQ=15, BC=8. Find QR.　求 QR。</li>\n   <li>In △ABC, DE ∥ BC. Name a triangle similar to △ADE and give the reason.　写出与△ADE相似的三角形并说明理由。</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>QR = 12</b>（k=15/10=3/2, QR=8·3/2）　2) <b>△ADE ~ △ABC</b>（AA：∠A公用、DE∥BC⇒∠ADE=∠B）</div></div></div>"}, {"key": "props", "nav": "Area ratio 面积比", "num": "04", "track": true, "tier": "Applied", "badge": "gk", "title": "Properties — area ratio = (scale factor)²", "zh": "性质：面积比 = 相似比²", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">scale factor k 相似比</span> · <span class=\"t\">ratio of perimeters 周长比</span> · <span class=\"t\">ratio of areas 面积比</span> · <span class=\"t\">squared 平方</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">If two figures are similar with scale factor k, then: <b>sides ratio = k</b>, <b>perimeter ratio = k</b>, but <b>area ratio = k²</b>.</p>\n <p class=\"zh\">相似比为 k 时：对应边比 = k、周长比 = k，但<b>面积比 = k²</b>。这条是光剑最爱考的一点——面积一定要\"平方\"。</p>\n <span class=\"kbd-formula\"><span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">Area₁</span><span style=\"padding:0 3px\">Area₂</span></span> = k² = (<span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">side₁</span><span style=\"padding:0 3px\">side₂</span></span>)²</span>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 240\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<polygon points=\"106.8,96.4 42,208 258,208 193.2,96.4\" fill=\"#FCF2DF\" stroke=\"#C77A15\" stroke-width=\"1.4\"/>\n<polygon points=\"150,22 106.8,96.4 193.2,96.4\" fill=\"#E6F5EE\" stroke=\"#1F8A5B\" stroke-width=\"1.6\"/>\n<text x=\"150\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\">A</text>\n<text x=\"34\" y=\"221\" font-size=\"13\" font-weight=\"700\">B</text>\n<text x=\"262\" y=\"221\" font-size=\"13\" font-weight=\"700\">C</text>\n<text x=\"150\" y=\"78\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1F8A5B\" font-weight=\"700\">△ADE = 4</text>\n<text x=\"150\" y=\"175\" text-anchor=\"middle\" font-size=\"11\" fill=\"#C77A15\" font-weight=\"700\">梯形 DBCE = 21</text></svg></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · the classic 经典</div>\n   <div class=\"steps\"><div class=\"step\">DE ∥ BC, AD : DB = 2 : 3. Find (a) DE:BC, (b) area△ADE : area of trapezium DBCE.</div>\n   <div class=\"step\">AD : AB = 2 : 5, so DE : BC = <b>2 : 5</b>.</div>\n   <div class=\"step\">area△ADE : area△ABC = (2:5)² = <b>4 : 25</b>.</div>\n   <div class=\"step\">Trapezium = 25 − 4 = 21.</div></div>\n   <div class=\"ex-ans\">△ADE : trapezium DBCE = <b>4 : 21</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Two similar triangles have areas 9 and 25. Find the ratio of their corresponding sides.　面积 9:25，求对应边之比。</li>\n   <li>DE ∥ BC, AD:AB = 3:4, area△ABC = 48. Find area△ADE.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>3 : 5</b>（边比 = √面积比）　2) <b>27</b>（(3/4)²·48 = 9/16·48）</div></div></div>"}, {"key": "areamethod", "nav": "Area method 面积法", "num": "05", "track": true, "tier": "Applied", "title": "Area method with similarity", "zh": "面积法 · 相似综合", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">same height 同高</span> · <span class=\"t\">area ratio = base ratio 等高时面积比=底之比</span> · <span class=\"t\">split 分割</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">Two triangles with the <b>same height</b> have areas in the ratio of their bases. Combined with similarity, this cracks most \"find the area\" problems.</p>\n <p class=\"zh\">同高的两个三角形，面积比 = 底之比。再配上相似，几乎所有\"求面积/面积比\"的压轴都能拆开。</p>\n <span class=\"kbd-formula\">same height 同高 ⇒ <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">area△ABD</span><span style=\"padding:0 3px\">area△ACD</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">BD</span><span style=\"padding:0 3px\">DC</span></span></span>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">D on BC with BD : DC = 3 : 2, and area△ABC = 30. Find area△ABD.　【同型·光剑春招】</div>\n   <div class=\"step\">△ABD and △ABC share the height from A, bases BD and BC. area△ABD = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">BD</span><span style=\"padding:0 3px\">BC</span></span> × 30 = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">3</span><span style=\"padding:0 3px\">5</span></span> × 30.</div></div>\n   <div class=\"ex-ans\">area△ABD = <b>18</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>D on BC, BD:DC = 5:3, area△ACD = 12. Find area△ABC.</li>\n   <li>Medians split a triangle: a median divides it into two equal areas — true or false? Explain briefly.　中线把三角形分成面积相等的两块，对吗？</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>32</b>（ACD:ABC = DC:BC = 3:8 → ABC = 12·8/3）　2) <b>True 对</b>（中点⇒两底相等、同高）</div></div></div>"}, {"key": "coord", "nav": "Reciprocal + similar 反比例+相似", "num": "06", "track": true, "tier": "Elite", "badge": "hard", "title": "Similarity in coordinate geometry", "zh": "相似与坐标几何（反比例）", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">reciprocal y=k/x 反比例</span> · <span class=\"t\">rectangle area = |k| 矩形面积</span> · <span class=\"t\">perpendicular 垂线</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">On y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span>, drop perpendiculars from a point P to both axes. The rectangle they form has area <b>|k|</b> — because area = x·y = x·<span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> = k. Similar triangles then link different points.</p>\n <p class=\"zh\">在 y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> 上取点 P，向两轴作垂线，围成的矩形面积恰好 = <b>|k|</b>（因为 x·y = k）。这是光剑\"反比例+相似\"高频题的钥匙。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 240\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"205\" stroke=\"#999\" stroke-width=\"1.2\"/><line x1=\"40\" y1=\"205\" x2=\"285\" y2=\"205\" stroke=\"#999\" stroke-width=\"1.2\"/>\n<text x=\"32\" y=\"24\" font-size=\"11\">y</text><text x=\"288\" y=\"209\" font-size=\"11\">x</text>\n<path d=\"M88.0,115.0 L100.0,133.0 L115.0,147.4 L130.0,157.0 L160.0,169.0 L190.0,176.2 L220.0,181.0 L250.0,184.4\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2\"/>\n<rect x=\"40\" y=\"157\" width=\"90\" height=\"48\" fill=\"#FCF2DF\" opacity=\".7\" stroke=\"#C77A15\" stroke-dasharray=\"4 3\"/>\n<circle cx=\"130\" cy=\"157\" r=\"3\" fill=\"#C0453B\"/>\n<text x=\"135\" y=\"154\" font-size=\"12\" font-weight=\"700\" fill=\"#C0453B\">P(3, 4)</text>\n<text x=\"70\" y=\"181.0\" font-size=\"11\" fill=\"#C77A15\" font-weight=\"700\">面积 = k = 12</text>\n<text x=\"200\" y=\"60\" font-size=\"11\" fill=\"#4A43C4\" font-weight=\"700\">y = k/x</text></svg></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">P(3, 4) lies on y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span>. Find k and the area of the rectangle from P to the axes.</div>\n   <div class=\"step\">k = x·y = 3 × 4.</div></div>\n   <div class=\"ex-ans\">k = <b>12</b>, rectangle area = <b>12</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>A(2, m) lies on y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">10</span><span style=\"padding:0 3px\">x</span></span>. Find m, then the rectangle area from A to the axes.　【同型·光剑】</li>\n   <li>P is on y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> (k&gt;0); the rectangle from P to the axes has area 6. Find k.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>m = 5, area = 10</b>（2m=10 → m=5；面积=k=10）　2) <b>k = 6</b></div></div></div>"}, {"key": "homo", "nav": "Homothety 位似", "num": "07", "track": true, "tier": "Applied", "title": "Homothety (enlargement)", "zh": "位似（放大/缩小）", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">homothety / enlargement 位似</span> · <span class=\"t\">centre 位似中心</span> · <span class=\"t\">scale factor 放大倍数</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">A <b>homothety</b> enlarges a shape from a centre by factor k: every point moves along the ray from the centre to k times its distance. From the origin, (x, y) → (kx, ky). Area scales by k².</p>\n <p class=\"zh\">位似 = 从一个\"位似中心\"按倍数 k 放大/缩小：每个点沿\"中心→点\"的射线走到 k 倍距离。以原点为中心时 (x, y) → (kx, ky)；面积按 k² 变。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 240\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\">\n<line x1=\"30\" y1=\"210\" x2=\"86\" y2=\"154\" stroke=\"#C77A15\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"30\" y1=\"210\" x2=\"198\" y2=\"154\" stroke=\"#C77A15\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"30\" y1=\"210\" x2=\"142\" y2=\"42\" stroke=\"#C77A15\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><polygon points=\"86,154 198,154 142,42\" fill=\"#EEF0FC\" stroke=\"#4A43C4\" stroke-width=\"1.6\"/><polygon points=\"58,182 114,182 86,126\" fill=\"#E6F5EE\" stroke=\"#1F8A5B\" stroke-width=\"1.6\"/>\n<circle cx=\"30\" cy=\"210\" r=\"3\" fill=\"#C0453B\"/><text x=\"16\" y=\"215\" font-size=\"12\" font-weight=\"700\">O</text>\n<text x=\"117\" y=\"194\" font-size=\"10\" fill=\"#1F8A5B\">原图</text>\n<text x=\"192\" y=\"168\" font-size=\"10\" fill=\"#4A43C4\">位似 k=2 · 面积×4</text></svg></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">Triangle (1,1), (3,1), (2,3) is enlarged from O by factor 2. Find the new vertices and the area change.</div>\n   <div class=\"step\">Multiply each coordinate by 2: (2,2), (6,2), (4,6).</div>\n   <div class=\"step\">Original area = 2, new area = 2 × 2² = 8.</div></div>\n   <div class=\"ex-ans\">Vertices (2,2),(6,2),(4,6); area <b>2 → 8</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Point (4, −6) is enlarged from O by factor <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">2</span></span>. Find the image.</li>\n   <li>A shape of area 5 is enlarged from a centre by factor 3. Find the new area.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>(2, −3)</b>　2) <b>45</b>（5 × 3²）</div></div></div>"}, {"key": "elite", "nav": "Elite 压轴", "num": "08", "track": true, "tier": "Elite", "badge": "hard", "title": "Exam-level: putting it together", "zh": "压轴级 · 综合运用", "body": "\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">Real Guangjian problems combine similarity with area, rectangles or circles. The moves are always the same: <b>spot the similar pair → write the ratio → square it for areas</b>.</p>\n <p class=\"zh\">真题总是把相似和面积/矩形/圆混起来。套路不变：<b>找相似 → 写比 → 面积要平方</b>。下面是改编同型题。</p>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · area method 面积法　【同型·光剑春招】</div>\n   <div class=\"steps\"><div class=\"step\">In △ABC, D on AB and E on AC with DE ∥ BC and AD : AB = 3 : 5. Given area△ADE = 18, find area△ABC and trapezium DBCE.</div>\n   <div class=\"step\">k = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">3</span><span style=\"padding:0 3px\">5</span></span> ⇒ area ratio = (<span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">3</span><span style=\"padding:0 3px\">5</span></span>)² = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">9</span><span style=\"padding:0 3px\">25</span></span>.</div>\n   <div class=\"step\">area△ABC = 18 × <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">25</span><span style=\"padding:0 3px\">9</span></span> = 50; trapezium = 50 − 18.</div></div>\n   <div class=\"ex-ans\">area△ABC = <b>50</b>, trapezium DBCE = <b>32</b></div></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · rectangle + similar 矩形+相似　【同型·光剑】</div>\n   <div class=\"steps\"><div class=\"step\">Rectangle with AB = 6, AD = 8, diagonal AC = 10. The foot of the perpendicular from B to AC splits AC; find the length BH (H on AC).</div>\n   <div class=\"step\">△ABH ~ △ACB (AA) ⇒ <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">BH</span><span style=\"padding:0 3px\">AB</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">BC</span><span style=\"padding:0 3px\">AC</span></span> ⇒ BH = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">AB·BC</span><span style=\"padding:0 3px\">AC</span></span> = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">6×8</span><span style=\"padding:0 3px\">10</span></span>.</div></div>\n   <div class=\"ex-ans\">BH = <b><span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">24</span><span style=\"padding:0 3px\">5</span></span> = 4.8</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习（纯题·先做再看）</div>\n   <ol><li>DE ∥ BC, AD:DB = 1:2, area of trapezium DBCE = 32. Find area△ADE.　【同型】</li>\n   <li>△ABC ~ △A'B'C' with perimeter ratio 2:3; area△ABC = 16. Find area△A'B'C'.</li>\n   <li>P(a, b) on y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span>; the rectangle from P to the axes has area 15 and a = 3. Find b and k.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>4</b>（k=1/3, ADE:ABC=1:9 → ADE:trap=1:8 → 32/8）　2) <b>36</b>（面积比=(2:3)²=4:9 → 16·9/4）　3) <b>b = 5, k = 15</b>（ab=15, a=3）</div></div></div>"}, {"key": "end", "nav": "Summary 小结", "num": "", "track": false, "title": "Summary & where this leads", "zh": "小结与它通向哪里", "body": "\n <div class=\"terms\" style=\"background:#EEF0FC;border-color:#D9DCF6;color:#2E2A6B\"><b>One-line summary 一句话：</b>Find the similar pair, write the side ratio k; sides &amp; perimeters use k, <b>areas use k²</b>. 找相似、写边比 k；边和周长用 k，<b>面积用 k²</b>。</div>\n <h3 class=\"blk\">This unlocks 它解锁了</h3>\n <p class=\"zh\">相似是枢纽，往下直接通向：<b>面积法</b>（求面积压轴）、<b>圆综合</b>（切线+相似）、<b>坐标几何</b>（反比例+相似求 k）。在总逻辑图里点「相似」就能看到这些下游。</p>\n <div class=\"check-list\">\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会用比例/连比、平行线分线段成比例</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会用 AA/SAS/SSS 判定相似、求对应边</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">记牢：面积比 = 相似比²（会用到梯形分割）</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会面积法（同高⇒面积比=底之比）</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会反比例矩形面积=|k|、位似坐标变换</div></div>\n </div>\n <div class=\"parent\"><h4>给家长的话</h4><p style=\"margin:0;font-size:14px;color:#4a4a5e\">相似是几何最高频的一块（光剑约考 10 次）。这份先把\"边比→面积平方\"这条主线打牢，再上真题级同型题。她若在压轴卡住，多半不是不会单点，而是没认出\"这里有一对相似\"——多练\"找相似\"就好。</p></div>"}];
const tocList=document.getElementById('tocList'),content=document.getElementById('content'),progFill=document.getElementById('progFill'),progLabel=document.getElementById('progLabel'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),doneBtn=document.getElementById('doneBtn');
let cur=0;const done=new Set();const trackedTotal=S.filter(s=>s.track).length;
S.forEach((s,i)=>{const a=document.createElement('a');a.dataset.i=i;a.innerHTML=`<span class="n">${s.num||'·'}</span><span class="lbl">${s.nav}</span><span class="tick"></span>`;a.onclick=()=>go(i);tocList.appendChild(a);});
const tocLinks=[...tocList.children];
function render(){
  const s=S[cur];
  const tierHtml = s.tier?`<span class="badge ${s.tier}">${s.tier}</span>`:'';const gkHtml = s.badge==='gk'?'<span class="badge gk">★ Often tested 常考</span>':s.badge==='hard'?'<span class="badge hard">★ Harder 难题</span>':s.badge==='core'?'<span class="badge core">★ Must-know 必背</span>':'';const badgeHtml = tierHtml+gkHtml;
  const zt = s.zh?`<div class="zh-title">${s.zh}</div>`:'';
  content.innerHTML=`<div class="sec-head">${s.num?`<div class="sec-num">${s.num}</div>`:''}<div class="sec-titles"><h2>${s.title}</h2>${zt}${badgeHtml}</div></div><div class="divider"></div>${s.body}`;
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
  prevBtn.disabled=cur===0;nextBtn.disabled=cur===S.length-1;
  if(s.track){doneBtn.style.display='';const d=done.has(cur);doneBtn.textContent=d?'Done 已学完 ✓':'Done 学完了 ✓';doneBtn.classList.toggle('is-done',d);}else{doneBtn.style.display='none';}
  content.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});
}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));render();closeMenu();}
prevBtn.onclick=()=>go(cur-1);nextBtn.onclick=()=>go(cur+1);
doneBtn.onclick=()=>{if(!S[cur].track)return;if(done.has(cur))done.delete(cur);else done.add(cur);updateProgress();render();if(done.has(cur)&&cur<S.length-1)setTimeout(()=>go(cur+1),260);};
function updateProgress(){const n=[...done].filter(i=>S[i].track).length;progFill.style.width=(n/trackedTotal*100)+'%';progLabel.textContent=`${n} / ${trackedTotal}`;tocLinks.forEach((a,i)=>a.classList.toggle('done',done.has(i)&&S[i].track));}
function ans(btn){const box=btn.nextElementSibling;const open=box.classList.toggle('open');btn.textContent=open?btn.textContent.replace('Show','Hide').replace('显示','隐藏'):btn.textContent.replace('Hide','Show').replace('隐藏','显示');}
function tick(el){el.classList.toggle('on');}
const PASCAL_EXP={0:'(a+b)⁰ = 1',1:'(a+b)¹ = a + b',2:'(a+b)² = a² + 2ab + b²',3:'(a+b)³ = a³ + 3a²b + 3ab² + b³',4:'(a+b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴',5:'(a+b)⁵ = a⁵ + 5a⁴b + 10a³b² + 10a²b³ + 5ab⁴ + b⁵',6:'(a+b)⁶ = a⁶ + 6a⁵b + 15a⁴b² + 20a³b³ + 15a²b⁴ + 6ab⁵ + b⁶'};
function pascalPick(r){document.querySelectorAll('#pascalTri .prow').forEach(el=>el.classList.toggle('sel',+el.dataset.r===r));const out=document.getElementById('pascalOut');if(out)out.innerHTML='Row 第 '+r+' 行 → <b>'+PASCAL_EXP[r]+'</b>';}
const toc=document.getElementById('toc'),scrim=document.getElementById('scrim');
document.getElementById('menuBtn').onclick=()=>{toc.classList.add('open');scrim.classList.add('show');};
function closeMenu(){toc.classList.remove('open');scrim.classList.remove('show');}
scrim.onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'&&cur<S.length-1)go(cur+1);if(e.key==='ArrowLeft'&&cur>0)go(cur-1);});
render();updateProgress();
