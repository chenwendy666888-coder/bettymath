<script>
const S = [{"key": "intro", "nav": "Intro 导读", "num": "", "track": false, "title": "Quadratic functions — parabolas, vertices, max & min", "zh": "二次函数——抛物线、顶点、最值", "body": "\n <p class=\"enh\">The quadratic function y = ax² + bx + c draws a <b>parabola</b>. Everything you'll be asked comes from one move: <b>complete the square</b> to find the vertex. The vertex gives the axis of symmetry and the <b>maximum or minimum value</b> — a Guangjian favourite.</p>\n <p class=\"zh\">二次函数 y = ax² + bx + c 画出<b>抛物线</b>。几乎所有题都源自一招：<b>配方</b>求顶点。顶点给出对称轴和<b>最大/最小值</b>——光剑很爱考。</p>\n <div class=\"note\"><b>先要会 needs：</b>一元二次 quadratics、画图 graphing、配方 completing the square。<b>解锁 unlocks：</b>最值应用、图象变换、二次不等式。</div>"}, {"key": "shape", "nav": "Shape 开口", "num": "01", "track": true, "tier": "Fluency", "title": "y = ax² — opening and width", "zh": "y = ax² 的开口与宽窄", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">parabola 抛物线</span> · <span class=\"t\">opens up/down 开口向上/下</span> · <span class=\"t\">vertex 顶点</span> · <span class=\"t\">axis of symmetry 对称轴</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">The sign of <b>a</b> decides the opening: a &gt; 0 opens up (has a <b>minimum</b>), a &lt; 0 opens down (has a <b>maximum</b>). A bigger |a| makes it narrower.</p>\n <p class=\"zh\"><b>a</b> 的符号决定开口：a&gt;0 向上（有<b>最小值</b>）、a&lt;0 向下（有<b>最大值</b>）；|a| 越大越窄。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\"><line x1=\"6\" y1=\"190\" x2=\"294\" y2=\"190\" stroke=\"#bbb\"/><line x1=\"150\" y1=\"8\" x2=\"150\" y2=\"214\" stroke=\"#bbb\"/><path d=\"M59.0,18.5 L62.0,29.7 L65.1,40.6 L68.1,51.1 L71.1,61.2 L74.2,70.9 L77.2,80.2 L80.2,89.2 L83.3,97.8 L86.3,106.0 L89.3,113.8 L92.4,121.2 L95.4,128.3 L98.4,134.9 L101.5,141.2 L104.5,147.1 L107.5,152.7 L110.6,157.8 L113.6,162.6 L116.6,166.9 L119.7,170.9 L122.7,174.6 L125.7,177.8 L128.8,180.7 L131.8,183.1 L134.8,185.2 L137.9,187.0 L140.9,188.3 L143.9,189.2 L147.0,189.8 L150.0,190.0 L153.0,189.8 L156.1,189.2 L159.1,188.3 L162.1,187.0 L165.2,185.2 L168.2,183.1 L171.2,180.7 L174.3,177.8 L177.3,174.6 L180.3,170.9 L183.4,166.9 L186.4,162.6 L189.4,157.8 L192.5,152.7 L195.5,147.1 L198.5,141.2 L201.6,134.9 L204.6,128.3 L207.6,121.2 L210.7,113.8 L213.7,106.0 L216.7,97.8 L219.8,89.2 L222.8,80.2 L225.8,70.9 L228.9,61.2 L231.9,51.1 L234.9,40.6 L238.0,29.7 L241.0,18.5\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2\"/><path d=\"M59.0,121.4 L62.0,125.9 L65.1,130.2 L68.1,134.4 L71.1,138.5 L74.2,142.4 L77.2,146.1 L80.2,149.7 L83.3,153.1 L86.3,156.4 L89.3,159.5 L92.4,162.5 L95.4,165.3 L98.4,168.0 L101.5,170.5 L104.5,172.8 L107.5,175.1 L110.6,177.1 L113.6,179.0 L116.6,180.8 L119.7,182.4 L122.7,183.8 L125.7,185.1 L128.8,186.3 L131.8,187.3 L134.8,188.1 L137.9,188.8 L140.9,189.3 L143.9,189.7 L147.0,189.9 L150.0,190.0 L153.0,189.9 L156.1,189.7 L159.1,189.3 L162.1,188.8 L165.2,188.1 L168.2,187.3 L171.2,186.3 L174.3,185.1 L177.3,183.8 L180.3,182.4 L183.4,180.8 L186.4,179.0 L189.4,177.1 L192.5,175.1 L195.5,172.8 L198.5,170.5 L201.6,168.0 L204.6,165.3 L207.6,162.5 L210.7,159.5 L213.7,156.4 L216.7,153.1 L219.8,149.7 L222.8,146.1 L225.8,142.4 L228.9,138.5 L231.9,134.4 L234.9,130.2 L238.0,125.9 L241.0,121.4\" fill=\"none\" stroke=\"#1F8A5B\" stroke-width=\"2\"/><path d=\"M110.6,222.2 L113.6,217.4 L116.6,213.1 L119.7,209.1 L122.7,205.4 L125.7,202.2 L128.8,199.3 L131.8,196.9 L134.8,194.8 L137.9,193.0 L140.9,191.7 L143.9,190.8 L147.0,190.2 L150.0,190.0 L153.0,190.2 L156.1,190.8 L159.1,191.7 L162.1,193.0 L165.2,194.8 L168.2,196.9 L171.2,199.3 L174.3,202.2 L177.3,205.4 L180.3,209.1 L183.4,213.1 L186.4,217.4 L189.4,222.2\" fill=\"none\" stroke=\"#C0453B\" stroke-width=\"2\"/><text x=\"150\" y=\"20\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#4A43C4\">a>0 开口向上</text><text x=\"150\" y=\"205\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#C0453B\">a<0 开口向下</text><text x=\"250\" y=\"120\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#1F8A5B\">|a|小→更宽</text></svg></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Does y = −3x² + 2x open up or down? Does it have a max or a min?</li>\n   <li>Which is narrower: y = 2x² or y = ½x²?</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) opens <b>down</b>, has a <b>maximum</b>（a=−3&lt;0）　2) <b>y = 2x²</b>（|a| 更大）</div></div></div>"}, {"key": "cts", "nav": "Vertex form 配方", "num": "02", "track": true, "tier": "Applied", "badge": "core", "title": "Completing the square → vertex form", "zh": "配方 → 顶点式", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">completing the square 配方</span> · <span class=\"t\">vertex form 顶点式</span> · <span class=\"t\">turning point 顶点</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">Rewrite y = ax² + bx + c as <b>y = a(x − h)² + k</b>. Then the vertex is (h, k) and the axis of symmetry is x = h, where h = −<span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">b</span><span style=\"padding:0 3px\">2a</span></span>.</p>\n <p class=\"zh\">把 y = ax² + bx + c 配成 <b>y = a(x − h)² + k</b>，顶点就是 (h, k)、对称轴 x = h，其中 h = −<span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">b</span><span style=\"padding:0 3px\">2a</span></span>。</p>\n <span class=\"kbd-formula\">y = a(x − h)² + k　·　vertex 顶点 (h, k)　·　axis 对称轴 x = h = −<span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">b</span><span style=\"padding:0 3px\">2a</span></span></span>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · 配方</div>\n   <div class=\"steps\"><div class=\"step\">Write y = x² − 6x + 5 in vertex form and state the vertex.</div>\n   <div class=\"step\">x² − 6x = (x − 3)² − 9 ⇒ y = (x − 3)² − 9 + 5 = (x − 3)² − 4.</div></div>\n   <div class=\"ex-ans\">y = (x − 3)² − 4, vertex <b>(3, −4)</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Write y = x² + 4x + 1 in vertex form; state the vertex.</li>\n   <li>Write y = 2x² − 8x + 5 in vertex form; state the vertex.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) y = (x + 2)² − 3, vertex <b>(−2, −3)</b>　2) y = 2(x − 2)² − 3, vertex <b>(2, −3)</b></div></div></div>"}, {"key": "graph", "nav": "Vertex/axis/roots 图象", "num": "03", "track": true, "tier": "Applied", "title": "Vertex, axis & intercepts", "zh": "顶点、对称轴与交点", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">x-intercept (root) 与x轴交点/根</span> · <span class=\"t\">y-intercept 与y轴交点</span> · <span class=\"t\">discriminant 判别式</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">To sketch a parabola: find the <b>axis</b> x = −<span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">b</span><span style=\"padding:0 3px\">2a</span></span>, the <b>vertex</b>, the <b>x-intercepts</b> (solve y = 0) and the <b>y-intercept</b> (c). The discriminant b² − 4ac tells you how many x-intercepts: 2, 1 (tangent), or 0.</p>\n <p class=\"zh\">画抛物线四步：对称轴 x = −<span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">b</span><span style=\"padding:0 3px\">2a</span></span>、顶点、与 x 轴交点（解 y=0）、与 y 轴交点（c）。判别式 b²−4ac 决定 x 轴交点个数：2、1（相切）、0。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\"><line x1=\"6\" y1=\"150\" x2=\"294\" y2=\"150\" stroke=\"#bbb\" stroke-width=\"1\"/><line x1=\"150.0\" y1=\"8\" x2=\"150.0\" y2=\"214\" stroke=\"#bbb\" stroke-width=\"1\"/><path d=\"M92.8,81.4 L95.6,88.7 L98.3,95.9 L101.1,102.8 L103.9,109.4 L106.7,115.8 L109.4,121.9 L112.2,127.8 L115.0,133.4 L117.8,138.8 L120.5,143.9 L123.3,148.8 L126.1,153.4 L128.9,157.8 L131.6,162.0 L134.4,165.8 L137.2,169.5 L139.9,172.8 L142.7,176.0 L145.5,178.9 L148.3,181.5 L151.0,183.9 L153.8,186.0 L156.6,187.9 L159.4,189.5 L162.1,190.9 L164.9,192.0 L167.7,192.9 L170.5,193.5 L173.2,193.9 L176.0,194.0 L178.8,193.9 L181.5,193.5 L184.3,192.9 L187.1,192.0 L189.9,190.9 L192.6,189.5 L195.4,187.9 L198.2,186.0 L201.0,183.9 L203.7,181.5 L206.5,178.9 L209.3,176.0 L212.1,172.8 L214.8,169.5 L217.6,165.8 L220.4,162.0 L223.1,157.8 L225.9,153.4 L228.7,148.8 L231.5,143.9 L234.2,138.8 L237.0,133.4 L239.8,127.8 L242.6,121.9 L245.3,115.8 L248.1,109.4 L250.9,102.8 L253.7,95.9 L256.4,88.7 L259.2,81.4\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2\"/><line x1=\"176\" y1=\"8\" x2=\"176\" y2=\"214\" stroke=\"#C77A15\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><circle cx=\"176\" cy=\"194\" r=\"3\" fill=\"#C0453B\"/><text x=\"182\" y=\"198\" text-anchor=\"start\" font-size=\"9.5\" font-weight=\"700\" fill=\"#C0453B\">顶点(1,−4)</text><circle cx=\"124\" cy=\"150\" r=\"2.6\" fill=\"#1F8A5B\"/><circle cx=\"228\" cy=\"150\" r=\"2.6\" fill=\"#1F8A5B\"/><text x=\"120\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#1F8A5B\">−1</text><text x=\"232\" y=\"144\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#1F8A5B\">3</text><text x=\"176\" y=\"216\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#C77A15\">轴 x=1</text></svg></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">Sketch y = x² − 2x − 3: axis, vertex, intercepts.</div>\n   <div class=\"step\">Axis x = −<span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">−2</span><span style=\"padding:0 3px\">2</span></span> = 1. Vertex (1, −4). Roots: (x − 3)(x + 1) = 0 ⇒ x = −1, 3. y-intercept −3.</div></div>\n   <div class=\"ex-ans\">axis <b>x = 1</b>, vertex <b>(1, −4)</b>, x-int <b>−1, 3</b>, y-int <b>−3</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>For y = x² − 4x + 3, find the axis, vertex and x-intercepts.</li>\n   <li>How many times does y = x² − 4x + 4 meet the x-axis? Explain.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) axis x = 2, vertex <b>(2, −1)</b>, roots <b>1, 3</b>　2) <b>once (tangent)</b>，判别式 16−16 = 0</div></div></div>"}, {"key": "maxmin", "nav": "Max/Min 最值", "num": "04", "track": true, "tier": "Applied", "badge": "gk", "title": "Maximum & minimum value", "zh": "最大值与最小值", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">minimum value 最小值</span> · <span class=\"t\">maximum value 最大值</span> · <span class=\"t\">at the vertex 在顶点处</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">The max/min value <b>is the k in the vertex (h, k)</b>. If a &gt; 0 the parabola opens up, so k is the <b>minimum</b>. If a &lt; 0 it opens down, so k is the <b>maximum</b>. It happens at x = h.</p>\n <p class=\"zh\">最值<b>就是顶点 (h, k) 里的 k</b>。a&gt;0 开口向上 → k 是<b>最小值</b>；a&lt;0 开口向下 → k 是<b>最大值</b>；都在 x = h 处取得。</p>\n <span class=\"kbd-formula\">a &gt; 0 ⇒ min = k　·　a &lt; 0 ⇒ max = k　（both at x = h）</span>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">Find the minimum of y = 2x² − 8x + 5.</div>\n   <div class=\"step\">= 2(x − 2)² − 3, a &gt; 0 ⇒ minimum = −3 at x = 2.</div>\n   <div class=\"step\">Find the maximum of y = −x² + 4x − 1 = −(x − 2)² + 3 ⇒ maximum = 3 at x = 2.</div></div>\n   <div class=\"ex-ans\">min <b>−3</b> (at x = 2)　·　max <b>3</b> (at x = 2)</div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Find the minimum value of y = x² − 6x + 11.</li>\n   <li>Find the maximum value of y = −2x² + 4x + 1.</li>\n   <li>y = x² + 2x + k has minimum value 5. Find k.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>2</b>（(x−3)²+2）　2) <b>3</b>（−2(x−1)²+3）　3) <b>k = 6</b>（min = k−1 = 5）</div></div></div>"}, {"key": "interval", "nav": "On an interval 区间最值", "num": "05", "track": true, "tier": "Elite", "badge": "hard", "title": "Max & min on a restricted interval", "zh": "限定区间上的最值（难点）", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">interval [m, n] 区间</span> · <span class=\"t\">vertex inside/outside 顶点在内/在外</span> · <span class=\"t\">endpoints 端点</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">On an interval [m, n] the max/min may be at the <b>vertex</b> OR at an <b>endpoint</b>. The rule: check whether the axis x = h lies inside [m, n].</p>\n <p class=\"zh\">在区间 [m, n] 上，最值可能在<b>顶点</b>、也可能在<b>端点</b>。方法：先看对称轴 x = h 在不在区间内。</p>\n <span class=\"kbd-formula\">vertex inside 顶点在内 ⇒ min/max at vertex, other extreme at farther endpoint<br>vertex outside 顶点在外 ⇒ function is monotonic ⇒ both extremes at the two endpoints</span>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\"><line x1=\"6\" y1=\"150\" x2=\"294\" y2=\"150\" stroke=\"#bbb\" stroke-width=\"1\"/><line x1=\"40\" y1=\"8\" x2=\"40\" y2=\"194\" stroke=\"#bbb\" stroke-width=\"1\"/><path d=\"M16.0,45.0 L20.2,53.5 L24.3,61.7 L28.5,69.6 L32.6,77.3 L36.8,84.6 L41.0,91.6 L45.1,98.3 L49.3,104.7 L53.4,110.8 L57.6,116.6 L61.8,122.2 L65.9,127.4 L70.1,132.3 L74.2,136.9 L78.4,141.2 L82.6,145.2 L86.7,148.9 L90.9,152.3 L95.0,155.4 L99.2,158.2 L103.4,160.8 L107.5,163.0 L111.7,164.9 L115.8,166.5 L120.0,167.8 L124.2,168.8 L128.3,169.5 L132.5,169.9 L136.6,170.0 L140.8,169.8 L145.0,169.3 L149.1,168.5 L153.3,167.4 L157.4,166.0 L161.6,164.3 L165.8,162.3 L169.9,160.0 L174.1,157.4 L178.2,154.5 L182.4,151.3 L186.6,147.8 L190.7,144.0 L194.9,139.9 L199.0,135.5 L203.2,130.8 L207.4,125.8 L211.5,120.5 L215.7,114.9 L219.8,109.0 L224.0,102.8 L228.2,96.3 L232.3,89.5 L236.5,82.4 L240.6,75.0 L244.8,67.2 L249.0,59.2 L253.1,50.9 L257.3,42.3 L261.4,33.4 L265.6,24.2\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2\"/><rect x=\"40\" y=\"8\" width=\"144\" height=\"182\" fill=\"#EEF0FC\" opacity=\"0.5\"/><circle cx=\"136\" cy=\"170\" r=\"3.5\" fill=\"#C0453B\"/><text x=\"136\" y=\"186\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#C0453B\">min(2,−1)</text><circle cx=\"40\" cy=\"90\" r=\"3.5\" fill=\"#1F8A5B\"/><text x=\"42\" y=\"84\" text-anchor=\"start\" font-size=\"9\" font-weight=\"700\" fill=\"#1F8A5B\">max=3</text><text x=\"150\" y=\"195\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#4a4a5e\">区间[0,3]：顶点在内→min=−1；端点比→max=3</text></svg></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · 顶点在内 vs 在外</div>\n   <div class=\"steps\"><div class=\"step\">y = x² − 4x + 3 (vertex (2, −1)). Find its max and min on (a) [0, 3], (b) [3, 5].</div>\n   <div class=\"step\">(a) axis x = 2 ∈ [0, 3]. Min at vertex = −1. Endpoints: y(0) = 3, y(3) = 0 ⇒ max = 3.</div>\n   <div class=\"step\">(b) axis x = 2 ∉ [3, 5], and on [3, 5] the curve is increasing. So min = y(3) = 0, max = y(5) = 8.</div></div>\n   <div class=\"ex-ans\">[0,3]: min <b>−1</b>, max <b>3</b>　·　[3,5]: min <b>0</b>, max <b>8</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>y = x² − 2x (vertex (1, −1)). Find max &amp; min on [−1, 2].</li>\n   <li>y = −x² + 2x + 3 on [2, 4]. Find max &amp; min.　（提示：先定顶点，再看轴在不在区间内）</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) 顶点(1,−1)∈[−1,2]：min = −1；端点 y(−1)=3, y(2)=0 ⇒ max = <b>3</b>；min = <b>−1</b>　2) 顶点(1,4)∉[2,4]，区间上递减：max = y(2) = <b>3</b>，min = y(4) = <b>−5</b></div></div></div>"}, {"key": "app", "nav": "Applications 最值应用", "num": "06", "track": true, "tier": "Applied", "title": "Max/min word problems", "zh": "最值应用题", "body": "\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">Set up a quadratic for the quantity (area, height, profit), then the vertex gives the optimum. Watch the domain — a length can't be negative.</p>\n <p class=\"zh\">把\"要最优的量\"（面积/高度/利润）写成二次函数，顶点就是最优；注意定义域——长度不能为负。</p>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · 最大面积</div>\n   <div class=\"steps\"><div class=\"step\">A rectangle has perimeter 20. What dimensions give the maximum area?</div>\n   <div class=\"step\">Let one side = x, the other = 10 − x. Area A = x(10 − x) = −x² + 10x = −(x − 5)² + 25.</div>\n   <div class=\"step\">Max at x = 5 ⇒ a 5 × 5 square.</div></div>\n   <div class=\"ex-ans\">max area = <b>25</b> (a 5 × 5 square)</div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>A ball's height is h = −5t² + 20t (metres, seconds). Find the maximum height and when it occurs.</li>\n   <li>Two numbers add to 12. Find the maximum value of their product.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) h = −5(t − 2)² + 20 ⇒ <b>20 m at t = 2 s</b>　2) x(12 − x) max at x = 6 ⇒ <b>36</b></div></div></div>"}, {"key": "elite", "nav": "Elite 综合", "num": "07", "track": true, "tier": "Elite", "badge": "hard", "title": "Exam-level: quadratic functions combined", "zh": "压轴 · 二次函数综合", "body": "\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">Hard problems mix the vertex, the discriminant and the sign of the parabola. Always start from the vertex form.</p>\n <p class=\"zh\">压轴题混合顶点、判别式、抛物线正负号。永远从配成顶点式开始。下面是改编同型题。</p>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · 相切 tangent to x-axis　【同型·光剑】</div>\n   <div class=\"steps\"><div class=\"step\">For what c is y = x² − 4x + c tangent to the x-axis (touches at one point)?</div>\n   <div class=\"step\">Tangent ⇒ discriminant = 0 ⇒ (−4)² − 4c = 0 ⇒ 16 = 4c.</div></div>\n   <div class=\"ex-ans\">c = <b>4</b></div></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题 · 二次不等式 quadratic inequality</div>\n   <div class=\"steps\"><div class=\"step\">Using y = x² − 4x + 3, solve x² − 4x + 3 &lt; 0.</div>\n   <div class=\"step\">Roots 1, 3; parabola opens up ⇒ below the axis between the roots.</div></div>\n   <div class=\"ex-ans\">1 &lt; x &lt; 3</div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习（纯题·先做再看）</div>\n   <ol><li>y = x² − 6x + m has minimum value 4. Find m.　【同型】</li>\n   <li>Find the range of k for which x² + kx + 9 = 0 has two distinct real roots.</li>\n   <li>On [0, 4], find the max and min of y = x² − 6x + 5.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>m = 13</b>（min = m − 9 = 4）　2) <b>k &lt; −6 或 k &gt; 6</b>（k² − 36 &gt; 0）　3) 顶点(3,−4)∈[0,4]：min = <b>−4</b>；端点 y(0)=5, y(4)=−3 ⇒ max = <b>5</b></div></div></div>"}, {"key": "end", "nav": "Summary 小结", "num": "", "track": false, "title": "Summary & where this leads", "zh": "小结与它通向哪里", "body": "\n <div class=\"terms\" style=\"background:#EEF0FC;border-color:#D9DCF6;color:#2E2A6B\"><b>One-line 一句话：</b>Complete the square → vertex (h, k). a&gt;0 ⇒ min = k; a&lt;0 ⇒ max = k. On an interval, check if the axis is inside; if not, the extremes are at the endpoints. 配方求顶点；a&gt;0取最小、a&lt;0取最大；限定区间先看轴在不在区间内，不在就看端点。</div>\n <h3 class=\"blk\">This unlocks 它解锁了</h3>\n <p class=\"zh\">二次函数往下通向：<b>最值应用题</b>、<b>二次不等式</b>、<b>图象变换</b>，以及坐标几何里的抛物线。想学<b>渐近线 asymptote</b>？那是<b>反比例函数</b>的性质——见「反比例函数与渐近线」讲义。</p>\n <div class=\"check-list\">\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会配方成顶点式、读出顶点与对称轴</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会求最大/最小值（a&gt;0最小、a&lt;0最大）</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会限定区间上的最值（顶点在内/在外）</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会最值应用题（面积/高度/乘积）</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会用判别式判断交点个数、解二次不等式</div></div>\n </div>\n <div class=\"parent\"><h4>给家长的话</h4><p style=\"margin:0;font-size:14px;color:#4a4a5e\">这份把二次函数从\"会配方\"推到了\"限定区间最值 + 最值应用\"，正是英文卷和 A-Level 的重点难点。区间最值那节是她最容易错的——核心就一句：先看对称轴在不在区间里。</p></div>"}];
const tocList=document.getElementById('tocList'),content=document.getElementById('content'),progFill=document.getElementById('progFill'),progLabel=document.getElementById('progLabel'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),doneBtn=document.getElementById('doneBtn');
let cur=0;const done=new Set();const trackedTotal=S.filter(s=>s.track).length;
S.forEach((s,i)=>{const a=document.createElement('a');a.dataset.i=i;a.innerHTML=`<span class="n">${s.num||'·'}</span><span class="lbl">${s.nav}</span><span class="tick"></span>`;a.onclick=()=>go(i);tocList.appendChild(a);});
const tocLinks=[...tocList.children];
function render(){
  const s=S[cur];
  const tierHtml = s.tier?`<span class="badge ${s.tier}">${s.tier}</span>`:'';const gkHtml = s.badge==='gk'?'<span class="badge gk">★ Often tested 常考</span>':s.badge==='hard'?'<span class="badge hard">★ Harder 难题</span>':s.badge==='core'?'<span class="badge core">★ Must-know 必背</span>':'';const badgeHtml = tierHtml+gkHtml;
  const zt = s.zh?`<div class="zh-title">${s.zh}</div>`:'';
  content.innerHTML=`<div class="sec-head">${s.num?`<div class="sec-num">${s.num}</div>`:''}<div class="sec-titles"><h2>${s.title}</h2>${zt}${badgeHtml}</div></div><div class="divider"></div>${s.body}`;
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
  prevBtn.disabled=cur===0;nextBtn.disabled=cur===S.length-1;
  if(s.track){doneBtn.style.display='';const d=done.has(cur);doneBtn.textContent=d?'Done 已学完 ✓':'Done 学完了 ✓';doneBtn.classList.toggle('is-done',d);}else{doneBtn.style.display='none';}
  content.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});
}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));render();closeMenu();}
prevBtn.onclick=()=>go(cur-1);nextBtn.onclick=()=>go(cur+1);
doneBtn.onclick=()=>{if(!S[cur].track)return;if(done.has(cur))done.delete(cur);else done.add(cur);updateProgress();render();if(done.has(cur)&&cur<S.length-1)setTimeout(()=>go(cur+1),260);};
function updateProgress(){const n=[...done].filter(i=>S[i].track).length;progFill.style.width=(n/trackedTotal*100)+'%';progLabel.textContent=`${n} / ${trackedTotal}`;tocLinks.forEach((a,i)=>a.classList.toggle('done',done.has(i)&&S[i].track));}
function ans(btn){const box=btn.nextElementSibling;const open=box.classList.toggle('open');btn.textContent=open?btn.textContent.replace('Show','Hide').replace('显示','隐藏'):btn.textContent.replace('Hide','Show').replace('隐藏','显示');}
function tick(el){el.classList.toggle('on');}
const PASCAL_EXP={0:'(a+b)⁰ = 1',1:'(a+b)¹ = a + b',2:'(a+b)² = a² + 2ab + b²',3:'(a+b)³ = a³ + 3a²b + 3ab² + b³',4:'(a+b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴',5:'(a+b)⁵ = a⁵ + 5a⁴b + 10a³b² + 10a²b³ + 5ab⁴ + b⁵',6:'(a+b)⁶ = a⁶ + 6a⁵b + 15a⁴b² + 20a³b³ + 15a²b⁴ + 6ab⁵ + b⁶'};
function pascalPick(r){document.querySelectorAll('#pascalTri .prow').forEach(el=>el.classList.toggle('sel',+el.dataset.r===r));const out=document.getElementById('pascalOut');if(out)out.innerHTML='Row 第 '+r+' 行 → <b>'+PASCAL_EXP[r]+'</b>';}
const toc=document.getElementById('toc'),scrim=document.getElementById('scrim');
document.getElementById('menuBtn').onclick=()=>{toc.classList.add('open');scrim.classList.add('show');};
function closeMenu(){toc.classList.remove('open');scrim.classList.remove('show');}
scrim.onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'&&cur<S.length-1)go(cur+1);if(e.key==='ArrowLeft'&&cur>0)go(cur-1);});
render();updateProgress();
</script>
