and 4th. Every point satisfies x·y = k.</p>\n <p class=\"zh\">y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> 有两条分开的<b>支</b>：k&gt;0 在第一、三象限，k&lt;0 在第二、四象限。曲线上每个点都满足 x·y = k。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 240\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\"><line x1=\"6\" y1=\"120\" x2=\"294\" y2=\"120\" stroke=\"#bbb\" stroke-width=\"1\"/><line x1=\"150\" y1=\"8\" x2=\"150\" y2=\"234\" stroke=\"#bbb\" stroke-width=\"1\"/><path d=\"M159.8,16.0 L161.7,33.3 L163.7,45.7 L165.6,55.0 L167.6,62.2 L169.5,68.0 L171.4,72.7 L173.4,76.7 L175.3,80.0 L177.3,82.9 L179.2,85.3 L181.2,87.5 L183.2,89.4 L185.1,91.1 L187.1,92.6 L189.0,94.0 L190.9,95.2 L192.9,96.4 L194.8,97.4 L196.8,98.3 L198.8,99.2 L200.7,100.0 L202.7,100.7 L204.6,101.4 L206.6,102.1 L208.5,102.7 L210.4,103.2 L212.4,103.8 L214.4,104.2 L216.3,104.7 L218.2,105.1 L220.2,105.6 L222.1,105.9 L224.1,106.3 L226.1,106.7 L228.0,107.0 L229.9,107.3 L231.9,107.6 L233.9,107.9 L235.8,108.2 L237.8,108.4 L239.7,108.7 L241.6,108.9 L243.6,109.2 L245.6,109.4 L247.5,109.6 L249.4,109.8 L251.4,110.0 L253.3,110.2 L255.3,110.4 L257.2,110.5 L259.2,110.7 L261.1,110.9 L263.1,111.0 L265.1,111.2 L267.0,111.3 L268.9,111.5 L270.9,111.6 L272.9,111.7 L274.8,111.9 L276.8,112.0 L278.7,112.1 L280.6,112.2 L282.6,112.4 L284.5,112.5 L286.5,112.6 L288.5,112.7 L290.4,112.8 L292.4,112.9 L294.3,113.0 L296.2,113.1 L298.2,113.2 L300.1,113.2 L302.1,113.3 L304.0,113.4\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2\"/><path d=\"M140.2,224.0 L138.3,206.7 L136.3,194.3 L134.4,185.0 L132.4,177.8 L130.5,172.0 L128.6,167.3 L126.6,163.3 L124.7,160.0 L122.7,157.1 L120.8,154.7 L118.8,152.5 L116.8,150.6 L114.9,148.9 L112.9,147.4 L111.0,146.0 L109.1,144.8 L107.1,143.6 L105.2,142.6 L103.2,141.7 L101.2,140.8 L99.3,140.0 L97.3,139.3 L95.4,138.6 L93.5,137.9 L91.5,137.3 L89.6,136.8 L87.6,136.2 L85.6,135.8 L83.7,135.3 L81.8,134.9 L79.8,134.4 L77.9,134.1 L75.9,133.7 L74.0,133.3 L72.0,133.0 L70.1,132.7 L68.1,132.4 L66.1,132.1 L64.2,131.8 L62.2,131.6 L60.3,131.3 L58.4,131.1 L56.4,130.8 L54.5,130.6 L52.5,130.4 L50.6,130.2 L48.6,130.0 L46.7,129.8 L44.7,129.6 L42.8,129.5 L40.8,129.3 L38.9,129.1 L36.9,129.0 L35.0,128.8 L33.0,128.7 L31.0,128.5 L29.1,128.4 L27.2,128.3 L25.2,128.1 L23.2,128.0 L21.3,127.9 L19.4,127.8 L17.4,127.6 L15.5,127.5 L13.5,127.4 L11.5,127.3 L9.6,127.2 L7.7,127.1 L5.7,127.0 L3.8,126.9 L1.8,126.8 L-0.1,126.8 L-2.1,126.7 L-4.0,126.6\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2\"/><text x=\"230\" y=\"40\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#4A43C4\">y = k/x (k>0)</text><text x=\"60\" y=\"200\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#6A6A82\">两支：一、三象限</text></svg></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">The curve y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> passes through (2, 3). Find k, then y when x = 4.</div>\n   <div class=\"step\">k = x·y = 2 × 3 = 6 ⇒ y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">6</span><span style=\"padding:0 3px\">x</span></span>. At x = 4: y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">6</span><span style=\"padding:0 3px\">4</span></span> = 1.5.</div></div>\n   <div class=\"ex-ans\">k = <b>6</b>, and y = <b>1.5</b> at x = 4</div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> passes through (−3, 4). Find k and state the quadrants of the branches.</li>\n   <li>For y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">12</span><span style=\"padding:0 3px\">x</span></span>, find y when x = 8.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) k = −12（2nd &amp; 4th quadrants 二、四象限）　2) y = <b>1.5</b></div></div></div>"}, {"key": "asym", "nav": "Asymptotes 渐近线", "num": "02", "track": true, "tier": "Applied", "badge": "core", "title": "Asymptotes", "zh": "渐近线", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">asymptote 渐近线</span> · <span class=\"t\">approaches 趋近</span> · <span class=\"t\">never touches 永不相交</span> · <span class=\"t\">horizontal / vertical 水平/竖直</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">An <b>asymptote</b> is a line the curve gets infinitely close to but never reaches. For y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span>: as x gets very large, y → 0 (the line <b>y = 0</b> is a horizontal asymptote); as x → 0, y shoots to ±∞ (the line <b>x = 0</b> is a vertical asymptote).</p>\n <p class=\"zh\"><b>渐近线</b>是曲线无限靠近却永远碰不到的直线。对 y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span>：x 越来越大时 y → 0（<b>y = 0</b> 是水平渐近线）；x → 0 时 y → ±∞（<b>x = 0</b> 是竖直渐近线）。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 240\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\"><line x1=\"6\" y1=\"120\" x2=\"294\" y2=\"120\" stroke=\"#bbb\" stroke-width=\"1\"/><line x1=\"150\" y1=\"8\" x2=\"150\" y2=\"234\" stroke=\"#bbb\" stroke-width=\"1\"/><path d=\"M159.8,16.0 L161.7,33.3 L163.7,45.7 L165.6,55.0 L167.6,62.2 L169.5,68.0 L171.4,72.7 L173.4,76.7 L175.3,80.0 L177.3,82.9 L179.2,85.3 L181.2,87.5 L183.2,89.4 L185.1,91.1 L187.1,92.6 L189.0,94.0 L190.9,95.2 L192.9,96.4 L194.8,97.4 L196.8,98.3 L198.8,99.2 L200.7,100.0 L202.7,100.7 L204.6,101.4 L206.6,102.1 L208.5,102.7 L210.4,103.2 L212.4,103.8 L214.4,104.2 L216.3,104.7 L218.2,105.1 L220.2,105.6 L222.1,105.9 L224.1,106.3 L226.1,106.7 L228.0,107.0 L229.9,107.3 L231.9,107.6 L233.9,107.9 L235.8,108.2 L237.8,108.4 L239.7,108.7 L241.6,108.9 L243.6,109.2 L245.6,109.4 L247.5,109.6 L249.4,109.8 L251.4,110.0 L253.3,110.2 L255.3,110.4 L257.2,110.5 L259.2,110.7 L261.1,110.9 L263.1,111.0 L265.1,111.2 L267.0,111.3 L268.9,111.5 L270.9,111.6 L272.9,111.7 L274.8,111.9 L276.8,112.0 L278.7,112.1 L280.6,112.2 L282.6,112.4 L284.5,112.5 L286.5,112.6 L288.5,112.7 L290.4,112.8 L292.4,112.9 L294.3,113.0 L296.2,113.1 L298.2,113.2 L300.1,113.2 L302.1,113.3 L304.0,113.4\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2\"/><path d=\"M140.2,224.0 L138.3,206.7 L136.3,194.3 L134.4,185.0 L132.4,177.8 L130.5,172.0 L128.6,167.3 L126.6,163.3 L124.7,160.0 L122.7,157.1 L120.8,154.7 L118.8,152.5 L116.8,150.6 L114.9,148.9 L112.9,147.4 L111.0,146.0 L109.1,144.8 L107.1,143.6 L105.2,142.6 L103.2,141.7 L101.2,140.8 L99.3,140.0 L97.3,139.3 L95.4,138.6 L93.5,137.9 L91.5,137.3 L89.6,136.8 L87.6,136.2 L85.6,135.8 L83.7,135.3 L81.8,134.9 L79.8,134.4 L77.9,134.1 L75.9,133.7 L74.0,133.3 L72.0,133.0 L70.1,132.7 L68.1,132.4 L66.1,132.1 L64.2,131.8 L62.2,131.6 L60.3,131.3 L58.4,131.1 L56.4,130.8 L54.5,130.6 L52.5,130.4 L50.6,130.2 L48.6,130.0 L46.7,129.8 L44.7,129.6 L42.8,129.5 L40.8,129.3 L38.9,129.1 L36.9,129.0 L35.0,128.8 L33.0,128.7 L31.0,128.5 L29.1,128.4 L27.2,128.3 L25.2,128.1 L23.2,128.0 L21.3,127.9 L19.4,127.8 L17.4,127.6 L15.5,127.5 L13.5,127.4 L11.5,127.3 L9.6,127.2 L7.7,127.1 L5.7,127.0 L3.8,126.9 L1.8,126.8 L-0.1,126.8 L-2.1,126.7 L-4.0,126.6\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2\"/><line x1=\"6\" y1=\"120\" x2=\"294\" y2=\"120\" stroke=\"#C0453B\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><line x1=\"150\" y1=\"8\" x2=\"150\" y2=\"234\" stroke=\"#C0453B\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"250\" y=\"133\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#C0453B\">渐近线 y=0</text><text x=\"150\" y=\"20\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#C0453B\">渐近线 x=0</text><text x=\"150\" y=\"228\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#4a4a5e\">曲线无限靠近坐标轴但永不相交</text></svg></div>\n <div class=\"note warn\"><b>直觉 Intuition：</b>越除以一个越大的数，结果越接近 0（但到不了 0）；除以越接近 0 的数，结果越爆炸。这就是渐近线的来源。</div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>Write down the two asymptotes of y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">5</span><span style=\"padding:0 3px\">x</span></span>.</li>\n   <li>True or false: the curve y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> ever crosses the x-axis. Explain.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>x = 0 and y = 0</b>　2) <b>False</b>：y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> 永远不为 0，所以永不碰 x 轴（渐近）。</div></div></div>"}, {"key": "area", "nav": "Area = |k| 矩形面积", "num": "03", "track": true, "tier": "Applied", "badge": "gk", "title": "The rectangle area = |k| (link to similarity)", "zh": "矩形面积 = |k|（接相似）", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">perpendicular to axes 向两轴作垂线</span> · <span class=\"t\">rectangle 矩形</span> · <span class=\"t\">area 面积</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">Take any point P(x, y) on y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> and drop perpendiculars to both axes. The rectangle formed has area x·y = <b>|k|</b> — constant for every point. This is the key to the Guangjian \"reciprocal + similarity\" problems.</p>\n <p class=\"zh\">在 y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> 上任取一点 P(x, y)，向两轴作垂线，围成的矩形面积 = x·y = <b>|k|</b>，对每个点都一样。这正是光剑\"反比例 + 相似\"题的钥匙。</p>\n <span class=\"kbd-formula\">rectangle from P to the axes 矩形面积 = |x·y| = |k|</span>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">P(3, 4) lies on y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span>. Find k and the area of the rectangle from P to the axes.</div>\n   <div class=\"step\">k = 3 × 4 = 12 ⇒ area = |k| = 12.</div></div>\n   <div class=\"ex-ans\">k = <b>12</b>, rectangle area = <b>12</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>A(2, m) lies on y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">10</span><span style=\"padding:0 3px\">x</span></span>. Find m and the rectangle area from A to the axes.　【同型·光剑】</li>\n   <li>P is on y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> (k &gt; 0); the rectangle from P to the axes has area 8. Find k.</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) m = 5, area = <b>10</b>　2) k = <b>8</b></div></div></div>"}, {"key": "shift", "nav": "Translation 平移", "num": "04", "track": true, "tier": "Elite", "badge": "hard", "title": "Shifting the asymptotes", "zh": "平移·移动渐近线", "body": "\n <div class=\"terms\"><b>Key terms 关键词</b>：<span class=\"t\">translation 平移</span> · <span class=\"t\">shifted asymptote 平移后的渐近线</span></div>\n <h3 class=\"blk\">Explanation 讲解</h3>\n <p class=\"enh\">y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x − a</span></span> + b is the hyperbola shifted right by a and up by b. Its asymptotes move too: the vertical one to <b>x = a</b>, the horizontal one to <b>y = b</b>.</p>\n <p class=\"zh\">y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x − a</span></span> + b 是把双曲线向右移 a、向上移 b。渐近线也跟着移：竖直的到 <b>x = a</b>，水平的到 <b>y = b</b>。</p>\n <div style=\"text-align:center;margin:10px 0\"><svg viewBox=\"0 0 300 240\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"-apple-system,PingFang SC,sans-serif\"><line x1=\"6\" y1=\"120\" x2=\"294\" y2=\"120\" stroke=\"#bbb\" stroke-width=\"1\"/><line x1=\"150\" y1=\"8\" x2=\"150\" y2=\"234\" stroke=\"#bbb\" stroke-width=\"1\"/><path d=\"M159.8,16.0 L161.7,33.3 L163.7,45.7 L165.6,55.0 L167.6,62.2 L169.5,68.0 L171.4,72.7 L173.4,76.7 L175.3,80.0 L177.3,82.9 L179.2,85.3 L181.2,87.5 L183.2,89.4 L185.1,91.1 L187.1,92.6 L189.0,94.0 L190.9,95.2 L192.9,96.4 L194.8,97.4 L196.8,98.3 L198.8,99.2 L200.7,100.0 L202.7,100.7 L204.6,101.4 L206.6,102.1 L208.5,102.7 L210.4,103.2 L212.4,103.8 L214.4,104.2 L216.3,104.7 L218.2,105.1 L220.2,105.6 L222.1,105.9 L224.1,106.3 L226.1,106.7 L228.0,107.0 L229.9,107.3 L231.9,107.6 L233.8,107.9 L235.8,108.2 L237.8,108.4 L239.7,108.7 L241.7,108.9 L243.6,109.2 L245.6,109.4 L247.5,109.6 L249.4,109.8 L251.4,110.0 L253.3,110.2 L255.3,110.4 L257.2,110.5 L259.2,110.7 L261.1,110.9 L263.1,111.0 L265.1,111.2 L267.0,111.3 L268.9,111.5 L270.9,111.6 L272.9,111.7 L274.8,111.9 L276.8,112.0 L278.7,112.1 L280.6,112.2 L282.6,112.4 L284.5,112.5 L286.5,112.6 L288.5,112.7 L290.4,112.8 L292.4,112.9 L294.3,113.0 L296.2,113.1 L298.2,113.2 L300.1,113.2 L302.1,113.3 L304.0,113.4\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2\"/><path d=\"M140.2,224.0 L138.3,206.7 L136.3,194.3 L134.4,185.0 L132.4,177.8 L130.5,172.0 L128.6,167.3 L126.6,163.3 L124.7,160.0 L122.7,157.1 L120.8,154.7 L118.8,152.5 L116.8,150.6 L114.9,148.9 L112.9,147.4 L111.0,146.0 L109.1,144.8 L107.1,143.6 L105.2,142.6 L103.2,141.7 L101.2,140.8 L99.3,140.0 L97.3,139.3 L95.4,138.6 L93.5,137.9 L91.5,137.3 L89.6,136.8 L87.6,136.2 L85.6,135.8 L83.7,135.3 L81.8,134.9 L79.8,134.4 L77.9,134.1 L75.9,133.7 L74.0,133.3 L72.0,133.0 L70.1,132.7 L68.1,132.4 L66.1,132.1 L64.2,131.8 L62.2,131.6 L60.3,131.3 L58.4,131.1 L56.4,130.8 L54.5,130.6 L52.5,130.4 L50.6,130.2 L48.6,130.0 L46.7,129.8 L44.7,129.6 L42.8,129.5 L40.8,129.3 L38.9,129.1 L36.9,129.0 L35.0,128.8 L33.0,128.7 L31.0,128.5 L29.1,128.4 L27.2,128.3 L25.2,128.1 L23.2,128.0 L21.3,127.9 L19.4,127.8 L17.4,127.6 L15.5,127.5 L13.5,127.4 L11.5,127.3 L9.6,127.2 L7.7,127.1 L5.7,127.0 L3.8,126.9 L1.8,126.8 L-0.1,126.8 L-2.1,126.7 L-4.0,126.6\" fill=\"none\" stroke=\"#4A43C4\" stroke-width=\"2\"/><line x1=\"6\" y1=\"120\" x2=\"294\" y2=\"120\" stroke=\"#C77A15\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><line x1=\"150\" y1=\"8\" x2=\"150\" y2=\"234\" stroke=\"#C77A15\" stroke-width=\"1.3\" stroke-dasharray=\"5 3\"/><text x=\"250\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#C77A15\">y=1</text><text x=\"154\" y=\"20\" text-anchor=\"start\" font-size=\"9\" font-weight=\"700\" fill=\"#C77A15\">x=2</text><text x=\"150\" y=\"228\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#4a4a5e\">y = 6/(x−2) + 1：渐近线移到 x=2, y=1</text></svg></div>\n <div class=\"example\"><div class=\"ex-title\">Example 例题</div>\n   <div class=\"steps\"><div class=\"step\">State the asymptotes of y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">6</span><span style=\"padding:0 3px\">x − 2</span></span> + 1.</div>\n   <div class=\"step\">Vertical: x − 2 = 0 ⇒ x = 2. Horizontal: y = 1.</div></div>\n   <div class=\"ex-ans\">asymptotes <b>x = 2</b> and <b>y = 1</b></div></div>\n <div class=\"practice\"><div class=\"practice-head\">Practice 练习</div>\n   <ol><li>State the asymptotes of y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">3</span><span style=\"padding:0 3px\">x + 1</span></span> − 2.</li>\n   <li>The curve y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> is shifted to have asymptotes x = 3 and y = −1. Write its equation (with k).</li></ol>\n   <button class=\"reveal\" onclick=\"ans(this)\">Show answer 显示答案</button>\n   <div class=\"answer\"><div class=\"answer-inner\">1) <b>x = −1 and y = −2</b>　2) y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x − 3</span></span> − 1</div></div></div>"}, {"key": "end", "nav": "Summary 小结", "num": "", "track": false, "title": "Summary & where this leads", "zh": "小结与它通向哪里", "body": "\n <div class=\"terms\" style=\"background:#EEF0FC;border-color:#D9DCF6;color:#2E2A6B\"><b>One-line 一句话：</b>y = <span class=\"fr\" style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05\"><span style=\"border-bottom:1.4px solid currentColor;padding:0 3px\">k</span><span style=\"padding:0 3px\">x</span></span> is a hyperbola with asymptotes x = 0, y = 0; the rectangle to the axes has area |k|; shifting gives asymptotes x = a, y = b. 双曲线，渐近线 x=0、y=0；到两轴的矩形面积=|k|；平移后渐近线移到 x=a、y=b。</div>\n <h3 class=\"blk\">This unlocks 它解锁了</h3>\n <p class=\"zh\">反比例函数往下通向：<b>反比例 + 相似</b>（用矩形面积 = |k| 求 k，光剑高频）、<b>坐标几何</b>里的曲线，以及 A-Level 的<b>有理函数与渐近线</b>。</p>\n <div class=\"check-list\">\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会由一点求 k、判断两支所在象限</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">理解渐近线：无限靠近但永不相交（x=0, y=0）</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会用\"矩形面积 = |k|\"（接相似）</div></div>\n   <div class=\"check-item\" onclick=\"tick(this)\"><div class=\"check-box\"></div><div class=\"check-txt\">会平移后写出新渐近线 x=a, y=b</div></div>\n </div>\n <div class=\"parent\"><h4>给家长的话</h4><p style=\"margin:0;font-size:14px;color:#4a4a5e\">渐近线是英文卷和 A-Level 的重要概念，初中人教/浙教版讲得浅。这份用\"越除越小、除0爆炸\"的直觉把渐近线讲透，并接上她已学的相似（矩形面积=|k|）。抛物线没有渐近线——渐近线只出现在反比例这类曲线上，这点要跟她说清。</p></div>"}];
const tocList=document.getElementById('tocList'),content=document.getElementById('content'),progFill=document.getElementById('progFill'),progLabel=document.getElementById('progLabel'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),doneBtn=document.getElementById('doneBtn');
let cur=0;const done=new Set();const trackedTotal=S.filter(s=>s.track).length;
S.forEach((s,i)=>{const a=document.createElement('a');a.dataset.i=i;a.innerHTML=`<span class="n">${s.num||'·'}</span><span class="lbl">${s.nav}</span><span class="tick"></span>`;a.onclick=()=>go(i);tocList.appendChild(a);});
const tocLinks=[...tocList.children];
function render(){
  const s=S[cur];
  const tierHtml = s.tier?`<span class="badge ${s.tier}">${s.tier}</span>`:'';const gkHtml = s.badge==='gk'?'<span class="badge gk">★ Often tested 常考</span>':s.badge==='hard'?'<span class="badge hard">★ Harder 难题</span>':s.badge==='core'?'<span class="badge core">★ Must-know 必背</span>':'';const badgeHtml = tierHtml+gkHtml;
  const zt = s.zh?`<div class="zh-title">${s.zh}</div>`:'';
  content.innerHTML=`<div class="sec-head">${s.num?`<div class="sec-num">${s.num}</div>`:''}<div class="sec-titles"><h2>${s.title}</h2>${zt}${badgeHtml}</div></div><div class="divider"></div>${s.body}`;
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
  prevBtn.disabled=cur===0;nextBtn.disabled=cur===S.length-1;
  if(s.track){doneBtn.style.display='';const d=done.has(cur);doneBtn.textContent=d?'Done 已学完 ✓':'Done 学完了 ✓';doneBtn.classList.toggle('is-done',d);}else{doneBtn.style.display='none';}
  content.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});
}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));render();closeMenu();}
prevBtn.onclick=()=>go(cur-1);nextBtn.onclick=()=>go(cur+1);
doneBtn.onclick=()=>{if(!S[cur].track)return;if(done.has(cur))done.delete(cur);else done.add(cur);updateProgress();render();if(done.has(cur)&&cur<S.length-1)setTimeout(()=>go(cur+1),260);};
function updateProgress(){const n=[...done].filter(i=>S[i].track).length;progFill.style.width=(n/trackedTotal*100)+'%';progLabel.textContent=`${n} / ${trackedTotal}`;tocLinks.forEach((a,i)=>a.classList.toggle('done',done.has(i)&&S[i].track));}
function ans(btn){const box=btn.nextElementSibling;const open=box.classList.toggle('open');btn.textContent=open?btn.textContent.replace('Show','Hide').replace('显示','隐藏'):btn.textContent.replace('Hide','Show').replace('隐藏','显示');}
function tick(el){el.classList.toggle('on');}
const PASCAL_EXP={0:'(a+b)⁰ = 1',1:'(a+b)¹ = a + b',2:'(a+b)² = a² + 2ab + b²',3:'(a+b)³ = a³ + 3a²b + 3ab² + b³',4:'(a+b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴',5:'(a+b)⁵ = a⁵ + 5a⁴b + 10a³b² + 10a²b³ + 5ab⁴ + b⁵',6:'(a+b)⁶ = a⁶ + 6a⁵b + 15a⁴b² + 20a³b³ + 15a²b⁴ + 6ab⁵ + b⁶'};
function pascalPick(r){document.querySelectorAll('#pascalTri .prow').forEach(el=>el.classList.toggle('sel',+el.dataset.r===r));const out=document.getElementById('pascalOut');if(out)out.innerHTML='Row 第 '+r+' 行 → <b>'+PASCAL_EXP[r]+'</b>';}
const toc=document.getElementById('toc'),scrim=document.getElementById('scrim');
document.getElementById('menuBtn').onclick=()=>{toc.classList.add('open');scrim.classList.add('show');};
function closeMenu(){toc.classList.remove('open');scrim.classList.remove('show');}
scrim.onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'&&cur<S.length-1)go(cur+1);if(e.key==='ArrowLeft'&&cur>0)go(cur-1);});
render();updateProgress();
</script>
